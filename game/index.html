<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TOKIO NEON — HELI RESCUE</title>
<style>
  /* ============================================================================
     HUD DESIGN TOKENS — the single source of truth for the whole instrument set.
     One turquoise scanner palette, one type scale, one 4px spacing grid. The
     canvas HUD mirrors these exactly in the JS `UI` object (see drawHUD section):
     change a value here and change it there, and nowhere else.
     ========================================================================== */
  :root {
    /* palette: turquoise on near-black, with three signal colours and nothing else */
    --ui:        #5ff2ff;                  /* primary turquoise — structure, labels, ticks */
    --ui-hi:     #e8feff;                  /* bright readouts — the numbers you actually read */
    --ui-dim:    rgba(95,242,255,.46);     /* secondary text, minor ticks */
    --ui-faint:  rgba(95,242,255,.15);     /* grid lines, inactive chrome */
    --ui-warn:   #ffc23a;                  /* caution / selected weapon */
    --ui-alert:  #ff3b52;                  /* threat / critical only */
    --ui-ok:     #46e08a;                  /* healthy / positive only */
    /* surfaces */
    --ui-fill:   rgba(1,12,18,.74);        /* standard panel ground — dark enough to read over neon */
    --ui-solid:  rgba(1,12,18,.90);        /* panels that must stay readable over neon */
    --ui-line:   rgba(95,242,255,.38);     /* the one hairline border weight */
    --ui-glow:   0 0 6px rgba(95,242,255,.45);
    /* type — mono, uppercase, letterspaced. Four sizes, no more. */
    --f: 'Courier New',monospace;
    --t-micro: 9px;                        /* unit suffixes, sub-labels */
    --t-label: 10px;                       /* field names, headers */
    --t-body:  11px;                       /* prose: objectives, dialogue */
    --t-val:   14px;                       /* numeric readouts */
    /* spacing: 4px grid */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
  body { overflow:hidden; background:#000; font-family:var(--f); }
  #c { display:block; }
  #hud { position:absolute; inset:0; pointer-events:none; z-index:6; }
  #vignette { position:absolute; inset:0; pointer-events:none; z-index:4;
    background:radial-gradient(ellipse at center, transparent 50%, rgba(6,4,18,.55) 100%); }
  #grain { position:absolute; inset:0; pointer-events:none; opacity:.05; mix-blend-mode:overlay; z-index:4;
    background-image:repeating-conic-gradient(#000 0 .0001%, #fff 0 .0002%); background-size:180px 180px; }
  .hud { position:absolute; color:var(--ui); text-shadow:var(--ui-glow); user-select:none; pointer-events:none; z-index:8; font-family:var(--f); }
  /* ONE panel chrome for every DOM panel: hairline border, translucent ground, and a
     bracketed pair of opposite corners — the scanner-frame motif, nothing else. */
  .panel { background:var(--ui-fill); border:1px solid var(--ui-line); }
  .panel::before, .panel::after { content:''; position:absolute; width:9px; height:9px; pointer-events:none; }
  .panel::before { top:-1px; left:-1px; border-top:2px solid var(--ui); border-left:2px solid var(--ui); }
  .panel::after  { bottom:-1px; right:-1px; border-bottom:2px solid var(--ui); border-right:2px solid var(--ui); }
  /* shared micro-label: the "SYS: ONLINE" voice used for every field name */
  .lbl { font-size:var(--t-label); letter-spacing:.14em; color:var(--ui-dim); text-transform:uppercase; }

  #msg { top:34%; left:50%; transform:translate(-50%,-50%); font-size:26px; font-weight:bold; text-align:center; display:none;
    color:var(--ui-hi); text-shadow:0 0 14px var(--ui); width:90%; letter-spacing:.16em; }
  /* Bottom command stack: radio line above the command box, in one column. Widths are
     capped so 210px stays clear each side — TSD on the left, control cluster on the right. */
  #cmdStack { bottom:104px; left:50%; transform:translateX(-50%);
    width:min(560px, calc(100vw - 420px)); display:flex; flex-direction:column; align-items:center; gap:var(--s2); }
  #radioSub { max-width:100%; text-align:center; font-size:var(--t-body);
    color:var(--ui-warn); text-shadow:0 0 6px #000; opacity:0; transition:opacity .4s; letter-spacing:.06em; }
  #taskPanel { max-width:100%; text-align:center;
    font-size:var(--t-body); line-height:1.55; letter-spacing:.08em; color:var(--ui-hi); padding:var(--s2) var(--s4); }
  #taskPanel:empty { display:none; }            /* no empty bordered box while a dialogue is up */
  #dialog { left:50%; bottom:96px; transform:translateX(-50%); width:min(680px,88vw); display:none;
    background:var(--ui-solid); padding:var(--s3) var(--s4) 10px; z-index:12; box-shadow:0 0 26px rgba(0,0,0,.7); }
  #dlgWho { font-size:var(--t-label); letter-spacing:.14em; color:var(--ui); margin-bottom:var(--s1); text-transform:uppercase; }
  #dlgTxt { font-size:var(--t-body); line-height:1.65; color:var(--ui-hi); min-height:42px; }
  #dlgTxt .item  { color:var(--ui-warn); font-weight:bold; }
  #dlgTxt .place { color:var(--ui); font-weight:bold; }
  #dlgHint { font-size:var(--t-micro); letter-spacing:.1em; color:var(--ui-dim); text-align:right; margin-top:var(--s2); }
  #intelLog { right:var(--s3); top:168px; width:262px; font-size:var(--t-body); line-height:1.55; color:var(--ui-hi);
    padding:var(--s2) 10px; display:none;
    max-height:calc(100vh - 168px - 252px);      /* clears ARMAMENT above, cluster below */
    overflow-y:auto; scrollbar-width:thin; }
  #intelLog b { color:var(--ui); letter-spacing:.14em; }
  #intelLog .ros { display:flex; flex-direction:column; gap:var(--s1); margin-top:var(--s2); }
  #intelLog .cm { display:flex; align-items:center; gap:var(--s2);
    background:rgba(95,242,255,.05); border:1px solid var(--ui-faint); padding:3px 5px; }
  #intelLog .cm.unk { opacity:.42; filter:grayscale(1); }      /* not yet located */
  #intelLog .cm img { width:34px; height:34px; display:block; image-rendering:pixelated; }
  #intelLog .cmi { display:flex; flex-direction:column; line-height:1.25; flex:1; min-width:0; }
  #intelLog .cmi b { font-size:var(--t-label); letter-spacing:.1em; }
  #intelLog .rl { font-size:var(--t-micro); color:var(--ui-dim); }
  #intelLog .pk { font-size:var(--t-micro); color:var(--ui-warn); }
  #intelLog .st { font-size:8px; letter-spacing:.1em; padding:2px 4px; border:1px solid currentColor; white-space:nowrap; }
  #intelLog .st-mis { color:var(--ui-dim); }
  #intelLog .st-loc { color:var(--ui); }
  #intelLog .st-ab  { color:var(--ui-warn); }
  #intelLog .st-home{ color:var(--ui-ok); }
  #intelLog .lead { font-size:var(--t-micro); color:var(--ui-hi); opacity:.85;
    padding:2px 5px 5px; border-left:1px solid var(--ui-faint); margin:0 0 2px 6px; }
  #intelLog .cw { color:var(--ui-warn); }
  #intelLog .done { color:var(--ui-dim); text-decoration:line-through; }
  #help { bottom:var(--s2); left:50%; transform:translateX(-50%); font-size:var(--t-micro); letter-spacing:.06em;
    color:var(--ui-dim); opacity:.8; text-align:center; width:95%; transition:opacity 1.2s; text-shadow:0 0 4px #000; }
  /* TSD — the scanner. Title bar sits flush on top of the map, one continuous frame. */
  #tacwrap { bottom:var(--s4); left:var(--s3); display:flex; flex-direction:column; }
  #tacTitle { font-size:var(--t-label); letter-spacing:.16em; color:var(--ui); background:var(--ui-solid);
    border:1px solid var(--ui-line); border-bottom:none; padding:3px var(--s2); width:max-content; min-width:148px; }
  #tacmap { background:#00090e; border:1px solid var(--ui-line);
    box-shadow:inset 0 0 18px rgba(0,0,0,.9), 0 0 12px rgba(95,242,255,.14); }
  /* ---- HELI CONTROL CLUSTER ----------------------------------------------------
     One right-edge control column on a strict pitch, with the fire button as the
     only round, only red element. Geometry lives in these four vars so the whole
     cluster moves and rescales together instead of drifting per-button. */
  :root { --btn:60px; --btn-pitch:68px; --col:138px; --edge:20px; --floor:48px; }
  .tbtn { position:absolute; pointer-events:auto; user-select:none; -webkit-user-select:none; z-index:9;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--ui);
    font-family:var(--f); font-weight:700; letter-spacing:.14em;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:transform .08s ease, box-shadow .15s ease, filter .15s ease; }
  .tbtn .ic { font-size:18px; line-height:1; filter:drop-shadow(0 0 5px currentColor); }
  .tbtn .lb { font-size:var(--t-micro); opacity:.92; }
  .tbtn:active { transform:scale(.93); }
  /* square-ish MFD key: flat panel ground, hairline edge, bracketed top-left corner */
  .mfd { width:var(--btn); height:var(--btn); border-radius:4px;
    background:var(--ui-solid); border:1px solid var(--ui-line);
    box-shadow:inset 0 0 14px rgba(0,40,54,.55), 0 0 10px rgba(95,242,255,.10); }
  .mfd::before { content:''; position:absolute; top:3px; left:3px; width:8px; height:8px;
    border-top:2px solid var(--ui); border-left:2px solid var(--ui); opacity:.55; pointer-events:none; }
  .mfd:hover { filter:brightness(1.18); box-shadow:inset 0 0 16px rgba(0,54,74,.6), 0 0 18px rgba(95,242,255,.3); }
  .mfd.on { color:var(--ui-hi); border-color:var(--ui);
    background:rgba(12,52,64,.92); box-shadow:inset 0 0 16px rgba(0,86,110,.6), 0 0 20px rgba(95,242,255,.42); }
  #stick-zone { position:absolute; left:0; bottom:0; width:45%; height:55%; pointer-events:auto; z-index:7; }
  #stick-base { position:absolute; width:110px; height:110px; border-radius:50%; border:1px solid var(--ui-line);
    background:rgba(1,12,18,.34); display:none; z-index:9; box-shadow:0 0 12px rgba(95,242,255,.12); }
  #stick-knob { position:absolute; width:46px; height:46px; border-radius:50%; background:rgba(95,242,255,.30);
    border:1px solid var(--ui); display:none; z-index:9; box-shadow:0 0 14px rgba(95,242,255,.4); }
  /* the column, bottom-up: WPN, HVR, CAM — all on one pitch, flush with the fire button's floor */
  #wpnBtn  { right:var(--col); bottom:var(--floor); }
  #stopBtn { right:var(--col); bottom:calc(var(--floor) + var(--btn-pitch)); }
  #camBtn  { right:var(--col); bottom:calc(var(--floor) + var(--btn-pitch) * 2); }
  #fireBtn { right:var(--edge); bottom:var(--floor); width:104px; height:104px; border-radius:50%; color:#ff9aa6;
    background:radial-gradient(circle at 50% 36%, rgba(88,14,24,.96), rgba(26,4,10,.97));
    border:1px solid rgba(255,59,82,.85);
    box-shadow:inset 0 0 24px rgba(255,59,82,.28), 0 0 26px rgba(255,59,82,.34), 0 6px 16px rgba(0,0,0,.6); }
  #fireBtn::before { content:''; position:absolute; inset:7px; border-radius:50%; border:1px dashed rgba(255,120,134,.4);
    animation:fireRing 9s linear infinite; pointer-events:none; }
  #fireBtn .ic { font-size:24px; }
  #fireBtn .lb { font-size:var(--t-label); letter-spacing:.28em; }
  #fireBtn:active { filter:brightness(1.25); box-shadow:inset 0 0 30px rgba(255,59,82,.5), 0 0 40px rgba(255,59,82,.7); }
  /* ---- ON-FOOT MODE: swap the flight cluster for the two controls that mean something
     indoors, and drop the city tactical map, which shows nothing useful from inside. */
  .foot { display:none; }
  body.on-foot .foot { display:flex; }
  body.on-foot #fireBtn, body.on-foot #camBtn, body.on-foot #wpnBtn,
  body.on-foot #stopBtn, body.on-foot #tacwrap { display:none; }
  #talkBtn { right:var(--col); bottom:var(--floor); }
  #exitBtn { right:var(--edge); bottom:var(--floor); }
  @keyframes fireRing { to { transform:rotate(360deg); } }
  /* ---- COMPACT: phones and short windows ------------------------------------
     Everything here is an override of the four cluster vars plus a few panel
     positions. At 560x420 the column overlapped the altitude tape and the TSD
     ran into the command box; this lays the keys out along the bottom instead. */
  @media (max-width:620px), (max-height:520px) {
    :root { --btn:48px; --btn-pitch:56px; --col:106px; --edge:12px; --floor:36px; }
    #fireBtn { width:82px; height:82px; }
    #fireBtn .lb { font-size:var(--t-micro); letter-spacing:.2em; }
    #wpnBtn  { right:var(--col); bottom:var(--floor); }
    #stopBtn { right:calc(var(--col) + var(--btn-pitch)); bottom:var(--floor); }
    #camBtn  { right:calc(var(--col) + var(--btn-pitch) * 2); bottom:var(--floor); }
    #tacwrap { transform:scale(.66); transform-origin:bottom left; bottom:6px; left:6px; }
    #cmdStack { bottom:148px; width:min(340px,74vw); gap:var(--s1); }   /* clears the scaled TSD */
    #taskPanel { font-size:var(--t-micro); padding:6px 10px; }
    #radioSub { font-size:var(--t-micro); }
    #dialog { bottom:132px; width:min(440px,92vw); padding:9px 12px 8px; }
    /* Compact has no room for a full dossier beside the command stack and the fire
       button, so it degrades to a narrow avatar strip: face, callsign, status. The
       lead text and perk line are dropped — they are still read out over the radio. */
    #intelLog { top:152px; width:96px; font-size:var(--t-micro); line-height:1.3; padding:4px;
      max-height:calc(100vh - 152px - 132px); }
    #intelLog .cm { flex-direction:column; gap:1px; padding:2px; text-align:center; }
    #intelLog .cm img { width:30px; height:30px; }
    #intelLog .cmi { align-items:center; }
    #intelLog .rl, #intelLog .pk, #intelLog .lead { display:none; }
    #intelLog .st { font-size:7px; padding:1px 2px; }
    #help { display:none; }
  }
  /* ---- NEON TITLE WORDMARK ---- */
  .logo { display:flex; flex-direction:column; align-items:center; gap:4px; line-height:.9; }
  .logo-main { font-family:'Arial Black',Impact,sans-serif; font-weight:900; font-size:66px; letter-spacing:1px; font-style:italic;
    background:linear-gradient(180deg,#ffffff 0%,#8be9ff 42%,#33c7ff 56%,#0a6fb0 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
    filter:drop-shadow(0 0 2px #bff3ff) drop-shadow(0 0 16px #23c6ff); }
  .logo-main em { font-style:italic; margin-left:.16em;
    background:linear-gradient(180deg,#ffffff 0%,#ffb0e6 45%,#ff2f8f 60%,#a01560 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 16px #ff2f8f); }
  .logo-jp { font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Noto Sans JP','MS Gothic',sans-serif; font-weight:700; font-size:19px; letter-spacing:8px; color:#ffd84d; text-shadow:0 0 12px #ff9e2e; padding-left:8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div><div id="grain"></div>
<canvas id="hud"></canvas>

<div class="hud" id="msg"></div>
<div class="hud" id="cmdStack">
  <div id="radioSub">RADIO</div>
  <div class="panel" id="taskPanel">STANDBY</div>
</div>
<div class="hud panel" id="intelLog"></div>
<div class="hud panel" id="dialog"><div id="dlgWho"></div><div id="dlgTxt"></div><div id="dlgHint">▼ press F to continue</div></div>
<div class="hud" id="help">STEER WASD / ARROWS · FIRE SPACE · WEAPON 1-4 · C COCKPIT · X HOVER · E ENTER VENUE ON THE PAD · F TALK</div>

<div class="hud" id="tacwrap">
  <div id="tacTitle">TSD · GRID SHINJUKU-EAST</div>
  <canvas id="tacmap" width="158" height="158"></canvas>
</div>

<div id="stick-zone"></div>
<div id="stick-base"></div><div id="stick-knob"></div>
<div class="tbtn" id="fireBtn"><span class="ic">⌖</span><span class="lb">FIRE</span></div>
<div class="tbtn mfd" id="camBtn"><span class="ic">◎</span><span class="lb">CAM</span></div>
<div class="tbtn mfd" id="wpnBtn"><span class="ic">◈</span><span class="lb">WPN</span></div>
<div class="tbtn mfd" id="stopBtn" onpointerdown="window.__throttleTarget=(window.__throttleTarget===undefined||window.__throttleTarget>0.5)?0:1;event.preventDefault();"><span class="ic">⇅</span><span class="lb">HVR</span></div>
<div class="tbtn mfd foot" id="talkBtn"><span class="ic">☰</span><span class="lb">TALK</span></div>
<div class="tbtn mfd foot" id="exitBtn"><span class="ic">⤴</span><span class="lb">EXIT</span></div>


<script>
if(!window.storage){window.storage={_m:{},get(k){return Promise.resolve(this._m[k]?{value:this._m[k]}:null);},set(k,v){this._m[k]=v;return Promise.resolve();}};}
</script>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="SkeletonUtils.js"></script>
<script src="Reflector.js"></script>
<script src="models-zombie.js"></script>
<script>
const W=()=>innerWidth,H=()=>innerHeight;
// PERF: logarithmicDepthBuffer dropped (it disabled early-Z and cost a per-fragment depth write
// everywhere); the compressed 0.5–2600 near/far range below already tames z-fighting. pixelRatio
// capped tighter (1.5) — the scene is fragment-bound (emissive + normal maps), so this is the single
// biggest FPS lever on hi-DPI screens. PCF (not PCFSoft) shadows are markedly cheaper to filter.
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,powerPreference:'high-performance'});
renderer.setSize(W(),H());
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
// device-pixel render size: the scene render target must match the canvas' actual pixel buffer,
// otherwise the 3D is rendered at 1x (CSS px) and upscaled to the device buffer -> soft/pixelated
// next to the crisp HUD. RW()/RH() give the true pixel dimensions to size sceneRT with.
const RS=()=>renderer.getPixelRatio();
const RW=()=>Math.max(2,Math.round(W()*RS())), RH=()=>Math.max(2,Math.round(H()*RS()));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;
// PERF: the sun is fixed and the city is static, yet the shadow map re-renders every shadow-caster
// every frame. Drive it manually (see loop) so it refreshes every 2nd frame — a full geometry pass
// saved on alternate frames, with imperceptible shadow lag on the few moving casters.
renderer.shadowMap.autoUpdate=false;
renderer.shadowMap.needsUpdate=true;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
const scene=new THREE.Scene();
// night neon haze — deep indigo, layered with a low warm ground-haze band (see groundHaze below)
scene.fog=new THREE.FogExp2(0x1c1732,0.00165);
// near raised from 0.1 and far cut from 4000 (biggest fixed scene radius is the sky sphere at 2000)
// to compress the depth range and kill high-altitude z-fighting/shimmer; 0.5 still clears the closest
// 3D cockpit dash geometry (~1.2 units from camera) so cockpit view (press C) is unaffected.
const cam=new THREE.PerspectiveCamera(66,W()/H(),0.5,2600);window.cam=cam;

// PERF helper: merge several same-material geometries (each with a local transform) into ONE
// BufferGeometry, so e.g. a car's 4 wheels become a single mesh / draw call. No addons needed.
function mergeGeos(geoms,matrices){
  const P=[],N=[],U=[],nrm=new THREE.Matrix3(),v=new THREE.Vector3(),nv=new THREE.Vector3();
  geoms.forEach((g,i)=>{
    const gg=g.index?g.toNonIndexed():g, p=gg.attributes.position, n=gg.attributes.normal, u=gg.attributes.uv, m=matrices[i];
    nrm.getNormalMatrix(m);
    for(let k=0;k<p.count;k++){
      v.fromBufferAttribute(p,k).applyMatrix4(m);P.push(v.x,v.y,v.z);
      if(n){nv.fromBufferAttribute(n,k).applyMatrix3(nrm).normalize();N.push(nv.x,nv.y,nv.z);}
      if(u)U.push(u.getX(k),u.getY(k));
    }
  });
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  if(N.length)out.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));
  if(U.length)out.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));
  return out;
}
// build a merged 4-wheel (or 4-hub) set from one cylinder geo at the given [x,y,z] offsets, axle along X
function wheelSetGeo(cyl,offsets){
  const M=[],e=new THREE.Euler(0,0,Math.PI/2);
  return mergeGeos(offsets.map(()=>cyl), offsets.map(o=>{const m=new THREE.Matrix4();m.compose(new THREE.Vector3(o[0],o[1],o[2]),new THREE.Quaternion().setFromEuler(e),new THREE.Vector3(1,1,1));M.push(m);return m;}));
}

// ---------- POST-PROCESSING: manual bloom (no addons available, hand-rolled) ----------
// two-tier mip-style bloom (tight + wide) for a soft, filmic, non-shimmery neon glow
let bw=Math.floor(W()/3),bh=Math.floor(H()/3);
let bw2=Math.max(2,Math.floor(bw/2)),bh2=Math.max(2,Math.floor(bh/2));
const rtParams={minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat};
const sceneRT=new THREE.WebGLRenderTarget(RW(),RH(),rtParams);
const brightRT=new THREE.WebGLRenderTarget(bw,bh,rtParams);
const blurRT1=new THREE.WebGLRenderTarget(bw,bh,rtParams);
const blurRT2=new THREE.WebGLRenderTarget(bw,bh,rtParams);
const wideRT1=new THREE.WebGLRenderTarget(bw2,bh2,rtParams);
const wideRT2=new THREE.WebGLRenderTarget(bw2,bh2,rtParams);
const postScene=new THREE.Scene();
const postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const brightMat=new THREE.ShaderMaterial({
  uniforms:{tDiffuse:{value:null},threshold:{value:0.63},knee:{value:0.5}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float threshold;uniform float knee;varying vec2 vUv;
    void main(){
      vec4 c=texture2D(tDiffuse,vUv);
      float b=max(c.r,max(c.g,c.b));
      // soft-knee threshold: smooth quadratic rolloff instead of a hard cutoff, avoids per-pixel flicker
      float soft=clamp(b-threshold+knee,0.0,2.0*knee);
      soft=soft*soft/(4.0*knee+0.0001);
      float f=max(soft,b-threshold);
      f=clamp(f/max(b,0.0001),0.0,1.0);
      gl_FragColor=vec4(c.rgb*f,1.0);
    }`
});
const blurMat=new THREE.ShaderMaterial({
  uniforms:{tDiffuse:{value:null},dir:{value:new THREE.Vector2(1,0)},res:{value:new THREE.Vector2(bw,bh)}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}`,

      sum+=texture2D(tDiffuse,vUv-2.0*texel)*0.12;
      sum+=texture2D(tDiffuse,vUv-1.0*texel)*0.15;
      sum+=texture2D(tDiffuse,vUv)*0.18;
      sum+=texture2D(tDiffuse,vUv+1.0*texel)*0.15;
      sum+=texture2D(tDiffuse,vUv+2.0*texel)*0.12;
      sum+=texture2D(tDiffuse,vUv+3.0*texel)*0.09;

  uniforms:{tScene:{value:null},tBloom:{value:null},tBloomWide:{value:null},bloomStrength:{value:0.6},bloomWideStrength:{value:0.4}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}`,
  fragmentShader:`uniform sampler2D tScene;uniform sampler2D tBloom;uniform sampler2D tBloomWide;uniform float bloomStrength;uniform float bloomWideStrength;varying vec2 vUv;
    void main(){

      vec2 off=cc*(0.0007+0.0016*r2);

let AC=null;
let rotorGainNode=null; // exposed ref to the rotor bed's gain so a transmission can duck it, then restore
let radioSpeaking=false; // throttle flag: only one command line audible at a time, never overlapping
let radioHissSrc=null,radioHissGain=null; // active under-voice static bed nodes, torn down when the line ends
// Tiny high-passed noise tick that mimics a PTT mic key/un-key ("kss") — bookends the squelch beeps.
function radioMicKey(){
  if(!AC)return;
  try{
    const t=AC.currentTime,dur=0.035;
    const len=Math.max(1,Math.floor(dur*AC.sampleRate)),buf=AC.createBuffer(1,len,AC.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1);
    const s=AC.createBufferSource();s.buffer=buf;
    const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=2600;
    const g=AC.createGain();g.gain.setValueAtTime(0.045,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(hp);hp.connect(g);g.connect(AC.destination);s.start(t);
  }catch(e){}
}
// Squelch bookend: bandpass noise chirp + a rising (open) or falling (close) beep — reuses the same
// WebAudio synth style as the rest of the sfx, no new assets. This is the part that actually reads as
// "radio" since speechSynthesis output can't be routed through the WebAudio graph for filtering.
function radioSquelch(open){
  if(!AC)return;
  try{
    const t=AC.currentTime,dur=0.09;
    const len=Math.max(1,Math.floor(dur*AC.sampleRate)),buf=AC.createBuffer(1,len,AC.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1);
    const s=AC.createBufferSource();s.buffer=buf;
    const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=3;
    const g=AC.createGain();g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(bp);bp.connect(g);g.connect(AC.destination);s.start(t);
    const click=AC.createOscillator();click.type='square';
    if(open){click.frequency.setValueAtTime(900,t);click.frequency.exponentialRampToValueAtTime(1700,t+0.05);}
    else{click.frequency.setValueAtTime(1700,t);click.frequency.exponentialRampToValueAtTime(650,t+0.05);}
    const cg=AC.createGain();cg.gain.setValueAtTime(0.03,t);cg.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    click.connect(cg);cg.connect(AC.destination);click.start(t);click.stop(t+0.07);
  }catch(e){}
}
// Low static/hiss bed that sits under the voice for the duration of the transmission — bandpass-filtered
// noise, looped, at low volume. Started when the channel opens, faded out and stopped when it closes.
function startRadioHiss(){
  if(!AC)return;
  try{
    const t=AC.currentTime,len=2*AC.sampleRate;
    const buf=AC.createBuffer(1,len,AC.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1);
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=300;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3000;
    const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.026,t+0.06);
    src.connect(hp);hp.connect(lp);lp.connect(g);g.connect(AC.destination);
    src.start(t);
    radioHissSrc=src;radioHissGain=g;
  }catch(e){radioHissSrc=null;radioHissGain=null;}
}
function stopRadioHiss(){
  if(!AC||!radioHissGain){radioHissSrc=null;radioHissGain=null;return;}
  try{
    const t=AC.currentTime;
    radioHissGain.gain.cancelScheduledValues(t);
    radioHissGain.gain.setValueAtTime(radioHissGain.gain.value,t);
    radioHissGain.gain.linearRampToValueAtTime(0,t+0.1);
    const src=radioHissSrc;
    setTimeout(()=>{try{src.stop();}catch(e){}},180);
  }catch(e){}
  radioHissSrc=null;radioHissGain=null;
}
// Nudges the rotor/engine bed's volume down while a transmission plays, restores it after — a small
// touch that makes the radio voice feel like it's cutting over the cockpit noise, like real comms.
function duckRotor(down){
  if(!AC||!rotorGainNode)return;

// REAL TOKYO SIDEWALK: cast concrete paver SLABS with per-slab tone variation, deep grimy joints,
// cracks that cross slabs, moss/dirt collecting in the seams, dark gum spots, damp water staining,
// and a continuous YELLOW TACTILE-PAVING (tenji) strip near the kerb — the signature Japanese
// street cue. Rendered at higher res + as a proper lit material (roughness map for damp patches)
// so it reads as gritty walked-on pavement, not a flat glowing tan rectangle.
function drawSidewalk(g,w,h){
  const cols=4,rows=5,cw=w/cols,ch=h/rows;

    // REAL weathered-concrete photo as the base (darkened to the night grade); the paver-slab
    // solid fills are skipped so the real grain shows — only joints/bevels/stains sit on top.
    g.drawImage(window.SIDE_IMG,0,0,window.SIDE_IMG.width,window.SIDE_IMG.height,0,0,w,h);
    g.fillStyle='rgba(10,10,13,0.5)';g.fillRect(0,0,w,h);

    }

    const x=cx*cw,y=cy*ch,t=30+Math.random()*22; // slab luminance (cool, brighter than the old warm 18-38)
    g.fillStyle=`rgb(${t},${t+2},${t+7})`;

    g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x+1.5,y+ch-3,cw-3,1.5);g.fillRect(x+cw-3,y+1.5,1.5,ch-3);

  for(let cy=0;cy<=rows;cy++){g.strokeStyle='rgba(0,0,0,.55)';g.beginPath();g.moveTo(0,cy*ch);g.lineTo(w,cy*ch);g.stroke();}
  for(let i=0;i<22;i++){g.fillStyle=`rgba(46,58,34,${0.18+Math.random()*0.3})`;const onV=Math.random()<0.5;if(onV){g.fillRect(Math.round(Math.random()*cols)*cw-1,Math.random()*h,2,4+Math.random()*10);}else{g.fillRect(Math.random()*w,Math.round(Math.random()*rows)*ch-1,4+Math.random()*10,2);}}

  for(let i=0;i<4;i++){
    if(Math.random()<0.4)continue;

    g.strokeStyle=`rgba(8,7,6,${0.35+Math.random()*0.3})`;g.lineWidth=1;
    g.beginPath();g.moveTo(x,y);

    g.fillStyle=`rgba(20,18,15,${0.3+Math.random()*0.4})`;g.beginPath();g.arc(sx,sy,sr,0,7);g.fill();
  }

    const sx=Math.random()*w,sy=Math.random()*h,sr=10+Math.random()*24;
    const gr=g.createRadialGradient(sx,sy,0,sx,sy,sr);

    g.fillStyle=gr;g.beginPath();g.arc(dx,dy,dR,0,7);g.fill();
  }
}

// build road strips (geometry length axis = local +y pre-rotation; rotation.z spins in-plane for x-running roads)
// ROUND-4 FIX for the "unnatural repeating stripe/banding": the old code shared ONE baked canvas
// per road class (major/strip/alley), CLONED across every road of that class (Texture.clone() only
// copies the reference to the same canvas image) and repeated it ~90-160 times down each road's
// length — so every avenue showed the identical dash/manhole/pothole pattern on a perfectly regular
// beat. Fix, kept cheap (small pools generated ONCE at init, not one fresh canvas per road — that
// was tried and cost ~9s of extra synchronous init time, so it's a bounded pool instead):
//  1. a POOL of independently-drawn variants per road class (no shared canvas within a pool)
//  2. each road draws a random pool member, so neighbouring roads of the same class rarely match
//  3. a much larger world-length represented per tile (+ per-road jitter + random offset), so even
//     a repeated variant tiles far less often and out of phase with any other road using it
//  4. the recognisable baked shapes that made repeats obvious (manhole, pothole blobs) were removed
//     from the tileable texture entirely — grain/oil/cracks read as continuous noise, not a pattern
const ROAD_POOL_MAJOR=[0,1,2].map(()=>makeMajorRoadTex());
const ROAD_POOL_STRIP=[0,1,2].map(()=>makeRoadStripTex());
const ROAD_POOL_ALLEY=[0,1].map(()=>makeAlleyTex());
const WETROUGH_POOL=[0,1,2,3].map(()=>makeWetRoughTex());
function pickPool(pool){return pool[Math.floor(Math.random()*pool.length)];}
function roadTexFor(r){
  const pool=r.major?ROAD_POOL_MAJOR:(r.w>10?ROAD_POOL_STRIP:ROAD_POOL_ALLEY);
  const t=pickPool(pool).clone();t.needsUpdate=true;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  const unitsPerTile=(r.major?72:40)*(0.82+Math.random()*0.36);
  t.repeat.set(1,CITY*2/unitsPerTile);
  t.offset.y=Math.random();
  return t;
}
// wet-look roughness map matched to a road strip's UV tiling — long vertical (along-road) streaks;
// picked from its own pool so the wet pattern doesn't repeat identically between roads
function roadWetRoughFor(r){
  const t=pickPool(WETROUGH_POOL).clone();t.needsUpdate=true;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  const unitsPerTile=(r.major?72:40)*(0.82+Math.random()*0.36);
  t.repeat.set(r.major?2:1,CITY*2/unitsPerTile);
  t.offset.y=Math.random();
  return t;
}
function addRoad(axis,r){
  // per-road base roughness jitter on top of the roughness MAP: some stretches read drier/rougher,
  // others glossier/wetter, instead of every road sharing one flat roughness value
  // Rebalanced toward grainy matte ASPHALT: base roughness raised (drier, less mirror) so the pebble
  // grain reads as texture instead of a glossy sheet. Because the surface is now rougher, the grain
  // normal can come up (0.10 -> 0.32) WITHOUT shattering into sparkle — a rough surface diffuses each
  // specular. The wet roughness MAP still darkens streaks/pools, so those keep a coherent neon shine.
  const baseRough=(r.major?0.52:0.56)+Math.random()*0.18;
  const mat=new THREE.MeshStandardMaterial({map:roadTexFor(r),normalMap:asphaltNormalTex,normalScale:new THREE.Vector2(0.36,0.36),roughness:baseRough,roughnessMap:roadWetRoughFor(r),metalness:0.07,envMapIntensity:1.0,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4});
  // clip the grid at the coastline so no street runs out into the bay
  if(axis==='z'&&r.p>SEA_Z0)return;                       // east-west road fully seaward: drop it
  const spanLen=axis==='x'?LAND_LEN:CITY*2;               // north-south roads end at the coast
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(r.w,spanLen),mat);
  mesh.rotation.set(-Math.PI/2,0,axis==='z'?Math.PI/2:0);

  else mesh.position.set(0,0.04,r.p);

  if(r.w<=10)return; // alleys: no sidewalks/curbs
  [-1,1].forEach(sd=>{
    const off=r.w/2+SW/2;

    // texture, the vertical side faces are the weathered kerb wall — real relief/depth instead
    // of a painted-flat decal, and one mesh instead of two (fewer draw calls than before).
    const boxGeo=axis==='x'?new THREE.BoxGeometry(SW,CURB_H,LAND_LEN):new THREE.BoxGeometry(CITY*2,CURB_H,SW);
    const sw2=new THREE.Mesh(boxGeo,[curbFaceMat,curbFaceMat,sidewalkMat,curbBottomMat,curbFaceMat,curbFaceMat]);
    if(axis==='x')sw2.position.set(r.p+sd*off,CURB_H/2,LAND_CZ);

// ---------- STREET-LEVEL RELIEF DETAIL: manholes, gutter drain grates, expansion-seam lines,
// and sparse kerb props (bollards/cones/barrier) — everything here is a handful of shared
// textures/materials driven through InstancedMesh, so hundreds of pieces cost only a few extra
// draw calls total (same budget discipline as the puddle system below). ----------
function scatterRoadPoints(count,minW){
  const pts=[];let tries=0;
  while(pts.length<count&&tries<count*4){
    tries++;
    const useX=Math.random()<0.5;
    const list=(useX?ROADS_X:ROADS_Z).filter(r=>r.w>minW);
    if(!list.length)continue;
    const r=list[Math.floor(Math.random()*list.length)];
    const along=(Math.random()-0.5)*CITY*1.9;
    const wx=useX?r.p:along, wz=useX?along:r.p;
    if(wx>RIVER.x0-8&&wx<RIVER.x1+8)continue; // skip the river band
    pts.push({useX,r,along,wx,wz});
  }
  return pts;
}
function buildRoadInstancedProp(geo,mat,count,minW,opts){
  opts=opts||{};
  const inst=new THREE.InstancedMesh(geo,mat,count);
  const dummy=new THREE.Object3D();
  const pts=scatterRoadPoints(count,minW);
  pts.forEach((p,i)=>{
    const lat=opts.lat?opts.lat(p):0;
    const wx=p.useX?p.r.p+lat:p.wx, wz=p.useX?p.wz:p.r.p+lat;
    const y=opts.y?opts.y(p):0.05;
    dummy.position.set(wx,y,wz);
    dummy.rotation.set(0,0,0);
    dummy.scale.set(1,1,1);
    if(opts.rot)opts.rot(dummy,p);
    if(opts.scale)opts.scale(dummy,p);
    dummy.updateMatrix();
    inst.setMatrixAt(i,dummy.matrix);
  });
  for(let i=pts.length;i<count;i++){dummy.position.set(0,-80,0);dummy.rotation.set(0,0,0);dummy.scale.set(0,0,0);dummy.updateMatrix();inst.setMatrixAt(i,dummy.matrix);}
  inst.instanceMatrix.needsUpdate=true;
  scene.add(inst);
  return inst;
}
// manhole / utility covers: WEATHERED, somewhat-broken cast iron. A damp seepage ring bleeds onto
// the asphalt around the rim, rust streaks stain the metal, a hairline crack splits the plate and

function makeManholeTex(square){return tex((g,w,h)=>{

// ---------- MOVING NIGHT-OCEAN WATER (real 3D waves via shader displacement) ----------
// A subdivided plane displaced in the vertex shader by summed sines (Gerstner-ish),
// with the surface normal recomputed analytically so the moonlight throws moving
// specular glints across the swells and foam catches the crests. Built on
// MeshStandardMaterial so scene fog + tone-mapping + bloom all keep working.
const __oceanMats=[]; // {uTime} uniforms, ticked each frame
const WAVE_GLSL=`
uniform float uTime; uniform float uAmp; varying float vFoam; varying float vCrest; varying vec2 vP;
float waveH(vec2 p){
  float t=uTime; float w=0.0;
  w += sin(p.x*0.055 + t*0.9)*2.2;
  w += sin(p.y*0.040 - t*0.7)*2.6;
  w += sin((p.x*0.030+p.y*0.050) + t*1.30)*1.4;
  w += sin((p.x*0.110 - p.y*0.070) - t*1.90)*0.7;
  w += sin((p.x*0.180 + p.y*0.140) + t*2.70)*0.35;
  return w*uAmp;
}
vec3 waveNormal(vec2 p){
  float e=1.5;
  float hx=waveH(p+vec2(e,0.0))-waveH(p-vec2(e,0.0));
  float hy=waveH(p+vec2(0.0,e))-waveH(p-vec2(0.0,e));
  return normalize(vec3(-hx/(2.0*e), -hy/(2.0*e), 1.0));
}`;
function makeOceanMat({color=0x0c2a44,amp=1.0,metalness=0.05,roughness=0.12,emissive=0x06121e,emissiveIntensity=0.5}={}){
  const m=new THREE.MeshStandardMaterial({color,metalness,roughness,emissive,emissiveIntensity});
  const uni={uTime:{value:Math.random()*40},uAmp:{value:amp}};
  m.onBeforeCompile=(sh)=>{
    sh.uniforms.uTime=uni.uTime; sh.uniforms.uAmp=uni.uAmp;
    sh.vertexShader=WAVE_GLSL+'\n'+sh.vertexShader
      .replace('#include <beginnormal_vertex>','vec3 objectNormal = waveNormal(position.xy);')
      .replace('#include <begin_vertex>','vec3 transformed=vec3(position); float _h=waveH(position.xy); transformed.z+=_h; vP=position.xy; vCrest=_h/max(uAmp*6.5,0.001); vFoam=smoothstep(0.60,0.98,vCrest);');
    sh.fragmentShader='varying float vFoam; varying float vCrest; varying vec2 vP; uniform float uTime;\n'+sh.fragmentShader
      // troughs darker / crests lighter so the swell reads as 3D even in weak light
      .replace('#include <color_fragment>','#include <color_fragment>\n diffuseColor.rgb *= 0.55 + 0.85*clamp(vCrest*0.5+0.5,0.0,1.0);')

function addNeonSigns(grp,bw,bd,bh,cx,cz){

  // draw calls stay in the same ballpark as before)
  // scale with height: a 280u tower needs far more signage than a 12u shophouse or it reads blank
  const count=Math.min(9,2+Math.floor(bh/26)+Math.floor(Math.random()*2)+(Math.random()<0.22?1:0));

    else if(nm.shape==='slim'){sh=Math.min(bh*0.62,13+Math.random()*15);sw=sh*(0.09+Math.random()*0.08);}

      else{sign.rotation.y=Math.PI/2;sign.position.set(bw*0.3*(Math.random()-.5)*2,3+sh/2+Math.random()*(bh-sh-6),side*(bd/2+0.3));}

    // pass fuses every halo of a given colour into one mesh.

        });

const RES_POOL=resFacades.map(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.needsUpdate=true;return new THREE.MeshLambertMaterial({map:t});});
const _pickPool=a=>a[Math.floor(Math.random()*a.length)];
// Facade UVs are 0..1 per box face, so a tall tower stretched ONE window grid over its whole height —
// which reads as a blank slab. Repeat the grid per ~`unit` metres instead, per face, so window rows
// stay a constant size on a 12u shophouse and a 280u tower alike.
function scaleFacadeUVs(geo,bw,bh,bd,unit){
  const uv=geo.attributes.uv; if(!uv||uv.count<24)return;
  const ux=Math.max(1,Math.round(bw/unit)), uz=Math.max(1,Math.round(bd/unit)), uy=Math.max(1,Math.round(bh/unit));
  for(let i=0;i<24;i++){
    let su,sv;
    if(i<8){su=uz;sv=uy;}          // +X / -X faces
    else if(i<16){su=ux;sv=uz;}    // +Y / -Y (roof / underside)
    else{su=ux;sv=uy;}             // +Z / -Z faces
    uv.setXY(i,uv.getX(i)*su,uv.getY(i)*sv);
  }
  uv.needsUpdate=true;
}
function spawnBuilding(cx,cz,bw,bd,style){
  const grp=new THREE.Group();
  const rm=pickRoof();
  let bh,mat;
  // TOKYO HEIGHT MIX: a 3-storey shophouse sits right against a 20-storey block. Each style spans a
  // wide range and occasionally throws a spike, so skylines are jagged instead of uniformly medium.
  // Heights stay jagged but bounded: one window grid is stretched over each face, so beyond roughly
  // 175u the window rows get visibly oversized. Spikes are capped just under that.
  if(style==='glass'){ bh=66+Math.random()*74; if(Math.random()<0.2)bh=145+Math.random()*30; mat=_pickPool(GLASS_POOL); }
  else if(style==='res'){
    const r=Math.random();
    bh = r<0.42 ? (7+Math.random()*7) : r<0.8 ? (18+Math.random()*20) : (44+Math.random()*26);
    mat=_pickPool(RES_POOL);
  }else{
    const r=Math.random();
    if(style==='neon') bh = r<0.4 ? (11+Math.random()*13) : r<0.85 ? (26+Math.random()*28) : (58+Math.random()*34);
    else               bh = r<0.32 ? (14+Math.random()*16) : r<0.82 ? (34+Math.random()*38) : (78+Math.random()*52);
    mat=_pickPool(FACADE_POOL);
  }
  // NOTE: do NOT tile the facade UVs. facadeTex paints a full-face composition — a diagonal glass
  // sheen, edge-anchored sky/ground gradients — so repeating it bands the towers with diagonal
  // parallelograms. One grid per face is correct; tall buildings are kept in range by the height caps.
  const box=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd),mat); // single material -> mergeable
  box.position.y=bh/2;box.castShadow=true;box.receiveShadow=true;grp.add(box);
  const cap=new THREE.Mesh(new THREE.BoxGeometry(bw*1.004,0.35,bd*1.004),rm); // roof surface as its own mergeable mesh
  cap.position.y=bh+0.1;cap.receiveShadow=true;grp.add(cap);
  parapetXf.push({x:cx,y:bh+0.28,z:cz,w:bw+0.7,h:style==='res'?0.7:1.1,d:bd+0.7}); // batched after the loop
  let topY=bh;
  if(style==='glass'&&Math.random()<0.5){
    const h2=bh*0.35,w2=bw*0.62,d2=bd*0.62;
    const b2=new THREE.Mesh(new THREE.BoxGeometry(w2,h2,d2),mat);
    b2.position.y=bh+h2/2;b2.castShadow=true;grp.add(b2);
    const cap2=new THREE.Mesh(new THREE.BoxGeometry(w2*1.004,0.35,d2*1.004),rm);
    cap2.position.y=bh+h2+0.1;grp.add(cap2);
    topY=bh+h2;bh=topY;
  }
  if(topY>70){
    antXf.push({x:cx,y:topY+7,z:cz});
    warnXf.push({x:cx,y:topY+14.5,z:cz});
  }
  // EVERY building gets ground-floor frontage and signage — in Tokyo even office towers and apartment
  // blocks have lit shops and signs at street level. Previously only 'neon'/'mixed' did, which left
  // whole wards (glass Shinjuku/Ginza, residential Asakusa) as bare untextured boxes.
  {
    const sfi=Math.floor(Math.random()*STOREFRONT_VARIANT_COUNT);
    [[bd/2+0.15,0],[-bd/2-0.15,Math.PI]].forEach(o=>{
      const zc=o[0], ry=o[1], fs=zc>=0?1:-1, wz=cz+zc; // fs = outward normal; wz = world-z of the face
      // lit interior window recessed behind a dark frame (bulkhead+kickplate), an emissive sign band,
      // and protruding awning canopies — all collected as world-space transforms for later instancing.
      sfInnerXf[sfi].push({x:cx,y:2.5,z:wz,yaw:ry,w:bw*0.98,h:4.2});
      sfFrameXf.push({x:cx,y:4.9,z:wz+fs*0.12,yaw:ry,w:bw,h:1.0,d:0.5});
      sfFrameXf.push({x:cx,y:0.35,z:wz+fs*0.12,yaw:ry,w:bw,h:0.7,d:0.5});
      sfSignXf.push({x:cx,y:4.75,z:wz+fs*0.42,yaw:ry,w:bw*0.9,h:0.42,d:0.12,c:sfSignCols[Math.floor(Math.random()*sfSignCols.length)]});
      const segN=2, segW=bw/segN;
      for(let s2=0;s2<segN;s2++){
        sfAwningXf.push({x:cx-bw/2+segW*(s2+0.5),y:4.05,z:wz+fs*0.75,yaw:ry,w:segW*0.92,h:0.14,d:1.3,c:sfAwningCols[Math.floor(Math.random()*sfAwningCols.length)]});
      }
      // warm shop-light spill onto the sidewalk below the storefront (instanced after the district loop)
      const push=o[0]>=0?2.0:-2.0;
      warmGlowXf.push({x:cx,z:cz+o[0]+push,w:Math.max(3,bw*0.85),d:4.2});
      // saturated NEON splash pooling on the street a bit further out from the shopfront — colour
      // pulled from a neon palette so avenues get pink/cyan/amber/green light variance on the ground.
      if(Math.random()<0.7){
        const NP=[[1.0,0.34,0.72],[0.28,0.9,1.0],[1.0,0.7,0.24],[0.5,1.0,0.5],[0.85,0.5,1.0]];
        const c=NP[Math.floor(Math.random()*NP.length)];
        groundPoolXf.push({x:cx+(Math.random()-.5)*bw*0.5,z:cz+o[0]+push*(1.7+Math.random()*0.7),s:5+Math.random()*5,c});
      }
    });
    addNeonSigns(grp,bw,bd,Math.min(bh,46),cx,cz);
    if(style==='neon'||style==='mixed')addBillboard(grp,bw,bd,bh,cx,cz);
    else if(Math.random()<0.35)addBillboard(grp,bw,bd,bh,cx,cz); // some ads on towers/apartments too
    if(Math.random()<(style==='neon'?0.3:0.15)){
      const tank=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.6,3,8),woodMat);tank.position.y=bh+3.6;grp.add(tank);
      const cone=new THREE.Mesh(new THREE.ConeGeometry(1.7,1.3,8),new THREE.MeshLambertMaterial({color:0x3d3a36}));cone.position.y=bh+5.8;grp.add(cone);
    }
    // extra wall-mounted animated video screen high on neon/mixed towers (idol or ad loop, throttled draw)
    if(bh>34&&Math.random()<0.16&&bigScreens.length<14){
      const bs=Math.random()<0.45?idolScreenTex():bigScreenTex();
      const sc2w=bw*0.7,sc2h=sc2w*1.5;
      const scr=new THREE.Mesh(new THREE.PlaneGeometry(sc2w,sc2h),new THREE.MeshBasicMaterial({map:bs.t}));
      const side2=Math.random()<0.5?1:-1;
      scr.position.set(side2*(bw/2+0.32),bh-sc2h*0.55-1,0);
      scr.rotation.y=side2>0?Math.PI/2:-Math.PI/2;
      grp.add(scr);
      const glow2=new THREE.Mesh(new THREE.PlaneGeometry(sc2w*1.15,sc2h*1.1),
        new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.12,blending:THREE.AdditiveBlending,depthWrite:false}));
      glow2.position.copy(scr.position);glow2.rotation.copy(scr.rotation);grp.add(glow2);
      bigScreens.push(bs);
    }
  }
  if(style==='glass'&&Math.random()<0.5&&bigScreens.length<14){
    const bs=Math.random()<0.35?idolScreenTex():bigScreenTex();
    const scr=new THREE.Mesh(new THREE.PlaneGeometry(bw*0.9,bw*0.56),new THREE.MeshBasicMaterial({map:bs.t}));
    scr.position.set(0,bh*0.62,bd/2+0.32);grp.add(scr);
    const glow=new THREE.Mesh(new THREE.PlaneGeometry(bw*1.2,bw*0.76),
      new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.12,blending:THREE.AdditiveBlending,depthWrite:false}));
    glow.position.set(0,bh*0.62,bd/2+0.22);grp.add(glow);
    bigScreens.push(bs);
  }
  grp.position.set(cx,0,cz);
  scene.add(grp);
  buildings.push({m:grp,w:bw,d:bd,h:bh});
}

// ---------- NAMED TOKYO WARDS ----------
// Each ward is a spatial zone with its own character (building style bias) and name, so the city reads
// as real Tokyo: skyscraper Shinjuku, neon Shibuya/Akihabara, upscale Ginza, business Chiyoda around
// the Palace, low-rise old-town Asakusa, bayside Minato. wardAt() also drives the live map readout.
const TOWER={x:-450,z:440};
const PALACE={x:-90,z:-30,r:155}; // Imperial Palace grounds (used to keep buildings + their details out)
// Landing plazas for the enterable venues. Declared here (before the district loop) so the city keeps
// these plots CLEAR — otherwise buildings spawn straight on top of the helipads and you cannot land.
// Five enterable shops, one per missing crewman, spread across the wards so the night's chain
// walks you across the whole map rather than around one district.
const VENUE_SPOTS=[
  {x:-250,z:-90},   // 1 sushi      — Kanda backstreet, west of the Palace
  {x: 190,z: 140},  // 2 fish       — Ginza/bayside side street
  {x: -60,z:-330},  // 3 electronics— Akihabara approach
  {x: 400,z:-140},  // 4 laundry    — far east, tucked off an avenue
  {x:-430,z: 260},  // 5 sword      — Shibuya/Minato south-west
];
const VENUE_CLEAR=15; // small plot: the pad is tucked between buildings, a tighter approach
// Where the five crew are waiting. Declared here so the city keeps a shaft open over
// each one — tight enough that the descent is still a squeeze, open enough to survive.
const CREW_SPOTS=[
  {x:-360,z: 120},  // KAZE  — Shibuya
  {x: 250,z:-300},  // MIKO  — Akihabara backstreets
  {x:-520,z:-330},  // BULL  — Shinjuku tower feet
  {x: 330,z: 300},  // REI   — Ginza / bayside
  {x:-140,z: 420},  // DOC   — Minato waterfront
];
const CREW_CLEAR=13;
const WARDS=[
  {name:'CHIYODA',   jp:'千代田区', style:'cbd',   test:(x,z)=>Math.hypot(x+90,z+30)<300},          // Palace + govt/business towers
  {name:'SHINJUKU',  jp:'新宿区',   style:'cbd',   test:(x,z)=>x<-440},                              // skyscraper west
  {name:'SHIBUYA',   jp:'渋谷区',   style:'neon',  test:(x,z)=>x<-170&&z>150},                       // youth neon SW
  {name:'AKIHABARA', jp:'秋葉原',   style:'neon',  test:(x,z)=>x>150&&z<-190},                       // electric town NE
  {name:'GINZA',     jp:'銀座',     style:'glass', test:(x,z)=>x>110&&z>-160&&z<260},                // upscale central-east
  {name:'ASAKUSA',   jp:'浅草',     style:'res',   test:(x,z)=>z<-390},                              // old-town low-rise north
  {name:'MINATO',    jp:'港区',     style:'mixed', test:(x,z)=>z>330},                               // bayside south (Tower)
];
function wardAt(x,z){for(const w of WARDS)if(w.test(x,z))return w;return {name:'SHITAMACHI',jp:'下町',style:'mixed'};}
window.__wardAt=wardAt;
function districtOf(cx,cz){
  if(Math.hypot(cx-TOWER.x,cz-TOWER.z)<85)return 'park';
  if(Math.random()<0.045)return 'park';
  return wardAt(cx,cz).style;
}
const treeSpots=[];
function makePark(x0,x1,z0,z1){
  const w=x1-x0,d=z1-z0,cx=(x0+x1)/2,cz=(z0+z1)/2;
  const lawn=new THREE.Mesh(new THREE.PlaneGeometry(w,d),grassMat);
  lawn.rotation.x=-Math.PI/2;lawn.position.set(cx,0.028,cz);lawn.receiveShadow=true;scene.add(lawn);
  const p1=new THREE.Mesh(new THREE.PlaneGeometry(2.6,d),pathMat);
  p1.rotation.x=-Math.PI/2;p1.position.set(cx+(Math.random()-.5)*w*0.3,0.032,cz);scene.add(p1);
  const p2=new THREE.Mesh(new THREE.PlaneGeometry(w,2.6),pathMat);
  p2.rotation.x=-Math.PI/2;p2.position.set(cx,0.032,cz+(Math.random()-.5)*d*0.3);scene.add(p2);
  const n=Math.min(14,Math.floor(w*d/260));
  for(let k=0;k<n;k++)treeSpots.push([x0+2+Math.random()*(w-4),z0+2+Math.random()*(d-4)]);
}
const railBlocked=(za,zb)=>za<RAIL_Z+8&&zb>RAIL_Z-8;
for(let i=0;i<ROADS_X.length-1;i++)for(let j2=0;j2<ROADS_Z.length-1;j2++){
  const ra=ROADS_X[i],rb=ROADS_X[i+1],rc=ROADS_Z[j2],rd=ROADS_Z[j2+1];
  const x0=ra.p+ra.w/2+SW+1.2,x1=rb.p-rb.w/2-SW-1.2;
  const z0=rc.p+rc.w/2+SW+1.2,z1=rd.p-rd.w/2-SW-1.2;
  const bwT=x1-x0,bdT=z1-z0;
  if(bwT<9||bdT<9)continue; // matches the road-pruning MIN_BLOCK, so no gap is left un-built
  const cx=(x0+x1)/2,cz=(z0+z1)/2;
  if(Math.abs(cx-riverCX(cz))<RIVER_HW+24)continue; // keep the meandering river channel clear of buildings
  if(cz>SEA_Z0-24)continue;                          // no buildings over the bay (and no orphaned details there)
  if(Math.hypot(cx-PALACE.x,cz-PALACE.z)<PALACE.r+18)continue; // no buildings on the Palace grounds
  if(VENUE_SPOTS.some(vs=>Math.hypot(cx-vs.x,cz-vs.z)<VENUE_CLEAR+6))continue; // keep just enough room for the pad
  if(CREW_SPOTS.some(cs=>Math.hypot(cx-cs.x,cz-cs.z)<CREW_CLEAR+6))continue;    // and a shaft over each crewman
  const d=districtOf(cx,cz);
  if(d==='park'&&!railBlocked(z0,z1)){makePark(x0,x1,z0,z1);continue;}
  if(d==='cbd'&&!railBlocked(z0,z1)){
    // business districts: a tower per large parcel rather than one lonely tower in a big empty block
    const tx=Math.max(1,Math.min(3,Math.round(bwT/38))), tz=Math.max(1,Math.min(3,Math.round(bdT/38)));
    const tw=bwT/tx, td=bdT/tz;
    for(let a=0;a<tx;a++)for(let b=0;b<tz;b++){
      if(tx*tz>1&&Math.random()<0.10)continue;
      const lcx=x0+tw*(a+0.5),lcz=z0+td*(b+0.5);
      const bw=Math.max(10,tw-3.5-Math.random()*2),bd2=Math.max(10,td-3.5-Math.random()*2);
      spawnBuilding(lcx,lcz,bw,bd2,'glass');
    }
    continue;
  }
  // TOKYO DENSITY: real Tokyo blocks are packed with many narrow buildings sharing party walls, with
  // only slivers between them and very few empty lots. Subdivide each block into small parcels, fill
  // nearly all of them, and leave only a thin gap so neighbours almost touch.
  const cell=d==='res'?11:16;
  const nx=Math.max(1,Math.min(8,Math.round(bwT/cell)));
  const nz=Math.max(1,Math.min(8,Math.round(bdT/cell)));
  const lw=bwT/nx,ld=bdT/nz;
  for(let a=0;a<nx;a++)for(let b=0;b<nz;b++){
    if(Math.random()<(d==='res'?0.04:0.055))continue;   // very few vacant lots
    const lcx=x0+lw*(a+0.5),lcz=z0+ld*(b+0.5);
    if(railBlocked(lcz-ld/2,lcz+ld/2))continue;
    const bw=lw-0.9-Math.random()*1.1,bd2=ld-0.9-Math.random()*1.1; // slim gaps -> near party-wall packing
    if(bw<3.6||bd2<3.6)continue;
    let style=d;
    if(d==='mixed')style=Math.random()<0.08?'glass':(Math.random()<0.5?'neon':'mixed');
    spawnBuilding(lcx,lcz,bw,bd2,style==='cbd'?'mixed':style);
  }
}

// ---------- INSTANCE the collected neon-sign cages + warm sidewalk glow (few draw calls total,

    billboardGlowXf.forEach((t,i)=>{
      dummy.position.set(t.x,t.y,t.z);dummy.rotation.set(0,t.yaw,0);dummy.scale.set(t.w,t.h,1);dummy.updateMatrix();
      m.setMatrixAt(i,dummy.matrix);
    });
    m.instanceMatrix.needsUpdate=true;scene.add(m);
  }
  // ---- storefront bays batched: frame + sign + awning + per-variant inner window ----
  const sfBoxBatch=(arr,mat,colored)=>{
    if(!arr.length)return;
    const m=new THREE.InstancedMesh(sfUnitBox,mat,arr.length);
    arr.forEach((t,i)=>{dummy.position.set(t.x,t.y,t.z);dummy.rotation.set(0,t.yaw,0);dummy.scale.set(t.w,t.h,t.d);dummy.updateMatrix();m.setMatrixAt(i,dummy.matrix);if(colored)m.setColorAt(i,_sfCol.setHex(t.c));});
    m.instanceMatrix.needsUpdate=true;if(colored&&m.instanceColor)m.instanceColor.needsUpdate=true;
    m.frustumCulled=false;scene.add(m);
  };
  sfBoxBatch(sfFrameXf,sfFrameMat,false);

// ---------- OUTER SKYLINE IMPOSTORS: cheap LOD blocks beyond the playable street grid, so the
// city dissolves into haze/distance instead of stopping at a visible hard edge. Single InstancedMesh
// (1 draw call) of unlit boxes with a baked lit-window texture — no collision, no gameplay effect
// (never added to `buildings`), positioned in an annulus between the real block field (~560) and
// the far skyline silhouette ring (1400), safely inside the ground plane (CITY=1150).
(function buildOuterSkylineImpostors(){
  const innerR=580,outerR=1060,count=340;
  const impostorTexA=tex((g,w,h)=>{
    g.fillStyle='#241d34';g.fillRect(0,0,w,h);
    for(let y=6;y<h;y+=9){for(let x=4;x<w;x+=7){
      if(Math.random()<0.4){
        g.fillStyle=Math.random()<0.6?'rgba(255,205,150,.55)':(Math.random()<0.6?'rgba(160,210,255,.5)':'rgba(255,150,220,.45)');
        g.fillRect(x,y,2,2.4);
      }
    }}
  },48,128,true);
  const impostorTexB=tex((g,w,h)=>{
    g.fillStyle='#1e1a2c';g.fillRect(0,0,w,h);
    for(let y=6;y<h;y+=8){for(let x=4;x<w;x+=6){
      if(Math.random()<0.3){
        g.fillStyle=Math.random()<0.5?'rgba(255,190,130,.5)':'rgba(150,220,255,.45)';
        g.fillRect(x,y,1.6,2);
      }
    }}
  },48,128,true);
  const geo=new THREE.BoxGeometry(1,1,1);
  const matA=new THREE.MeshBasicMaterial({map:impostorTexA});
  const matB=new THREE.MeshBasicMaterial({map:impostorTexB});
  const mA=new THREE.InstancedMesh(geo,matA,Math.ceil(count/2));
  const mB=new THREE.InstancedMesh(geo,matB,Math.floor(count/2));
  mA.frustumCulled=false;mB.frustumCulled=false;
  const dummy=new THREE.Object3D();
  let ia=0,ib=0,tries=0;
  while(ia+ib<count&&tries<count*4){
    tries++;
    const ang=Math.random()*Math.PI*2;
    const rad=innerR+Math.random()*(outerR-innerR);
    const x=Math.cos(ang)*rad,z=Math.sin(ang)*rad;
    if(Math.abs(x-riverCX(z))<RIVER_HW+30)continue; // keep the meandering river channel clear
    if(z>SEA_Z0-40)continue;                   // it's the SEA to the south — no buildings standing in open water
    const h=18+Math.random()*150,w=12+Math.random()*22,d=12+Math.random()*22;
    dummy.position.set(x,h/2,z);dummy.rotation.y=Math.random()*Math.PI;dummy.scale.set(w,h,d);dummy.updateMatrix();
    if(Math.random()<0.5&&ia<mA.count){mA.setMatrixAt(ia++,dummy.matrix);}
    else if(ib<mB.count){mB.setMatrixAt(ib++,dummy.matrix);}
    else if(ia<mA.count){mA.setMatrixAt(ia++,dummy.matrix);}
  }
  mA.count=ia;mB.count=ib;
  mA.instanceMatrix.needsUpdate=true;mB.instanceMatrix.needsUpdate=true;
  scene.add(mA,mB);
  // a little extra light-pollution haze right at the transition band so blocks fade rather than cut off
  for(let i=0;i<14;i++){
    const ang=Math.random()*Math.PI*2,rad=520+Math.random()*420;
    const ht=hazeTexVariants[Math.floor(Math.random()*hazeTexVariants.length)];
    const m=new THREE.Mesh(new THREE.PlaneGeometry(360+Math.random()*380,130+Math.random()*100),
      new THREE.MeshBasicMaterial({map:ht,transparent:true,opacity:.14+Math.random()*.12,depthWrite:false}));
    m.position.set(Math.cos(ang)*rad,14+Math.random()*54,Math.sin(ang)*rad);
    scene.add(m);groundHaze.push(m);
  }
})();

  const rim=new THREE.Mesh(new THREE.CylinderGeometry(outerR+2,outerR+7,5,56,1,true),wallMat);rim.position.set(cx,2,cz);grp.add(rim);
  // Edo-castle keep (tenshu): stone base + tiered white floors with dark tiled roofs + gold finial
  const keep=new THREE.Group();
  const plasterM=new THREE.MeshStandardMaterial({color:0xe9e3d5,roughness:0.85,metalness:0.02});
  const roofM=new THREE.MeshStandardMaterial({color:0x282c31,roughness:0.65,metalness:0.25,emissive:0x0a0b0d,emissiveIntensity:0.3});
  const base=new THREE.Mesh(new THREE.CylinderGeometry(20,26,11,4),wallMat);base.rotation.y=Math.PI/4;base.position.y=5.5;keep.add(base);
  let y=11,w=27;

    const eave=new THREE.Mesh(new THREE.BoxGeometry(w*1.12,0.5,w*1.12),roofM);eave.position.y=y+6.6;keep.add(eave);

  // pine groves across the grounds (dark Japanese black pine)
  const pineTrunk=new THREE.MeshLambertMaterial({color:0x38291d}),pineLeaf=new THREE.MeshLambertMaterial({color:0x1c3a24});
  for(let i=0;i<44;i++){
    const a=Math.random()*Math.PI*2,r=44+Math.random()*(innerR-58),px=cx+Math.cos(a)*r,pz=cz+Math.sin(a)*r;
    if(Math.hypot(px-cx,pz-cz)<34)continue; // keep the keep courtyard clear

  }
  // two stone bridges across the moat (Nijubashi-style) on the south + east approaches

  [[0,1],[1,0]].forEach(([sx,sz])=>{

// ---------- TOKYO: shrines · vermilion torii · stone lanterns · gardens ----------
// Perf-first: trees + lanterns (100+) are InstancedMesh (a few draw calls total);
// no dynamic lights; decorative shadows off. Torii/shrines are few, so kept plain.
{
  const V=0xd93b2b;
  const toriiMat=new THREE.MeshLambertMaterial({color:V,emissive:0x4a1109,emissiveIntensity:0.55});
  const stoneMat=new THREE.MeshLambertMaterial({color:0x928c80});
  const darkStone=new THREE.MeshLambertMaterial({color:0x6d685e});
  const woodMat=new THREE.MeshLambertMaterial({color:0x6b4a2f});
  const roofMat=new THREE.MeshLambertMaterial({color:0x2a2d33});
  const glowMat=new THREE.MeshBasicMaterial({color:0xffcf87});
  const trunkMat=new THREE.MeshLambertMaterial({color:0x3a2a1e});
  const leafCols=[new THREE.Color(0x274b30),new THREE.Color(0x2f5a38),new THREE.Color(0x203f28),new THREE.Color(0x356b3e)];
  const treeItems=[], lantItems=[];
  const addTree=(x,z,h)=>treeItems.push({x,z,s:h/11.5,ry:Math.random()*Math.PI*2,c:leafCols[Math.floor(Math.random()*leafCols.length)]});
  const addLantern=(x,z)=>lantItems.push({x,z,ry:Math.random()*Math.PI*2});
  const clearAround=(x,z,r)=>{for(let i=buildings.length-1;i>=0;i--){const b=buildings[i];const dx=b.m.position.x-x,dz=b.m.position.z-z;if(dx*dx+dz*dz<r*r){scene.remove(b.m);buildings.splice(i,1);}}};

  function makeTorii(s){
    const g=new THREE.Group();
    const pr=s*0.05, ph=s*0.82, span=s*0.62;
    [-span/2,span/2].forEach(px=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(pr*0.85,pr,ph,8),toriiMat);p.position.set(px,ph/2,0);g.add(p);});
    const kw=span+s*0.3;
    const kasagi=new THREE.Mesh(new THREE.BoxGeometry(kw,pr*1.6,pr*2.2),toriiMat);kasagi.position.set(0,ph+pr,0);g.add(kasagi);
    const nuki=new THREE.Mesh(new THREE.BoxGeometry(span+pr*4,pr*1.1,pr*1.5),toriiMat);nuki.position.set(0,ph*0.72,0);g.add(nuki);
    const tab=new THREE.Mesh(new THREE.BoxGeometry(pr*2.4,s*0.11,pr*0.7),toriiMat);tab.position.set(0,ph*0.86,0);g.add(tab);
    return g;
  }
  function makeShrine(){
    const g=new THREE.Group();
    const plat=new THREE.Mesh(new THREE.BoxGeometry(16,1.2,12),darkStone);plat.position.y=0.6;g.add(plat);
    const body=new THREE.Mesh(new THREE.BoxGeometry(12,6,9),woodMat);body.position.y=4.2;body.castShadow=true;g.add(body);
    [-6,6].forEach(px=>[-4.5,4.5].forEach(pz=>{const p=new THREE.Mesh(new THREE.BoxGeometry(0.7,6,0.7),toriiMat);p.position.set(px,4.2,pz);g.add(p);}));
    const rw=18, rl=13;
    [-1,1].forEach(sd=>{const slab=new THREE.Mesh(new THREE.BoxGeometry(rw,0.7,rl*0.64),roofMat);slab.position.set(0,8.7,sd*rl*0.24);slab.rotation.x=sd*0.6;slab.castShadow=true;g.add(slab);});
    const ridge=new THREE.Mesh(new THREE.BoxGeometry(rw,0.9,0.9),new THREE.MeshLambertMaterial({color:0x3a3e46}));ridge.position.y=10.1;g.add(ridge);
    [-1,1].forEach(sd=>{const ch=new THREE.Mesh(new THREE.BoxGeometry(0.35,3.4,0.35),roofMat);ch.position.set(sd*rw*0.42,10.7,0);ch.rotation.x=0.5;g.add(ch);const ch2=ch.clone();ch2.rotation.x=-0.5;g.add(ch2);});
    const steps=new THREE.Mesh(new THREE.BoxGeometry(8,0.8,2.4),stoneMat);steps.position.set(0,0.9,6.6);g.add(steps);
    return g;
  }
  function shrineComplex(cx,cz){
    clearAround(cx,cz,58);
    const g=new THREE.Group();
    const plaza=new THREE.Mesh(new THREE.BoxGeometry(72,0.3,72),new THREE.MeshLambertMaterial({color:0x59554c}));plaza.position.y=0.16;plaza.receiveShadow=true;g.add(plaza);
    const path=new THREE.Mesh(new THREE.BoxGeometry(7,0.34,52),new THREE.MeshLambertMaterial({color:0x7c7669}));path.position.set(0,0.19,5);g.add(path);
    const t=makeTorii(20);t.position.set(0,0,28);g.add(t);
    const sh=makeShrine();sh.position.set(0,0,-22);g.add(sh);
    g.position.set(cx,0,cz);scene.add(g);
    for(let z2=20;z2>=-12;z2-=11){[-5,5].forEach(x2=>addLantern(cx+x2,cz+z2));}
    for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,rad=30+Math.random()*7;const lx=Math.cos(a)*rad,lz=Math.sin(a)*rad;if(Math.abs(lx)<8&&lz>10)continue;addTree(cx+lx,cz+lz,11+Math.random()*8);}
  }

  shrineComplex(-185,-120);
  shrineComplex(300,-70);
  shrineComplex(-330,250);

  const toriiSpots=[[-60,-360],[150,300],[-380,-40],[380,170],[-150,70],[240,-250],[70,430],[-260,-300],[420,-150],[-40,250],[190,-430],[-430,330]];
  toriiSpots.forEach(([x,z])=>{ if(x>440&&x<560)return; if(z>560)return; if(Math.abs(z-192)<12||Math.abs(z+288)<12)return;
    clearAround(x,z,15); const t=makeTorii(11+Math.random()*4);t.position.set(x,0,z);t.rotation.y=Math.random()*Math.PI;scene.add(t); addLantern(x+(Math.random()<.5?-4:4),z+3); });

  let placed=0,tries=0;
  while(placed<18&&tries<220){tries++; const x=(Math.random()-0.5)*1000,z=(Math.random()-0.5)*1000;
    if(x>440&&x<560)continue; if(z>560)continue; if(Math.abs(z-192)<14||Math.abs(z+288)<14)continue;
    let near=false; for(const b of buildings){const dx=b.m.position.x-x,dz=b.m.position.z-z;if(dx*dx+dz*dz<420){near=true;break;}} if(near)continue;
    const n=2+Math.floor(Math.random()*3); for(let k=0;k<n;k++)addTree(x+(Math.random()-.5)*11,z+(Math.random()-.5)*11,9+Math.random()*8); placed++; }

  // ---- build instanced trees ----
  if(treeItems.length){
    const trunkGeo=new THREE.CylinderGeometry(0.5,0.85,5,6);trunkGeo.translate(0,2.5,0);
    const can1Geo=new THREE.ConeGeometry(3.9,4.6,7);can1Geo.translate(0,7.0,0);
    const can2Geo=new THREE.ConeGeometry(2.8,4.2,7);can2Geo.translate(0,9.6,0);
    const canMat=new THREE.MeshLambertMaterial({color:0xffffff});
    const trunkIM=new THREE.InstancedMesh(trunkGeo,trunkMat,treeItems.length);
    const can1IM=new THREE.InstancedMesh(can1Geo,canMat,treeItems.length);
    const can2IM=new THREE.InstancedMesh(can2Geo,canMat,treeItems.length);
    const m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),pos=new THREE.Vector3(),scl=new THREE.Vector3();
    treeItems.forEach((it,i)=>{e.set(0,it.ry,0);q.setFromEuler(e);pos.set(it.x,0,it.z);scl.set(it.s,it.s,it.s);m.compose(pos,q,scl);
      trunkIM.setMatrixAt(i,m);can1IM.setMatrixAt(i,m);can2IM.setMatrixAt(i,m);can1IM.setColorAt(i,it.c);can2IM.setColorAt(i,it.c);});
    [trunkIM,can1IM,can2IM].forEach(im=>{im.instanceMatrix.needsUpdate=true;im.castShadow=false;scene.add(im);});
    can1IM.instanceColor.needsUpdate=true;can2IM.instanceColor.needsUpdate=true;
  }
  // ---- build instanced stone lanterns ----
  if(lantItems.length){
    const baseGeo=new THREE.CylinderGeometry(0.7,0.95,0.5,6);baseGeo.translate(0,0.25,0);
    const postGeo=new THREE.CylinderGeometry(0.26,0.3,2.2,6);postGeo.translate(0,1.55,0);
    const glowGeo=new THREE.BoxGeometry(0.85,0.95,0.85);glowGeo.translate(0,3.25,0);
    const capGeo=new THREE.ConeGeometry(0.95,0.65,6);capGeo.translate(0,3.95,0);
    const mk=(geo,mat)=>{const im=new THREE.InstancedMesh(geo,mat,lantItems.length);const m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),p=new THREE.Vector3(),one=new THREE.Vector3(1,1,1);
      lantItems.forEach((it,i)=>{e.set(0,it.ry,0);q.setFromEuler(e);p.set(it.x,0,it.z);m.compose(p,q,one);im.setMatrixAt(i,m);});
      im.instanceMatrix.needsUpdate=true;im.castShadow=false;scene.add(im);};
    mk(baseGeo,darkStone);mk(postGeo,stoneMat);mk(glowGeo,glowMat);mk(capGeo,darkStone);
  }
}

// ---------- TOKYO: hung chochin lantern strings + neon water glow ----------
// Chochin are one InstancedMesh (1 draw call for all); the water glow uses 3
// shared additive materials so the merge pass fuses them to ~3 draw calls.
{
  const palette=[0xff3a24,0xff5a2a,0xff2a5a,0xffb020]; // red / orange-red / pink-red / amber
  const items=[];
  const pool=[...ROADS_X.map(r=>({axis:'z',p:r.p})), ...ROADS_Z.map(r=>({axis:'x',p:r.p}))];
  for(let i=0;i<11;i++){
    const s=pool[Math.floor(Math.random()*pool.length)];
    const c=(Math.random()-0.5)*720, from=c-70, to=c+70;
    const off=(Math.random()<0.5?-1:1)*(6+Math.random()*3), y=8+Math.random()*2.5;
    for(let t=from;t<=to;t+=5){
      let x,z; if(s.axis==='z'){x=s.p+off;z=t;}else{x=t;z=s.p+off;}
      if(x>440&&x<560)continue; if(z>560)continue; // skip river/bay
      if(buildings.some(b=>Math.abs(x-b.m.position.x)<b.w/2&&Math.abs(z-b.m.position.z)<b.d/2))continue;
      items.push({x,y,z,c:palette[Math.random()<0.72?0:1+Math.floor(Math.random()*3)]});
    }
  }
  if(items.length){
    const geo=new THREE.SphereGeometry(0.5,7,6); geo.scale(1,1.5,1); // chochin: taller than wide
    const im=new THREE.InstancedMesh(geo,new THREE.MeshBasicMaterial({color:0xffffff}),items.length);
    const m=new THREE.Matrix4(),q=new THREE.Quaternion(),pos=new THREE.Vector3(),one=new THREE.Vector3(1,1,1),col=new THREE.Color();
    items.forEach((it,i)=>{pos.set(it.x,it.y,it.z);m.compose(pos,q,one);im.setMatrixAt(i,m);im.setColorAt(i,col.setHex(it.c));});
    im.instanceMatrix.needsUpdate=true; im.instanceColor.needsUpdate=true; im.frustumCulled=false;
    scene.add(im); window.__chochin=items.length;
  }
  // (No flat neon glow quads laid on the river/bay surface — they read as geometric stripes from the
  //  air. The moving reflective look now comes entirely from the ocean shader's sheen.)
}

  for(let i=0;i<lamps.length;i++){const l=lamps[i],dx=l.x-hx,dz=l.z-hz,d2=dx*dx+dz*dz;
    if(d2<170*170)__revealCand.push({x:l.x,z:l.z,d2,warm:l.warm,car:false});}

// This adds PROMINENT silhouette-breakers — stair/elevator penthouse blocks (the biggest jag), the

function instAdd(geo,mat,arr,shadow){

  if(shadow){im.castShadow=true;im.receiveShadow=true;}

}

function switchPanelTex(title,labels,accent){
  return tex((g,w,h)=>{
    g.fillStyle='#15171b';g.fillRect(0,0,w,h);
    const vg=g.createLinearGradient(0,0,0,h);
    vg.addColorStop(0,'rgba(255,255,255,.06)');vg.addColorStop(1,'rgba(0,0,0,.3)');
    g.fillStyle=vg;g.fillRect(0,0,w,h);
    g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=3;g.strokeRect(2,2,w-4,h-4);
    g.fillStyle=accent;g.font='bold 9px monospace';g.textAlign='center';g.globalAlpha=.9;
    g.fillText(title,w/2,14);g.globalAlpha=1;
    const cols=3,rows=2,mx=16,my=26,cw=(w-mx*2)/cols,ch=(h-my-16)/rows;
    let li=0;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const cx=mx+cw*c+cw/2,cy=my+ch*r+ch/2;
      const guarded=(r===0&&c===cols-1);
      g.fillStyle='#0c0d10';g.fillRect(cx-11,cy-9,22,20);
      g.strokeStyle='#3a3f46';g.lineWidth=1;g.strokeRect(cx-11,cy-9,22,20);
      if(guarded){
        g.strokeStyle='#cc3344';g.lineWidth=1.4;
        g.beginPath();g.moveTo(cx-10,cy-2);g.lineTo(cx-8,cy-13);g.lineTo(cx+8,cy-13);g.lineTo(cx+10,cy-2);g.stroke();
      }
      const on=((li*37+7)%5)<3;
      g.strokeStyle=on?accent:'#666';g.lineWidth=2.4;
      g.beginPath();g.moveTo(cx,cy+7);g.lineTo(cx+(on?4:-4),cy-6);g.stroke();
      g.fillStyle=on?accent:'#555';g.beginPath();g.arc(cx+(on?4:-4),cy-6,1.6,0,7);g.fill();
      g.fillStyle='rgba(190,230,220,.85)';g.font='6px monospace';g.textAlign='center';
      g.fillText(labels[li]||'',cx,cy+15);
      li++;
    }
    const ky=h-14;
    [w*0.28,w*0.72].forEach((kx,i)=>{
      g.strokeStyle='#4a4f56';g.lineWidth=1.4;g.beginPath();g.arc(kx,ky,8,0,7);g.stroke();
      g.fillStyle='#22262b';g.beginPath();g.arc(kx,ky,8,0,7);g.fill();g.stroke();
      const ang=-0.6+i*1.1;
      g.strokeStyle=accent;g.lineWidth=1.6;g.beginPath();g.moveTo(kx,ky);g.lineTo(kx+Math.cos(ang)*7,ky+Math.sin(ang)*7);g.stroke();
    });
  },180,150);
}

// Procedural "alive" idle: weight-shift sway + breathing bob + occasional look-around.
// Called every frame while the survivor is standing at the beacon, not yet rescued.
function updateSurvivorIdle(sv,dt,tGlobal){
  const t=tGlobal+sv.idleSeed;
  // gentle continuous weight-shift: hips sway side-to-side + slight spine counter-lean
  if(sv.hipsBone&&sv.hipsBaseQuat){
    const sway=Math.sin(t*0.55)*0.05;
    sv.hipsBone.quaternion.copy(sv.hipsBaseQuat).multiply(new THREE.Quaternion().setFromAxisAngle(WAVE_AXIS,sway));
  }
  if(sv.spineBone&&sv.spineBaseQuat){
    const lean=Math.sin(t*0.55+0.5)*0.035;
    const twist=Math.sin(t*0.33)*0.025;
    sv.spineBone.quaternion.copy(sv.spineBaseQuat)
      .multiply(new THREE.Quaternion().setFromAxisAngle(WAVE_AXIS,lean))
      .multiply(new THREE.Quaternion().setFromAxisAngle(YAW_AXIS,twist));
  }
  // breathing bob: small vertical rise/fall of the whole figure
  sv.model.position.y=Math.sin(t*1.7)*0.022;
  // occasional look-around: head+neck ease toward a random yaw, hold, then ease back to center
  sv.lookElapsed+=dt*1000;
  if(sv.lookElapsed>=sv.lookNextAt){
    sv.lookElapsed=0;
    sv.lookNextAt=2600+Math.random()*3200;
    sv.lookTarget=(Math.random()<0.5?-1:1)*(0.35+Math.random()*0.4);
  }
  // ease current look angle toward target while inside the look window, else ease back to 0
  const lookActive=sv.lookElapsed<900;
  const target=lookActive?sv.lookTarget:0;
  sv.lookAngle=THREE.MathUtils.lerp(sv.lookAngle,target,Math.min(1,dt*3.2));
  if(sv.neckBone&&sv.neckBaseQuat)sv.neckBone.quaternion.copy(sv.neckBaseQuat).multiply(new THREE.Quaternion().setFromAxisAngle(YAW_AXIS,sv.lookAngle*0.6));
  if(sv.headBone&&sv.headBaseQuat)sv.headBone.quaternion.copy(sv.headBaseQuat).multiply(new THREE.Quaternion().setFromAxisAngle(YAW_AXIS,sv.lookAngle*0.7));
}

// cheering spin/wiggle that settles once the hops finish. Returns true when the celebration
// has fully played out (caller then stops driving / removes the survivor).
function updateSurvivorCelebration(sv,dt){
  sv.celebT+=dt;
  const hopDur=0.3,hops=3,totalDur=hopDur*hops;
  const tt=Math.min(sv.celebT,totalDur);
  sv.model.position.y=Math.max(0,Math.sin((tt/hopDur)*Math.PI))*0.65;
  const spinFade=Math.max(0,1-sv.celebT/(totalDur+0.3));
  sv.model.rotation.y=HUMANOID_BASE_YAW+Math.sin(sv.celebT*7)*0.4*spinFade;
  if(sv.waveBone&&sv.waveBaseQuat)sv.waveBone.quaternion.copy(sv.waveBaseQuat).multiply(CELEBRATE_ARM_OFFSET).multiply(new THREE.Quaternion().setFromAxisAngle(WAVE_AXIS,Math.sin(sv.celebT*14)*0.25));
  if(sv.leftArmBone&&sv.leftArmBaseQuat)sv.leftArmBone.quaternion.copy(sv.leftArmBaseQuat).multiply(CELEBRATE_ARM_OFFSET_L).multiply(new THREE.Quaternion().setFromAxisAngle(WAVE_AXIS,-Math.sin(sv.celebT*14+0.4)*0.25));
  if(sv.foreArmBone&&sv.foreArmBaseQuat)sv.foreArmBone.quaternion.copy(sv.foreArmBaseQuat).multiply(new THREE.Quaternion().setFromAxisAngle(WAVE_AXIS,Math.sin(sv.celebT*16)*0.4));

// Build both tint variants ONCE from the template's original materials (shared across all
// clones — cheap & consistent; clones from SkeletonUtils keep references to these originals).
function buildHumanoidMaterialVariants(root){
  zombieMatVariants=new Map();
  survivorMatVariants=new Map();
  const seen=new Set();
  root.traverse(o=>{
    if(!o.isMesh||!o.material)return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(mat=>{
      if(seen.has(mat))return;
      seen.add(mat);
      const isVisor=/visor/i.test(mat.name||'');
      // zombie: desaturated sickly grey-green, roughened; visor gets a faint red undead glow
      const zMat=mat.clone();
      if(zMat.color)zMat.color.setRGB(0.36,0.56,0.30); // brighter sickly green so it reads in the dark from the air
      if('roughness' in zMat)zMat.roughness=0.9;
      if('metalness' in zMat)zMat.metalness=0.05;
      if(!zMat.emissive)zMat.emissive=new THREE.Color(0,0,0);
      // visor = red undead eyes; body = faint green self-glow so the zombie reads in the dark scene
      zMat.emissive.setRGB(isVisor?0.9:0.12, isVisor?0.04:0.26, isVisor?0.04:0.10);
      zMat.emissiveIntensity=isVisor?1.6:1.0;
      zMat.needsUpdate=true;
      zombieMatVariants.set(mat,zMat);
      // survivor: brightened, warm natural tint — must read as a civilian person, clearly
      // NOT the dark/sickly-green zombie look, even inside the beacon's green ring glow.
      const sMat=mat.clone();
      if(sMat.color)sMat.color.multiply(new THREE.Color(1.32,1.22,1.08));
      if('roughness' in sMat && sMat.roughness!==undefined)sMat.roughness=Math.max(0.35,sMat.roughness*0.8);
      if(!sMat.emissive)sMat.emissive=new THREE.Color(0,0,0);
      sMat.emissive.setRGB(isVisor?0.05:0.16,isVisor?0.05:0.11,isVisor?0.06:0.06); // faint warm self-glow, not the zombie's undead visor red
      sMat.emissiveIntensity=0.55;
      sMat.needsUpdate=true;
      survivorMatVariants.set(mat,sMat);
    });
  });
}
function applyHumanoidMaterialVariant(root,variantMap){

    if(Array.isArray(o.material))o.material=o.material.map(m=>variantMap.get(m)||m);
    else o.material=variantMap.get(o.material)||o.material;
    o.castShadow=true;
    o.receiveShadow=false;
  });
}

// shortest distance from point P to the segment A->B (used for swept bullet hit tests so fast tracers
// can't tunnel through a target between frames — the hit is tested against the whole travel segment)
const __segTmp=new THREE.Vector3(),__segAP=new THREE.Vector3();
function distToSeg(P,A,B){
  __segAP.subVectors(P,A); __segTmp.subVectors(B,A);
  const len2=__segTmp.lengthSq();
  let t=len2>0?__segAP.dot(__segTmp)/len2:0; t=t<0?0:(t>1?1:t);
  __segTmp.multiplyScalar(t).add(A);
  return __segTmp.distanceTo(P);
}

// stream sails over the zombies on the ground. Pick the best zombie roughly ahead (or the locked
// target) so the stream rakes DOWN onto it and the gun actually connects.
function pickGunTarget(fwd,origin){
  const LK=window.__lock;
  if(LK&&LK.target&&LK.locked&&LK.target.hp>0)return LK.target;
  let best=null,bestScore=-1;
  const consider=(obj,yOff,range)=>{
    if(obj.hp<=0)return;
    const to=obj.m.position.clone().add(new THREE.Vector3(0,yOff,0)).sub(origin);
    const dist=to.length(); if(dist>range)return;
    const dot=fwd.dot(to.normalize());
    if(dot<0.12)return;                    // wide forward cone (ahead / ahead-and-below / ahead-and-above)
    const score=dot-dist/3000;             // favour well-aligned and closer targets
    if(score>bestScore){bestScore=score;best=obj;}
  };
  for(const z of zombies)consider(z,2,380);
  for(const e of enemies)consider(e,e.kind==='boat'?7:0,520); // also rake toward enemy gunships / the boss boat
  return best;
}

    scene.add(s);
  }
  // flying debris chunks (gravity + ground bounce)
  spawnDebris(pos,napalm?12:7,napalm?20:15);

// ---- ONE panel chrome, used by every panel on the canvas HUD ----
// Hairline border on a translucent ground, plus a bracketed pair of opposite corners
// (the scanner-frame motif from the reference panel). `title` draws a flush header rule.
function hudPanel(x,y,w,h,title){
  hudX.fillStyle=UI.fill;hudX.fillRect(x,y,w,h);
  hudX.strokeStyle=UI.line;hudX.lineWidth=1;hudX.strokeRect(x+0.5,y+0.5,w-1,h-1);

  hudX.moveTo(x+1,y+c);hudX.lineTo(x+1,y+1);hudX.lineTo(x+c,y+1);
  hudX.moveTo(x+w-1,y+h-c);hudX.lineTo(x+w-1,y+h-1);hudX.lineTo(x+w-c,y+h-1); // bottom-right
  hudX.stroke();hudX.lineWidth=1;
  if(title){
    hudX.textAlign='left';hudX.textBaseline='alphabetic';
    hudX.fillStyle=UI.ui;hudX.font=T(UI.label,true);
    hudX.fillText(title,x+UI.PAD,y+15);
    hudX.strokeStyle=UI.faint;                          // rule under the header
    hudX.beginPath();hudX.moveTo(x+UI.PAD,y+21.5);hudX.lineTo(x+w-UI.PAD,y+21.5);hudX.stroke();

// segmented bar — the ▮▮▮▮|||| meter from the reference panel. Reads at a glance, no text needed.

// --- TACTICAL SITUATION DISPLAY (bottom-left) ---------------------------------
// Styled as the scanner panel: turquoise on near-black, graduated bezel, concentric

// self-contained — no reliance on the page's CSS.
const TAC=158;
function drawTacMap(now){
  const range=300, scale=TAC/(range*2), C=TAC/2;
  // live district readout: retitle the TSD and flash a banner on crossing into a new ward
  { const wd=wardAt(heli.position.x,heli.position.z);
    if(wd.name!==window.__curWard){
      window.__curWard=wd.name;

      if(started&&!gameOver)flashMsg('◄ '+wd.name+' '+wd.jp+' ►',UI.ui);
    }
  }
  const FOOT=13;                                   // footer strip for the range/orientation labels
  tacC.clearRect(0,0,TAC,TAC);
  tacC.fillStyle=UI.ink;tacC.fillRect(0,0,TAC,TAC);
  tacC.save();tacC.beginPath();tacC.rect(2,2,TAC-4,TAC-4-FOOT);tacC.clip();

  // reference grid — wide and very faint; the range rings carry distance, not this
  tacC.strokeStyle='rgba(95,242,255,.07)';tacC.lineWidth=1;
  for(let g=0;g<=TAC;g+=22){
    tacC.beginPath();tacC.moveTo(g,0);tacC.lineTo(g,TAC);tacC.stroke();
    tacC.beginPath();tacC.moveTo(0,g);tacC.lineTo(TAC,g);tacC.stroke();
  }

  // ---- world layer: north-up, rotated by yaw so the heli icon always points up ----
  tacC.translate(C,C);tacC.rotate(yaw);
  // roads
  tacC.strokeStyle='rgba(95,242,255,.20)';
  laneRoads.z.concat(ROADS_Z.filter(r=>r.major)).forEach(r=>{
    const dz=(r.p-heli.position.z)*scale;if(Math.abs(dz)>TAC)return;
    tacC.lineWidth=r.major?2:1;tacC.beginPath();tacC.moveTo(-TAC,dz);tacC.lineTo(TAC,dz);tacC.stroke();
  });
  laneRoads.x.concat(ROADS_X.filter(r=>r.major)).forEach(r=>{
    const dx=(r.p-heli.position.x)*scale;if(Math.abs(dx)>TAC)return;
    tacC.lineWidth=r.major?2:1;tacC.beginPath();tacC.moveTo(dx,-TAC);tacC.lineTo(dx,TAC);tacC.stroke();
  });
  // Sumida river — meandering band following riverCX()
  tacC.strokeStyle='rgba(40,150,190,.55)';tacC.lineWidth=Math.max(3,RIVER_HW*2*scale);tacC.lineCap='round';
  tacC.beginPath();
  for(let z=heli.position.z-range*1.6,first=true;z<heli.position.z+range*1.6;z+=26){
    const dx=(riverCX(z)-heli.position.x)*scale,dz=(z-heli.position.z)*scale;
    if(first){tacC.moveTo(dx,dz);first=false;}else tacC.lineTo(dx,dz);
  }
  tacC.stroke();tacC.lineCap='butt';
  // Imperial Palace — moat ring + grounds
  if(window.__palace){
    const P=window.__palace,pdx=(P.x-heli.position.x)*scale,pdz=(P.z-heli.position.z)*scale,pr=P.r*scale;
    tacC.fillStyle='rgba(70,224,138,.07)';tacC.beginPath();tacC.arc(pdx,pdz,pr*0.76,0,7);tacC.fill();
    tacC.strokeStyle='rgba(70,224,138,.22)';tacC.lineWidth=1;tacC.beginPath();tacC.arc(pdx,pdz,pr,0,7);tacC.stroke();
  }
  // building footprints
  tacC.fillStyle='rgba(95,242,255,.11)';
  buildings.forEach(b=>{
    const dx=(b.m.position.x-heli.position.x)*scale,dz=(b.m.position.z-heli.position.z)*scale;
    if(Math.abs(dx)>C||Math.abs(dz)>C)return;

  });
  // ground hostiles — small red ticks
  zombies.forEach(z=>{

  const tri=(x,y,r)=>{tacC.beginPath();tacC.moveTo(x,y-r);tacC.lineTo(x+r*0.92,y+r*0.66);tacC.lineTo(x-r*0.92,y+r*0.66);tacC.closePath();};
  enemies.forEach(e=>{
