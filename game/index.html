    tacC.strokeStyle='#ffffff';tacC.lineWidth=1;tri(0,0,r);tacC.stroke();
    if(e.boss){tacC.strokeStyle=UI.alert;tacC.lineWidth=1.4;
      tacC.beginPath();tacC.arc(0,0,r+3+Math.sin(now/170)*1.2,0,7);tacC.stroke();}
    tacC.restore();
  });
  // active venue pad — the sushi/market/electronics stop you're heading for
  VENUES.forEach((v,vi)=>{
    if(v.visited||vi!==stage)return;
    const dx=(v.x-heli.position.x)*scale,dz=(v.z-heli.position.z)*scale;
    const cl=Math.max(-C+7,Math.min(C-7,dx)),cd=Math.max(-C+7,Math.min(C-7,dz));

    tacC.globalAlpha=0.35+0.45*pl;                        // gentle pulse marks it as the live goal
    tacC.beginPath();tacC.arc(0,0,8.5,0,7);tacC.stroke();
    tacC.globalAlpha=1;
    tacC.fillStyle=UI.hi;tacC.font='bold 8px '+UI.font;tacC.textAlign='center';tacC.textBaseline='middle';
    tacC.fillText('H',0,0.5);
    tacC.restore();
  });
  // located crew still on the ground — green, the thing you're actually collecting
  CREW.forEach(c=>{
    if(!c.found||c.rescued||c.aboard)return;
    const dx=(c.x-heli.position.x)*scale,dz=(c.z-heli.position.z)*scale;
    const cl=Math.max(-C+6,Math.min(C-6,dx)),cd=Math.max(-C+6,Math.min(C-6,dz));
    tacC.save();tacC.translate(cl,cd);tacC.rotate(-yaw);
    tacC.fillStyle=UI.ok;tacC.beginPath();tacC.arc(0,0,2.6,0,7);tacC.fill();
    tacC.strokeStyle=UI.ok;tacC.lineWidth=1;
    tacC.beginPath();tacC.arc(0,0,5.5+Math.sin(now/300)*1.2,0,7);tacC.stroke();
    tacC.restore();
  });
  // legacy hostage objective marker

    const col=hostage.state==='pad'?UI.ui:UI.ok, pulse=4+Math.sin(now/220)*1.6;
    const cl=Math.max(-C+6,Math.min(C-6,dx)),cd=Math.max(-C+6,Math.min(C-6,dz));
    tacC.strokeStyle=col;tacC.fillStyle=col;tacC.lineWidth=1.5;
    tacC.beginPath();tacC.arc(cl,cd,pulse,0,7);tacC.stroke();

  }

  // ---- fixed overlay: rings, sweep, bezel, own-ship ----
  tacC.save();tacC.beginPath();tacC.rect(2,2,TAC-4,TAC-4-FOOT);tacC.clip();
  // range rings — the primary distance cue, so a step above the grid in weight
  tacC.strokeStyle='rgba(95,242,255,.26)';tacC.lineWidth=1;
  [TAC*0.17,TAC*0.31,TAC*0.45].forEach(r=>{tacC.beginPath();tacC.arc(C,C,r,0,7);tacC.stroke();});
  // sweep — a soft turquoise wedge, the one moving element
  const sweep=(now/2600)%(Math.PI*2);
  const sg=tacC.createLinearGradient(C,C,C+Math.cos(sweep)*C,C+Math.sin(sweep)*C);
  sg.addColorStop(0,'rgba(95,242,255,0)');sg.addColorStop(1,'rgba(95,242,255,.45)');
  tacC.strokeStyle=sg;tacC.lineWidth=2;
  tacC.beginPath();tacC.moveTo(C,C);tacC.lineTo(C+Math.cos(sweep)*C,C+Math.sin(sweep)*C);tacC.stroke();

  tacC.save();tacC.translate(C,C);

    tacC.beginPath();

  tacC.fillText('N',0,-C+15+FOOT/2);

  tacC.strokeStyle=UI.faint;tacC.lineWidth=1;
  tacC.beginPath();tacC.moveTo(2,TAC-2-FOOT+0.5);tacC.lineTo(TAC-2,TAC-2-FOOT+0.5);tacC.stroke();
  tacC.fillStyle=UI.dim;tacC.font='8px '+UI.font;tacC.textAlign='left';tacC.textBaseline='middle';
  tacC.fillText('RNG '+range+'m',6,TAC-2-FOOT/2);
  tacC.textAlign='right';tacC.fillText('N-UP',TAC-6,TAC-2-FOOT/2);
  tacC.textBaseline='alphabetic';
  tacC.strokeStyle=UI.line;tacC.lineWidth=1;tacC.strokeRect(1.5,1.5,TAC-3,TAC-3);

  const k=9;

}

// --- COCKPIT MFD offscreen draws ----------------------------------------------
// Four instrument faces textured onto the 3D dash. Same tokens, same motifs as the
// main HUD (turquoise chrome, segmented meters, red triangles for hostiles) so
// looking down at the dash reads as the same instrument set as looking through it.
function mfdFrame(ctx,size,title){
  ctx.clearRect(0,0,size,size);
  ctx.fillStyle=UI.ink;ctx.fillRect(0,0,size,size);
  ctx.strokeStyle=UI.line;ctx.lineWidth=1;ctx.strokeRect(1.5,1.5,size-3,size-3);
  ctx.strokeStyle=UI.ui;ctx.lineWidth=2;const k=7;
  ctx.beginPath();
  ctx.moveTo(2,2+k);ctx.lineTo(2,2);ctx.lineTo(2+k,2);
  ctx.moveTo(size-2,size-2-k);ctx.lineTo(size-2,size-2);ctx.lineTo(size-2-k,size-2);
  ctx.stroke();ctx.lineWidth=1;
  if(title){
    ctx.fillStyle=UI.ui;ctx.font='bold 9px '+UI.font;ctx.textAlign='left';ctx.textBaseline='alphabetic';
    ctx.fillText(title,6,13);
    ctx.strokeStyle=UI.faint;ctx.beginPath();ctx.moveTo(6,17.5);ctx.lineTo(size-6,17.5);ctx.stroke();
  }
}

  // ---- ATTITUDE: artificial horizon ----
  horC.clearRect(0,0,110,110);

  horC.restore();
  horC.strokeStyle=UI.line;horC.lineWidth=1;horC.beginPath();horC.arc(55,55,50,0,7);horC.stroke();

// vertical segmented gauge — the dash cousin of hudBar()
function vBar(ctx,x,y,w,h,frac,color,label){
  const n=10, gap=2, sh=(h-(n-1)*gap)/n, lit=Math.round(THREE.MathUtils.clamp(frac,0,1)*n);
  for(let i=0;i<n;i++){
    ctx.fillStyle=i<lit?color:UI.faint;
    ctx.fillRect(x,y+h-sh-i*(sh+gap),w,sh);
  }
  ctx.fillStyle=UI.dim;ctx.font='7px '+UI.font;ctx.textAlign='center';
  ctx.fillText(label,x+w/2,y+h+9);
}

// --- vertical measuring tape (airspeed left / altitude right) ---
// Ticks in a clipped band, then a value box with a caret pointing at the current reading.
function tape(cx,cy,h,val,step,unit,side,warnLow){
  const x=hudX,L=side==='L';
  x.save();x.beginPath();x.rect(cx-30,cy-h/2,60,h);x.clip();
  x.font=T(UI.label);x.textAlign=L?'right':'left';
  const pxPer=h/(step*5);                        // ~5 steps visible across the tape
  const base=Math.round(val/step)*step;
  for(let k=-4;k<=4;k++){
    const tv=base+k*step;if(tv<0)continue;
    const y=cy+(val-tv)*pxPer, major=tv%(step*5)===0;
    x.strokeStyle=major?UI.dim:UI.faint;x.lineWidth=1;
    x.beginPath();
    if(L){x.moveTo(cx+30,y);x.lineTo(cx+30-(major?14:8),y);}
    else {x.moveTo(cx-30,y);x.lineTo(cx-30+(major?14:8),y);}
    x.stroke();
    if(major){x.fillStyle=UI.dim;x.fillText(tv,L?cx+12:cx-12,y+3.5);}
  }
  x.restore();
  // value box + caret
  const bw=46,bh=17,by=cy-bh/2,bx=L?cx-30:cx-16;
  x.fillStyle=UI.solid;x.fillRect(bx,by,bw,bh);
  x.strokeStyle=UI.ui;x.lineWidth=1.4;x.strokeRect(bx,by,bw,bh);
  const caret=L?bx+bw:bx, tip=caret+(L?7:-7);
  x.beginPath();x.moveTo(caret,cy);x.lineTo(tip,cy-5);x.lineTo(tip,cy+5);x.closePath();
  x.fillStyle=UI.solid;x.fill();x.stroke();
  x.fillStyle=(warnLow&&val<warnLow)?UI.warn:UI.hi;x.font=T(13,true);x.textAlign='center';
  x.fillText(String(Math.round(val)).padStart(3,'0'),bx+bw/2,cy+4.5);
  x.fillStyle=UI.dim;x.font=T(UI.micro);x.fillText(unit,cx,cy-h/2-5);
  x.lineWidth=1;
}

// --- heading tape (top centre) ---
function headingTape(cx,y,w,hdg){
  const x=hudX;
  x.save();x.beginPath();x.rect(cx-w/2,y-2,w,28);x.clip();
  x.font=T(UI.label);x.textAlign='center';
  const pxPer=w/90;                              // ±45° visible
  for(let d=-60;d<=60;d+=5){
    const hv=((Math.round(hdg/5)*5+d)%360+360)%360;
    const sx=cx+(d-(hdg-Math.round(hdg/5)*5))*pxPer, major=hv%15===0;
    x.strokeStyle=major?UI.dim:UI.faint;x.lineWidth=1;
    x.beginPath();x.moveTo(sx,y+16);x.lineTo(sx,y+16-(major?9:5));x.stroke();
    if(major){
      const lbl=hv===0?'N':hv===90?'E':hv===180?'S':hv===270?'W':String(hv/10|0).padStart(2,'0');
      x.fillStyle=UI.dim;x.fillText(lbl,sx,y+8);
    }
  }
  x.restore();
  x.fillStyle=UI.ui;x.beginPath();x.moveTo(cx,y+17);x.lineTo(cx-5,y+24);x.lineTo(cx+5,y+24);x.closePath();x.fill();
  x.fillStyle=UI.solid;x.fillRect(cx-20,y-16,40,15);
  x.strokeStyle=UI.ui;x.lineWidth=1.3;x.strokeRect(cx-20,y-16,40,15);
  x.fillStyle=UI.hi;x.font=T(12,true);x.textAlign='center';
  x.fillText(String(Math.round(hdg)).padStart(3,'0'),cx,y-4);
  x.lineWidth=1;
}

let hudFlash=0;
// ============================================================================
// drawHUD — laid out on one grid, in five zones, drawn in a fixed order:
//   TL: FLIGHT status   TC: heading + objective   TR: ARMAMENT
//   centre: reticle, velocity vector, speed/alt tapes, target lock
//   world-anchored: waypoint marker and off-screen arrow
// In cockpit view the TL/TR panels are suppressed — the 3D dash MFDs already carry
// hull, throttle and the weapon rack, and drawing both was the doubled-up readout.
// ============================================================================
function drawHUD(now){
  const dpr=DPR();hudX.setTransform(dpr,0,0,dpr,0,0);
  const w=W(),h=H();hudX.clearRect(0,0,w,h);
  hudX.textBaseline='alphabetic';
  const cx=w/2,cy=h*0.45;
  const spdK=Math.round(CRUISE*(window.__throttle||1)*3.6);
  const alt=heli.position.y;
  const hdg=((-yaw*180/Math.PI)%360+360)%360;
  const compact=w<620;
  const M=UI.M;
  const thr=window.__throttle!==undefined?window.__throttle:1;
  const LK=window.__lock, guidedWpn=(wpn===1||wpn===2);

  // ---------------- CENTRE: boresight reticle ----------------
  hudX.strokeStyle=UI.ui;hudX.lineWidth=1.4;
  hudX.beginPath();hudX.arc(cx,cy,15,0,7);hudX.stroke();
  hudX.beginPath();
  hudX.moveTo(cx-26,cy);hudX.lineTo(cx-15,cy);
  hudX.moveTo(cx+15,cy);hudX.lineTo(cx+26,cy);
  hudX.moveTo(cx,cy-26);hudX.lineTo(cx,cy-15);
  hudX.moveTo(cx,cy+15);hudX.lineTo(cx,cy+22);
  hudX.stroke();
  hudX.fillStyle=UI.ui;hudX.fillRect(cx-1,cy-1,2,2);
  // velocity vector from turn + climb
  hudX.strokeStyle=UI.dim;hudX.lineWidth=1;
  const fpx=cx+(roll*90),fpy=cy-(pitch*120)+40;
  hudX.beginPath();hudX.arc(fpx,fpy,4,0,7);hudX.stroke();
  hudX.beginPath();
  hudX.moveTo(fpx-8,fpy);hudX.lineTo(fpx-4,fpy);hudX.moveTo(fpx+4,fpy);hudX.lineTo(fpx+8,fpy);
  hudX.moveTo(fpx,fpy-4);hudX.lineTo(fpx,fpy-8);hudX.stroke();

  // ---------------- CENTRE: tapes + heading ----------------
  const tapeH=compact?Math.min(150,h*0.30):Math.min(190,h*0.34);
  const tapeOff=compact?Math.max(84,w*0.17):118;   // narrow screens: keep tapes clear of the buttons
  tape(cx-tapeOff,cy,tapeH,spdK,20,'KPH','L',null);
  tape(cx+tapeOff,cy,tapeH,alt,20,'ALT M','R',20);
  headingTape(cx,M+18,Math.min(440,w*0.5),hdg);

  // ---------------- TOP-LEFT: flight status ----------------
  if(!cockpitMode){
    const pw=compact?184:210, ph=(mult>1?106:90);
    hudPanel(M,M,pw,ph,compact?'FLIGHT':'FLIGHT · '+pilotName.toUpperCase());
    const ix=M+UI.PAD, iw=pw-UI.PAD*2;
    let iy=M+38;
    hudRow(ix,iy,iw,'SCORE',String(score));iy+=UI.ROW;
    // kills, with a brief warm pop on each new one (replaces the old giant duplicate box)
    const pop=Math.max(0,1-(now-killPopT)/700);
    hudRow(ix,iy,iw,'KILLS',String(kills),pop>0?UI.warn:UI.hi);
    if(pop>0.05){
      hudX.strokeStyle='rgba(255,194,58,'+pop.toFixed(2)+')';hudX.lineWidth=1.4;
      hudX.strokeRect(ix-3,iy-12,iw+6,17);hudX.lineWidth=1;
    }
    iy+=UI.ROW;
    if(mult>1){
      hudX.fillStyle=UI.warn;hudX.font=T(UI.body,true);hudX.textAlign='left';
      hudX.fillText('x'+mult.toFixed(1)+' COMBO · '+streak,ix,iy);iy+=UI.ROW;
    }
    // hull: segmented meter, colour is the only status signal
    const hcol=hp>60?UI.ui:hp>30?UI.warn:UI.alert;
    hudX.fillStyle=UI.dim;hudX.font=T(UI.micro);hudX.textAlign='left';hudX.fillText('HULL',ix,iy);
    hudX.fillStyle=hcol;hudX.textAlign='right';hudX.fillText(Math.max(0,Math.round(hp))+'%',ix+iw,iy);
    hudBar(ix,iy+4,iw,6,Math.max(0,hp)/100,hcol);
    hudX.textAlign='left';
  }

  // ---------------- TOP-CENTRE: current objective ----------------
  if(!compact&&!cockpitMode){
    const headline=missionHeadline();
    hudX.font=T(UI.body,true);
    const mpW=Math.min(w*0.56,Math.max(hudX.measureText(headline).width+44,200));
    const mpX=cx-mpW/2, mpY=M+40, mpH=32;
    hudPanel(mpX,mpY,mpW,mpH);
    hudX.textAlign='center';
    hudX.fillStyle=UI.dim;hudX.font=T(UI.micro);
    hudX.fillText('OBJECTIVE',cx,mpY+12);
    hudX.fillStyle=UI.hi;hudX.font=T(UI.body,true);
    hudX.fillText(headline,cx,mpY+25);
    hudX.textAlign='left';
  }

  // ---------------- TOP-RIGHT: armament ----------------
  if(!cockpitMode){
    const pw=compact?162:184, px=w-M-pw, py=M;
    const rowH=compact?17:18;
    const ph=30+4*rowH+40+(guidedWpn?16:0);
    hudPanel(px,py,pw,ph,'ARMAMENT');
    const ix=px+UI.PAD, iw=pw-UI.PAD*2;
    let iy=py+38;
    const names=compact?['MINIGN','HYDRA','HLFIRE','NAPALM']:['MINIGUN','HYDRA 70','HELLFIRE','NAPALM'];
    for(let k=0;k<4;k++){
      const sel=k===wpn, out=ammo[k]<=0;
      if(sel){
        hudX.fillStyle='rgba(255,194,58,.13)';hudX.fillRect(px+4,iy-12,pw-8,rowH);
        hudX.strokeStyle=UI.warn;hudX.strokeRect(px+4.5,iy-11.5,pw-9,rowH-1);
      }
      hudX.font=T(compact?10:11,sel);
      hudX.fillStyle=sel?UI.warn:out?'rgba(255,59,82,.55)':UI.dim;
      hudX.textAlign='left';hudX.fillText('['+(k+1)+'] '+names[k],ix,iy);
      hudX.textAlign='right';hudX.fillText(ammo[k]===Infinity?'∞':String(ammo[k]),ix+iw,iy);
      iy+=rowH;
    }
    iy+=6;
    // throttle: same segmented meter as hull, so the two read as one family
    hudX.fillStyle=UI.dim;hudX.font=T(UI.micro);hudX.textAlign='left';hudX.fillText('THR',ix,iy);
    hudX.textAlign='right';hudX.fillStyle=thr<0.15?UI.warn:UI.ui;
    hudX.fillText(thr<0.15?'HOVER':(Math.round(thr*100)+'%'),ix+iw,iy);
    hudBar(ix,iy+4,iw,6,thr,thr<0.15?UI.warn:UI.ui);
    iy+=22;
    if(guidedWpn){
      const st=LK&&LK.locked?'LOCKED':(LK&&LK.target?'ACQUIRING':'NO TARGET');
      hudX.fillStyle=UI.dim;hudX.font=T(UI.micro);hudX.textAlign='left';hudX.fillText('TRACK',ix,iy);
      hudX.textAlign='right';hudX.font=T(UI.label,true);
      hudX.fillStyle=st==='LOCKED'?UI.alert:st==='ACQUIRING'?UI.warn:UI.dim;
      hudX.fillText(st,ix+iw,iy);
    }
    hudX.textAlign='left';
  }

  // ---------------- CENTRE: target lock, acquire -> lock ----------------
  if(LK&&LK.target&&LK.target.hp>0){
    const tp=LK.target.m.position.clone();tp.y+=LK.target.big?4:2;
    const sp=project(tp);
    const rng=Math.round(heli.position.distanceTo(LK.target.m.position));
    if(sp.on){
      const locked=LK.locked, col=locked?UI.alert:UI.warn;
      const sz=locked?24:30-Math.min(6,LK.t*15);
      hudX.strokeStyle=col;hudX.lineWidth=1.6;
      if(locked){
        const c=8;
        [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([ux,uy])=>{
          hudX.beginPath();
          hudX.moveTo(sp.x+ux*sz,sp.y+uy*sz-uy*c);hudX.lineTo(sp.x+ux*sz,sp.y+uy*sz);hudX.lineTo(sp.x+ux*sz-ux*c,sp.y+uy*sz);
          hudX.stroke();
        });
        hudX.textAlign='center';
        if((now/120|0)%2){hudX.fillStyle=col;hudX.font=T(UI.label,true);hudX.fillText(guidedWpn?'LOCKED — FIRE':'LOCKED',sp.x,sp.y+sz+14);}
        hudX.fillStyle=UI.dim;hudX.font=T(UI.micro);hudX.fillText('RNG '+rng+'m',sp.x,sp.y-sz-6);
      }else{
        hudX.save();hudX.translate(sp.x,sp.y);hudX.rotate(now/500);
        hudX.strokeRect(-sz/2,-sz/2,sz,sz);hudX.restore();
        hudX.fillStyle=col;hudX.font=T(UI.micro);hudX.textAlign='center';
        hudX.fillText('ACQUIRING '+Math.min(99,Math.round(LK.t/LOCK_TIME*100))+'%',sp.x,sp.y+sz+2);
      }
      hudX.lineWidth=1;hudX.textAlign='left';
    }
  }

  // ---------------- WORLD-ANCHORED: waypoint to the live objective ----------------
  if(started&&!gameOver&&!missionDone){
    let tgt=null,label='',col=UI.ui;
    const kc=CREW.filter(c=>c.found&&!c.rescued&&!c.aboard);
    if(aboard.length&&window.__navyShip){tgt=window.__navyShip.padPos.clone();label='NAVY SHIP';col=UI.ok;}
    else if(kc.length){
      let bd=1e9;
      kc.forEach(c=>{const d=Math.hypot(heli.position.x-c.x,heli.position.z-c.z);if(d<bd){bd=d;tgt=new THREE.Vector3(c.x,3,c.z);label=c.id;}});
      col=UI.ok;
    }
    else{const v=activeVenue();if(v){tgt=new THREE.Vector3(v.x,12,v.z);label='LAND · '+v.name;}}
    if(tgt){
      const dist=Math.round(Math.hypot(heli.position.x-tgt.x,heli.position.z-tgt.z));
      const sp=project(tgt);
      hudX.save();
      if(sp.on&&sp.x>30&&sp.x<w-30&&sp.y>60&&sp.y<h-60){
        hudX.strokeStyle=col;hudX.lineWidth=2;
        hudX.beginPath();hudX.arc(sp.x,sp.y,15,0,7);hudX.stroke();
        hudX.beginPath();hudX.moveTo(sp.x,sp.y-22);hudX.lineTo(sp.x-6,sp.y-32);hudX.lineTo(sp.x+6,sp.y-32);hudX.closePath();
        hudX.fillStyle=col;hudX.fill();
        hudX.font=T(UI.label,true);hudX.textAlign='center';hudX.fillStyle=col;
        hudX.fillText(label+'  '+dist+'m',sp.x,sp.y+30);
      }else{

        const r=Math.min(w,h)*0.33, ax=cx+Math.sin(ang)*r, ay=cy-Math.cos(ang)*r;
        hudX.translate(ax,ay);hudX.rotate(ang);
        hudX.fillStyle=col;hudX.beginPath();hudX.moveTo(0,-16);hudX.lineTo(11,10);hudX.lineTo(0,4);hudX.lineTo(-11,10);hudX.closePath();hudX.fill();
        hudX.rotate(-ang);
        hudX.font=T(UI.label,true);hudX.textAlign='center';hudX.fillStyle=col;
        hudX.fillText(label+'  '+dist+'m',0,26);
      }
      hudX.restore();hudX.lineWidth=1;hudX.textAlign='left';
    }
  }

  // ---------------- HOIST: the extraction panel ----------------
  if(winch.crew||(now-crewBoardT)<2600){
    const boarding=!winch.crew&&crewBoardWho;
    const c=boarding?crewBoardWho:winch.crew;
    const pw=272,ph=84,px=cx-pw/2,py=Math.min(h-150,cy+86);
    hudPanel(px,py,pw,ph,boarding?'CREW ABOARD':'HOIST');
    const av=crewAvatar(c);
    hudX.drawImage(av,px+UI.PAD,py+26,52,52);
    const tx=px+UI.PAD+62, tw=pw-UI.PAD*2-62;
    hudX.textAlign='left';hudX.fillStyle=UI.hi;hudX.font=T(UI.body,true);
    hudX.fillText(c.rank+'  '+c.call,tx,py+40);
    hudX.fillStyle=UI.dim;hudX.font=T(UI.micro);
    hudX.fillText(c.name+' · '+c.role,tx,py+53);
    if(boarding){
      hudX.fillStyle=UI.ok;hudX.font=T(UI.label,true);
      hudX.fillText(c.perk,tx,py+70);
    }else{
      const frac=winch.t/EXTRACT_TIME, good=!winch.fail;
      hudBar(tx,py+60,tw,7,frac,good?UI.ui:UI.warn,12);
      hudX.font=T(UI.micro,true);
      hudX.fillStyle=good?UI.ui:UI.warn;
      hudX.fillText(good?('HOISTING '+Math.round(frac*100)+'%'):('⚠ '+winch.fail),tx,py+78);
    }
    hudX.textAlign='left';
  }

  // ---------------- CAUTION STACK: one column, one place to look ----------------
  // Warnings stack downward from a fixed line under the reticle instead of each
  // picking its own y — so two firing at once no longer collide.
  let cauY=h*0.63;
  const caution=(txt,col)=>{
    hudX.fillStyle=col;hudX.font=T(UI.body,true);hudX.textAlign='center';
    hudX.fillText(txt,cx,cauY);cauY+=18;hudX.textAlign='left';
  };
  if(zombies.some(z=>z.m.position.distanceTo(heli.position)<30)&&(now/220|0)%2)caution('⚠ HOSTILES CLOSE',UI.alert);
  if(hp<30&&hp>0&&(now/200|0)%2)caution('⚠ HULL CRITICAL',UI.alert);
  if(guidedWpn&&!(LK&&LK.target)&&(now/260|0)%2)caution('NO TARGET',UI.dim);
  if(window.__deckState)caution('▼ '+window.__deckState,UI.warn);

  drawTacMap(now);
}

// ================= ENEMY FORCES: the Kuroryū-kai syndicate + rogue-army boss =================
// Story: the Black Dragon (黒龍会) yakuza syndicate, fused with a rogue JSDF faction, has seized the
// hostages. They send armed gunships to stop the extraction, and the oyabun's flagship gunboat prowls
// the bay. Both fire back at the player and must be shot down.
// ---- INTERIOR AMBIENCE: a low-key plucked koto/shamisen figure over a soft room tone. Starts when
// you step inside, fades out when you leave, and ducks the helicopter rotor bed while indoors. ----
let inAmb=null;
const KOTO_SCALE=[0,2,3,7,9,12,14,15,19]; // hirajoshi-ish minor pentatonic, semitone offsets
function startInteriorMusic(kind){
  if(!AC||inAmb)return;
  try{
    if(AC.state==='suspended')AC.resume();   // context starts suspended until a gesture — without this the score is silent

    const out=AC.createGain();out.gain.value=0;out.connect(AC.destination);
    out.gain.linearRampToValueAtTime(kind==='fish'?0.05:0.085,AC.currentTime+1.6);
    // warm room tone
    const drone=AC.createOscillator();drone.type='sine';drone.frequency.value=kind==='denki'?98:73.4;
    const dg=AC.createGain();dg.gain.value=0.055;
    const dlp=AC.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=320;
    drone.connect(dg);dg.connect(dlp);dlp.connect(out);drone.start();
    // gentle plucked motif
    const root=kind==='denki'?196:146.83;
    let idx=0;
    const pluck=()=>{
      if(!inAmb)return;
      const st=KOTO_SCALE[Math.floor(Math.random()*KOTO_SCALE.length)];
      const f=root*Math.pow(2,st/12)*(Math.random()<0.25?2:1);
      const o=AC.createOscillator();o.type=kind==='denki'?'square':'triangle';o.frequency.value=f;
      const g2=AC.createGain();g2.gain.value=0;
      const bp=AC.createBiquadFilter();bp.type='lowpass';bp.frequency.value=kind==='denki'?1800:2600;
      o.connect(bp);bp.connect(g2);g2.connect(out);
      const t0=AC.currentTime;
      g2.gain.setValueAtTime(0,t0);
      g2.gain.linearRampToValueAtTime(kind==='denki'?0.05:0.09,t0+0.012);   // sharp pluck attack
      g2.gain.exponentialRampToValueAtTime(0.0008,t0+(kind==='denki'?0.9:1.9));
      o.start(t0);o.stop(t0+2.1);
      idx++;
      const gap=(idx%4===0?1500:750)+Math.random()*900;
      inAmb.timer=setTimeout(pluck,gap);
    };
    inAmb={out,drone,timer:null};
    inAmb.timer=setTimeout(pluck,420);
    if(rotorGainNode)rotorGainNode.gain.linearRampToValueAtTime(0.012,AC.currentTime+0.8); // muffle the rotor indoors
  }catch(e){}
}
function stopInteriorMusic(){
  if(!inAmb)return;
  const a=inAmb;inAmb=null;
  try{
    clearTimeout(a.timer);
    a.out.gain.linearRampToValueAtTime(0,AC.currentTime+0.5);
    setTimeout(()=>{try{a.drone.stop();a.out.disconnect();}catch(e){}},700);
    if(rotorGainNode)rotorGainNode.gain.linearRampToValueAtTime(0.10,AC.currentTime+0.9);
  }catch(e){}
}

function enemyFire(e){
  if(gameOver)return;
  const boat=e.kind==='boat';
  let muzzle;
  if(boat){ muzzle=e.m.position.clone().add(new THREE.Vector3(0,6,0)); }
  else { // fire from the NOSE chin gun at the front (the gunship faces the player)
    const fwd=heli.position.clone().sub(e.m.position).setY(0).normalize();
    muzzle=e.m.position.clone().add(fwd.multiplyScalar(5.4)).add(new THREE.Vector3(0,-1.2,0));
  }
  const aim=heli.position.clone().add(new THREE.Vector3(0,1.4,0)).sub(muzzle); aim.normalize();
  const jit=boat?0.02:0.05; aim.x+=(Math.random()-.5)*jit;aim.y+=(Math.random()-.5)*jit;aim.z+=(Math.random()-.5)*jit; aim.normalize();
  const spd=boat?100:135;
  const b=new THREE.Mesh(boat?new THREE.SphereGeometry(0.75,8,8):tracerG, boat?EH_SHELL:EH_TRACER);
  b.position.copy(muzzle);
  if(!boat){b.lookAt(b.position.clone().add(aim));b.rotateX(Math.PI/2);b.scale.set(1.7,1.7,1.7);}
  scene.add(b);
  hostileBullets.push({m:b,v:aim.multiplyScalar(spd),t:5,dmg:boat?16:6,r:boat?7:3,boat});
  sfx(0.05,0.05,boat?170:820,boat?110:520);
}

function updateEnemies(dt,now){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.hp<=0){
      explode(e.m.position.clone().add(new THREE.Vector3(0,e.kind==='boat'?8:0,0)),e.kind==='boat'?30:13,0,true);
      if(e.kind==='boat'){for(let k=0;k<6;k++)setTimeout(()=>{if(!gameOver)explode(e.m.position.clone().add(new THREE.Vector3((Math.random()-.5)*20,4+Math.random()*8,(Math.random()-.5)*40)),12,0,true);},k*180);}

      kills++;bumpStreak();killPopT=now;addScore(e.score||400);
      if(e.boss){window.__bossAlive=false;flashMsg('BOSS DOWN — 黒龍会 SYNDICATE CRIPPLED! +5000',UI.warn);comRadio('COMMAND: FLAGSHIP DESTROYED. OUTSTANDING WORK, PILOT — YOUR CREW HAS A CHANCE NOW.');}
      else flashMsg('ENEMY GUNSHIP DOWN',UI.ui);
      continue;
    }
    e.t+=dt;
    const toH=heli.position.clone().sub(e.m.position);const dist=toH.length();
    if(e.kind==='heli'){
      if(e.rotor)e.rotor.rotation.y+=34*dt;
      if(e.trotor)e.trotor.rotation.x+=48*dt;
      const dir=dist>e.standoff?1:(dist<e.standoff*0.7?-1:0);
      const flat=toH.clone().setY(0).normalize();
      e.m.position.add(flat.multiplyScalar(dir*e.spd*dt));
      const wantY=Math.max(26,heli.position.y+Math.sin(e.t*0.7)*7);
      e.m.position.y+=(wantY-e.m.position.y)*Math.min(1,dt*1.3);
      // face the player so the NOSE (local -Z) points at them — the gun fires from the front
      e.m.rotation.y=Math.atan2(e.m.position.x-heli.position.x,e.m.position.z-heli.position.z);
      e.m.rotation.z=Math.sin(e.t*1.1)*0.1;
      e.m.rotation.x=-0.08; // slight nose-down attack attitude
      e.fireCd-=dt;
      if(e.fireCd<=0&&dist<170){e.fireCd=e.fireRate;enemyFire(e);}

      if(e.turret){const a=Math.atan2(heli.position.x-e.m.position.x,heli.position.z-e.m.position.z);e.turret.rotation.y=a;}
      e.m.position.y=0.3+Math.sin(e.t*0.5)*0.4;
      e.m.rotation.z=Math.sin(e.t*0.4)*0.02;
      e.fireCd-=dt;
      if(e.fireCd<=0){e.fireCd=e.fireRate;enemyFire(e);}
    }
  }
}

// wave director for enemy forces — escalates gunships, brings the boss at wave 3+
function spawnWaveEnemies(){
  // top up toward the cap (spawnEnemyHeli itself refuses past MAX_EHELI) — keeps pressure without piling up
  const alive=enemies.reduce((n,e)=>n+(e.kind==='heli'?1:0),0);
  const toSpawn=Math.max(0,Math.min(MAX_EHELI,wave+1)-alive);
  for(let k=0;k<toSpawn;k++)setTimeout(()=>{if(!gameOver)spawnEnemyHeli();},900+k*1600);
  if(wave>=3&&!window.__bossAlive&&!window.__bossDead)setTimeout(()=>{if(!gameOver)spawnBossBoat();},4000);
}

// One place that answers "what is this crewman worth?". Read by the flight model,
// the weapons and the damage path, so a perk is a real number, not flavour text.
function hasCrew(id){const c=CREW.find(m=>m.id===id);return !!c&&(c.aboard||c.rescued);}
function perkSpeed(){    return hasCrew('KAZE')?1.18:1; }
function perkFireRate(){ return hasCrew('MIKO')?0.70:1; }   // multiplies weapon cooldown

// ---- CREW PORTRAITS ---------------------------------------------------------
// Drawn once per crewman and cached. Same canvas approach as the city signage: a
// low-fi service ID photo — flight helmet, tinted visor, rank tab — so the dossier
// reads as paperwork from 1989 rather than a modern game avatar.
const _avCache={};
function crewAvatar(c){
  if(_avCache[c.id])return _avCache[c.id];
  const S=96, cv=document.createElement('canvas'); cv.width=cv.height=S;
  const g=cv.getContext('2d');
  const F=c.face;
  // ID-photo ground: pale institutional blue with a corner crop mark
  g.fillStyle='#16303a';g.fillRect(0,0,S,S);
  const gr=g.createLinearGradient(0,0,0,S);
  gr.addColorStop(0,'rgba(95,242,255,.16)');gr.addColorStop(1,'rgba(0,0,0,.35)');
  g.fillStyle=gr;g.fillRect(0,0,S,S);
  // shoulders / flight suit
  g.fillStyle='#2b3a44';
  g.beginPath();g.moveTo(S*0.10,S);g.quadraticCurveTo(S*0.5,S*0.62,S*0.90,S);g.closePath();g.fill();
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(S*0.30,S*0.90,S*0.40,3);       // collar seam
  // neck
  g.fillStyle=F.skin;g.fillRect(S*0.40,S*0.60,S*0.20,S*0.18);
  // head
  g.fillStyle=F.skin;
  g.beginPath();g.ellipse(S*0.5,S*0.46,S*0.19,S*0.23,0,0,7);g.fill();
  // jaw shadow
  g.fillStyle='rgba(0,0,0,.12)';
  g.beginPath();g.ellipse(S*0.5,S*0.58,S*0.15,S*0.09,0,0,7);g.fill();
  // flight helmet shell
  g.fillStyle=F.helmet;
  g.beginPath();g.arc(S*0.5,S*0.44,S*0.235,Math.PI,0);g.fill();
  g.fillRect(S*0.265,S*0.44,S*0.47,S*0.05);
  g.fillStyle='rgba(255,255,255,.10)';                                     // shell highlight
  g.beginPath();g.arc(S*0.44,S*0.40,S*0.16,Math.PI,Math.PI*1.5);g.fill();
  // tinted visor, raised — the crew colour, so each face reads at thumbnail size
  g.fillStyle=F.visor;g.globalAlpha=0.85;
  g.beginPath();g.ellipse(S*0.5,S*0.335,S*0.225,S*0.075,0,0,7);g.fill();
  g.globalAlpha=1;
  g.fillStyle='rgba(255,255,255,.35)';g.fillRect(S*0.31,S*0.315,S*0.16,2);
  // brows + eyes
  g.fillStyle=F.hair;
  g.fillRect(S*0.38,S*0.455-F.brow,S*0.09,2.5);
  g.fillRect(S*0.53,S*0.455-F.brow,S*0.09,2.5);
  g.fillStyle='#1a1418';
  g.fillRect(S*0.395,S*0.485,S*0.055,3);
  g.fillRect(S*0.55,S*0.485,S*0.055,3);
  // mouth + optional scar
  g.fillStyle='rgba(90,50,45,.75)';g.fillRect(S*0.455,S*0.555,S*0.09,2.5);
  if(F.scar){g.strokeStyle='rgba(150,70,60,.8)';g.lineWidth=1.6;
    g.beginPath();g.moveTo(S*0.63,S*0.44);g.lineTo(S*0.60,S*0.55);g.stroke();}
  // boom mic
  g.strokeStyle='#1d242a';g.lineWidth=2.4;
  g.beginPath();g.moveTo(S*0.72,S*0.46);g.quadraticCurveTo(S*0.70,S*0.60,S*0.58,S*0.60);g.stroke();
  g.fillStyle='#1d242a';g.beginPath();g.arc(S*0.575,S*0.60,S*0.035,0,7);g.fill();
  // rank tab + crop marks
  g.fillStyle='rgba(1,12,18,.85)';g.fillRect(0,S-14,S,14);
  g.fillStyle='#5ff2ff';g.font='bold 9px "Courier New",monospace';g.textAlign='left';g.textBaseline='middle';
  g.fillText(c.rank,4,S-7);
  g.textAlign='right';g.fillStyle='rgba(232,254,255,.8)';g.fillText(c.call,S-4,S-7);
  g.strokeStyle='rgba(95,242,255,.5)';g.lineWidth=2;
  g.beginPath();g.moveTo(1,9);g.lineTo(1,1);g.lineTo(9,1);g.moveTo(S-1,S-23);g.lineTo(S-1,S-15);g.stroke();
  _avCache[c.id]=cv;
  return cv;
}

function compassTo(x,z){
  const dx=x-heli.position.x, dz=z-heli.position.z;
  const a=(Math.atan2(dx,-dz)*180/Math.PI+360)%360;
  const dirs=['N','NE','E','SE','S','SW','W','NW'];
  return dirs[Math.round(a/45)%8]+' '+Math.round(Math.hypot(dx,dz))+'m';
}

// ONE OBJECTIVE AT A TIME. The night runs in stages: find the stage's shop -> get the lead ->
// recover the crew it named -> only then does the next shop light up. Never two goals at once.
let stage=0;
function activeVenue(){const v=VENUES[stage];return (v&&!v.visited)?v:null;}
function stagePendingCrew(){
  const v=VENUES[stage];if(!v||!v.visited)return [];
  return v.reveals.map(id=>CREW.find(m=>m.id===id)).filter(c=>c&&!c.rescued);
}
function refreshStageMarkers(){
  VENUES.forEach((v,i)=>{ if(v.marker)v.marker.visible=(i===stage&&!v.visited); });
}
function checkStageProgress(){
  const v=VENUES[stage];
  if(!v||!v.visited)return;
  if(stagePendingCrew().length===0){
    stage++;
    refreshStageMarkers();
    const nv=VENUES[stage];
    if(nv){
      flashMsg('NEW LEAD — '+nv.name+' '+nv.jp,UI.ui);
      comRadio('COMMAND: NEXT CONTACT IS '+nv.name+'. A NEW PAD IS MARKED ON YOUR MAP.');
    }
  }
}

// DEDICATED interior camera. The flight camera is a CHILD of the city scene, and three.js only calls
// updateMatrixWorld() on a camera whose parent is null — reusing it for a different scene left it with
// a stale world matrix (rendering from the wrong place, i.e. a black screen). This one is unparented.
const fpCam=new THREE.PerspectiveCamera(72,W()/H(),0.08,120);
// ---- shared interior materials (kept small; interiors are built once and cached) ----
// NOTE: this renderer's point lights fall off steeply (decay 2) and the scene is tone-mapped, so
// interior surfaces carry a modest self-lit emissive term too — without it a small room reads black.
const _inMat=(color,rough,metal,emis)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal||0,emissive:emis!==undefined?emis:color,emissiveIntensity:emis!==undefined?0.4:0.09});

// hinoki/keyaki plank grain: warm boards with visible seams, knots and wear
function inWoodTex(base,dark,planks){return tex((g,w,h)=>{
  g.fillStyle=base;g.fillRect(0,0,w,h);
  const ph=h/(planks||6);
  for(let p=0;p<(planks||6);p++){
    const y=p*ph;
    g.fillStyle=`rgba(0,0,0,${0.05+Math.random()*0.06})`;g.fillRect(0,y,w,ph);
    g.strokeStyle=dark;g.lineWidth=2;g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();       // plank seam
    for(let i=0;i<26;i++){ // grain lines
      g.strokeStyle=`rgba(60,34,16,${0.05+Math.random()*0.16})`;g.lineWidth=0.7+Math.random();
      const gy=y+2+Math.random()*(ph-4);
      g.beginPath();g.moveTo(0,gy);g.bezierCurveTo(w*0.3,gy+(Math.random()-.5)*5,w*0.7,gy+(Math.random()-.5)*5,w,gy);g.stroke();
    }
    if(Math.random()<0.5){ // knot
      const kx=Math.random()*w,ky=y+ph*0.5;
      for(let r=6;r>0;r--){g.strokeStyle=`rgba(70,40,18,${0.1+r*0.03})`;g.lineWidth=1.1;g.beginPath();g.ellipse(kx,ky,r*1.8,r*1.1,0.3,0,7);g.stroke();}
    }
  }
},512,512,true);}

// cylinder reads as a peg, not a finger of rice. Cached — the counter reuses a handful of sizes.
const _capGeos=new Map();
function _capsuleGeo(r,len,seg){
  const k=r+'|'+len+'|'+(seg||10); let g=_capGeos.get(k); if(g)return g;
  const pts=[],N=6;
  for(let i=0;i<=N;i++){const a=-Math.PI/2+(i/N)*(Math.PI/2);pts.push(new THREE.Vector2(Math.cos(a)*r,-len/2+Math.sin(a)*r));}
  for(let i=0;i<=N;i++){const a=(i/N)*(Math.PI/2);pts.push(new THREE.Vector2(Math.cos(a)*r, len/2+Math.sin(a)*r));}
  g=new THREE.LatheGeometry(pts,seg||10); _capGeos.set(k,g); return g;
}

// ---------- venue markers in the city (landing pad + lit doorway) ----------
function buildVenueMarkers(){
  // belt-and-braces: remove anything that still overlaps a pad (landmarks/props placed after the
  // district loop), so the helipad is always visibly clear ground
  for(let i=buildings.length-1;i>=0;i--){
    const b=buildings[i];
    if(VENUE_SPOTS.some(vs=>Math.hypot(b.m.position.x-vs.x,b.m.position.z-vs.z)<VENUE_CLEAR)
     ||CREW_SPOTS.some(cs=>Math.hypot(b.m.position.x-cs.x,b.m.position.z-cs.z)<CREW_CLEAR)){scene.remove(b.m);buildings.splice(i,1);}
  }
  // A real, unmistakable helipad: painted H circle, corner brackets, a ring of touchdown lights, a
  // wide light column and a floating name board — plus animated chevrons that walk DOWN the beam.
  const padTex=tex((c,w,h)=>{
    c.fillStyle='#07202c';c.fillRect(0,0,w,h);
    c.strokeStyle='#5ff2ff';c.lineWidth=10;c.beginPath();c.arc(w/2,h/2,w*0.40,0,7);c.stroke();
    c.lineWidth=5;c.globalAlpha=0.6;c.beginPath();c.arc(w/2,h/2,w*0.47,0,7);c.stroke();c.globalAlpha=1;
    c.fillStyle='#eafcff';
    const bw2=w*0.075,bh2=h*0.34,gap=w*0.13;                       // the H
    c.fillRect(w/2-gap-bw2/2,h/2-bh2/2,bw2,bh2);
    c.fillRect(w/2+gap-bw2/2,h/2-bh2/2,bw2,bh2);
    c.fillRect(w/2-gap,h/2-bw2*0.55,gap*2,bw2*1.1);
    c.strokeStyle='#ffd24a';c.lineWidth=6;                          // corner brackets
    [[0.12,0.12,1,1],[0.88,0.12,-1,1],[0.12,0.88,1,-1],[0.88,0.88,-1,-1]].forEach(([fx,fy,sx,sy])=>{
      const x=w*fx,y=h*fy,L=w*0.1;
      c.beginPath();c.moveTo(x,y+sy*L);c.lineTo(x,y);c.lineTo(x+sx*L,y);c.stroke();
    });
    c.fillStyle='#ffd24a';c.font=`bold ${Math.round(h*0.075)}px monospace`;c.textAlign='center';c.textBaseline='middle';
    c.fillText('LAND HERE',w/2,h*0.80);
  },256,256);
  VENUES.forEach(v=>{
    const g=new THREE.Group();g.position.set(v.x,0,v.z);
    const pad=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.MeshBasicMaterial({map:padTex,transparent:true,depthWrite:false}));
    pad.rotation.x=-Math.PI/2;pad.position.y=0.12;pad.renderOrder=3;g.add(pad);
    const ring=new THREE.Mesh(new THREE.RingGeometry(5.9,6.8,36),new THREE.MeshBasicMaterial({color:0x5ff2ff,transparent:true,opacity:0.7,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));
    ring.rotation.x=-Math.PI/2;ring.position.y=0.16;g.add(ring);
    // ring of touchdown lights around the pad
    const tdl=[];
    for(let i=0;i<12;i++){
      const a=i/12*Math.PI*2;
      const l=new THREE.Mesh(new THREE.SphereGeometry(0.34,7,6),new THREE.MeshBasicMaterial({color:0x7ff6ff}));
      l.position.set(Math.cos(a)*6.4,0.35,Math.sin(a)*6.4);g.add(l);tdl.push(l);
    }
    const beam=new THREE.Mesh(new THREE.CylinderGeometry(2.4,5.6,54,16,1,true),new THREE.MeshBasicMaterial({color:0x3fe0ff,transparent:true,opacity:0.12,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
    beam.position.y=27;g.add(beam);
    // chevrons that march downward, pointing at the pad
    const chev=[];
    const chevMat=new THREE.MeshBasicMaterial({color:0x9ff8ff,transparent:true,opacity:0.85,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});
    for(let i=0;i<4;i++){
      const sh=new THREE.Shape();sh.moveTo(-3.4,1.5);sh.lineTo(0,-1.5);sh.lineTo(3.4,1.5);sh.lineTo(2.4,2.3);sh.lineTo(0,0.2);sh.lineTo(-2.4,2.3);
      const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),chevMat);
      m.rotation.x=-Math.PI/2;m.position.y=8+i*9;g.add(m);chev.push(m);
    }
    const board=new THREE.Mesh(new THREE.PlaneGeometry(13,5.6),new THREE.MeshBasicMaterial({map:tex((c,w,h)=>{
      c.fillStyle='#06121a';c.fillRect(0,0,w,h);
      c.strokeStyle='#5ff2ff';c.lineWidth=5;c.strokeRect(4,4,w-8,h-8);
      c.fillStyle='#eafcff';c.font=`bold ${Math.round(h*0.26)}px monospace`;c.textAlign='center';c.textBaseline='middle';
      c.fillText(v.name,w/2,h*0.36);
      c.fillStyle='#ffd24a';c.font=`bold ${Math.round(h*0.3)}px ${MINCHO}`;c.fillText(v.jp,w/2,h*0.68);
    },256,128),transparent:true,depthWrite:false}));
    board.position.set(0,15,0);g.add(board);
    v.marker=g;v.board=board;v.chev=chev;v.tdl=tdl;v.ring=ring;scene.add(g);
    g.visible=false; // revealed by refreshStageMarkers() — one objective at a time
  });
}

function crewRemaining(){return CREW.filter(c=>!c.rescued).length;}
// The intel log writes itself: every lead an owner gives you stays on screen with the district, a
// live compass bearing and distance, so you always know where to look next.
function renderIntelLog(){
  const el=document.getElementById('intelLog'); if(!el)return;
  if(interiorMode||!started||gameOver){el.style.display='none';return;}
  el.style.display='block';
  // A dossier, not a list: face, rank and what each one is worth, so the player can
  // see at a glance who is still out there and why they want them back.
  let html='<b>CREW DOSSIER</b><div class="ros">';
  CREW.forEach(c=>{
    const st=crewStatus(c);
    const cls=c.rescued?'st-home':c.aboard?'st-ab':c.found?'st-loc':'st-mis';
    html+='<div class="cm'+(c.found?'':' unk')+'">'
       +  '<img src="'+crewAvatarURL(c)+'" alt="">'
       +  '<div class="cmi"><b>'+c.rank+' '+c.call+'</b>'
       +  '<span class="rl">'+c.role+'</span>'
       +  '<span class="pk">'+c.perk+'</span></div>'
       +  '<span class="st '+cls+'">'+st+'</span></div>';
    if(c.found&&!c.rescued&&!c.aboard)
      html+='<div class="lead">'+c.where+'<br><b>'+compassTo(c.x,c.z)+'</b></div>';
  });
  html+='</div>';
  const av=activeVenue();
  if(av)html+='<div class="lead"><b>NEXT LEAD</b><br>Land at '+av.name+' '+av.jp+'</div>';
  el.innerHTML=html;
}
// Two levels of objective text, deliberately different lengths:
//   missionHeadline() -> the short label in the HUD's top-centre pill
//   objectiveText()   -> the full instruction in the bottom command box
// Showing the same sentence in both is what made the old HUD feel doubled-up.
function missionHeadline(){
  if(missionDone)return 'OPERATION COMPLETE';
  if(deliverCountdown)return deliverCountdown;                 // timed delivery overrides
  if(aboard.length)return 'FERRY '+aboard.length+' TO THE NAVY SHIP';
  const pend=stagePendingCrew();
  if(pend.length)return 'HOIST '+pend.map(c=>c.rank+' '+c.call).join(' & ');
  const v=activeVenue();

// On-foot HUD: the flight instruments (tapes, reticle, weapon rack) make no sense indoors, so this
// draws a minimal ground panel — where you are, who you're looking for, and the controls.
function drawFootHUD(now){
  const dpr=DPR();hudX.setTransform(dpr,0,0,dpr,0,0);
  const w=W(),h=H();hudX.clearRect(0,0,w,h);
  hudX.textBaseline='alphabetic';
  const pw=Math.min(360,w-24), M=UI.M;
  hudPanel(M,M,pw,68,'ON FOOT — '+(curVenue?curVenue.name:''));
  hudX.textAlign='left';hudX.font=T(UI.label);hudX.fillStyle=UI.dim;
  hudX.fillText(curVenue?curVenue.jp:'',M+UI.PAD,M+38);
  const left=CREW.filter(c=>!c.rescued).length;
  hudX.fillStyle=UI.hi;hudX.font=T(UI.body,true);
  hudX.fillText('CREW STILL MISSING: '+left+'/'+CREW.length,M+UI.PAD,M+56);
  // subtle centre dot so the player has an aim/interaction reference
  hudX.strokeStyle=UI.dim;hudX.lineWidth=1.2;
  hudX.beginPath();hudX.arc(w/2,h*0.5,3.5,0,7);hudX.stroke();
  // GUIDE MARKER: project the counter (or the exit, once you have the lead) so you always know where
  // to walk inside — the rooms are small but it should never be a hunt
  if(curVenue&&!dlgLines){
    const I=getInterior(curVenue.key);
    const goTalk=!curVenue.visited;
    const t=goTalk?I.talk:I.exit;
    const wp=new THREE.Vector3(t.x,goTalk?1.5:1.7,t.z);
    const v=wp.clone().project(fpCam);
    const on=v.z>-1&&v.z<1;
    const sx=(v.x*0.5+0.5)*w, sy=(-v.y*0.5+0.5)*h;
    const col=goTalk?UI.warn:UI.ui, lbl=goTalk?'OWNER — PRESS F':'EXIT — PRESS X';
    hudX.save();
    if(on&&sx>40&&sx<w-40&&sy>70&&sy<h-90){
      hudX.strokeStyle=col;hudX.lineWidth=2;
      hudX.beginPath();hudX.arc(sx,sy,13,0,7);hudX.stroke();
      hudX.beginPath();hudX.moveTo(sx,sy-19);hudX.lineTo(sx-5,sy-28);hudX.lineTo(sx+5,sy-28);hudX.closePath();hudX.fillStyle=col;hudX.fill();
      hudX.font=T(UI.body,true);hudX.textAlign='center';hudX.fillStyle=col;hudX.fillText(lbl,sx,sy+27);
    }else{
      // behind you: arrow at the screen edge telling you which way to turn
      const ang=Math.atan2(t.x-fp.x,t.z-fp.z)-fp.yaw;
      const r=Math.min(w,h)*0.3, ax=w/2+Math.sin(ang)*r, ay=h*0.5-Math.cos(ang)*r;
      hudX.translate(ax,ay);hudX.rotate(ang);
      hudX.fillStyle=col;hudX.beginPath();hudX.moveTo(0,-15);hudX.lineTo(10,9);hudX.lineTo(0,3);hudX.lineTo(-10,9);hudX.closePath();hudX.fill();
      hudX.rotate(-ang);
      hudX.font=T(UI.body,true);hudX.textAlign='center';hudX.fillStyle=col;hudX.fillText(lbl,0,24);
    }
    hudX.restore();
  }
}
// ---------- on-foot update ----------
function updateInterior(dt){
  const I=getInterior(curVenue.key);
  // ARROW-KEY NAVIGATION (classic first-person): UP/DOWN walk forward and back, LEFT/RIGHT turn.
  // WASD still works for strafing, and the mouse looks around freely (including up and down).
  let mf=0,ms=0;
  if(keys['ArrowUp']||keys['KeyW'])mf+=1;
  if(keys['ArrowDown']||keys['KeyS'])mf-=1;
  if(keys['ArrowLeft'])fp.yaw+=2.1*dt;
  if(keys['ArrowRight'])fp.yaw-=2.1*dt;
  if(keys['KeyA'])ms-=1;
  if(keys['KeyD'])ms+=1;
  if(keys['KeyQ'])fp.yaw+=2.1*dt;
  if(keys['KeyE'])fp.yaw-=2.1*dt;
  if(keys['KeyR'])fp.pitch+=1.5*dt;
  if(keys['KeyV'])fp.pitch-=1.5*dt;
  if(fp.mdx||fp.mdy){fp.yaw-=fp.mdx*0.0028;fp.pitch-=fp.mdy*0.0028;fp.mdx=0;fp.mdy=0;}
  fp.pitch=Math.max(-1.15,Math.min(1.15,fp.pitch)); // clamp so you can look at the ceiling and the floor
  const spd=3.1;
  const nx=fp.x+(-Math.sin(fp.yaw)*mf+Math.cos(fp.yaw)*ms)*spd*dt;
  const nz=fp.z+(-Math.cos(fp.yaw)*mf-Math.sin(fp.yaw)*ms)*spd*dt;
  const inCounter=(x,z)=>I.counter&&x>I.counter.x0-0.35&&x<I.counter.x1+0.35&&z>I.counter.z0-0.35&&z<I.counter.z1+0.35;
  if(Math.abs(nx)<I.bounds.x&&!inCounter(nx,fp.z))fp.x=nx;
  if(Math.abs(nz)<I.bounds.z&&!inCounter(fp.x,nz))fp.z=nz;
  for(let i=0;i<interiorMixers.length;i++)interiorMixers[i].update(dt); // shopkeeper idle animation
  if(I.map&&I.map.g.visible){                                            // pulse the item you can pick up
    const t=performance.now();
    I.map.glow.material.opacity=0.15+0.15*Math.sin(t*0.005);
    I.map.g.position.y=I.map.baseY+Math.sin(t*0.0032)*0.007;
  }
  if(mf||ms)fp.bob+=dt*9;
  fpCam.position.set(fp.x,1.62+Math.sin(fp.bob)*0.035,fp.z);
  fpCam.rotation.set(fp.pitch,fp.yaw,0,'YXZ');
  fpCam.updateMatrixWorld(true);
  // prompts
  const dTalk=Math.hypot(fp.x-I.talk.x,fp.z-I.talk.z);
  const dExit=Math.hypot(fp.x-I.exit.x,fp.z-I.exit.z);
  const tp=document.getElementById('taskPanel');
  dlgCool=Math.max(0,dlgCool-dt);
  if(dlgLines){
    tp.textContent='';
    // advance with F, the arrow keys, Enter or Space — whichever the player reaches for
    const adv=keys['KeyF']||keys['ArrowRight']||keys['ArrowDown']||keys['Enter']||keys['Space'];
    if(adv&&dlgCool<=0){advanceDialog();dlgCool=0.28;
      ['KeyF','ArrowRight','ArrowDown','Enter','Space'].forEach(k=>keys[k]=false);}
  }else if(pendingGive&&I.mapPos){
    const dMap=Math.hypot(fp.x-I.mapPos.x,fp.z-I.mapPos.z);
    if(dMap<2.1){
      tp.textContent='▶ PRESS F (or click it) — TAKE THE MAP FROM THE COUNTER';
      if((keys['KeyF']||fp.click)&&dlgCool<=0){takeGive();keys['KeyF']=false;fp.click=false;dlgCool=0.3;}
    }else tp.textContent='▶ THE MAP IS ON THE COUNTER — WALK UP AND TAKE IT';
    fp.click=false;
  }else{
    fp.click=false;
    if(dTalk<2.4&&!curVenue.visited)tp.textContent='▶ PRESS F — TALK TO THE OWNER (they know where your crew is)';
    else if(dTalk<2.4)tp.textContent='You already have this lead. Check the INTEL panel outside.';
    else if(dExit<2.2)tp.textContent='PRESS X — STEP BACK OUT TO THE HELICOPTER';
    else tp.textContent=curVenue.name+' '+curVenue.jp+' — walk to the counter (F to talk) · X to leave';
    if(keys['KeyF']&&dTalk<2.4&&!curVenue.visited&&dlgCool<=0){startDialog(curVenue);keys['KeyF']=false;}
    if(keys['KeyX']&&dExit<2.2)exitVenue();
  }
}
// ---------- CREW EXTRACTION: winch hoist ------------------------------------
// Flying near a crewman no longer picks them up. You have to hold a stable hover
// over them while the hoist runs — inside the ring, in the altitude band, and slow
// — for EXTRACT_TIME seconds. Drift, climb away or take a hit and the cable pays
// back out. That turns each rescue into a moment where you are a slow, low, very
// obvious target, which is the whole point.
const EXTRACT_TIME=4.2, EXTRACT_R=13, EXTRACT_LO=5, EXTRACT_HI=24, EXTRACT_SPD=13;
let winch={crew:null,t:0,line:null,hook:null,lastPos:new THREE.Vector3(),spd:0,fail:''};
let crewBoardT=-9999, crewBoardWho=null;   // drives the 'X ABOARD' dossier card in the HUD

function buildWinch(){
  if(winch.line)return;
  const g=new THREE.Group();
  const cable=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1,6),
    new THREE.MeshBasicMaterial({color:0xdfe8ee}));
  cable.name='cable';g.add(cable);
  const hook=new THREE.Mesh(new THREE.TorusGeometry(0.42,0.13,6,12),
    new THREE.MeshStandardMaterial({color:0xffc23a,emissive:0xff8a00,emissiveIntensity:0.6,roughness:0.4,metalness:0.7}));
  hook.rotation.x=Math.PI/2;g.add(hook);
  const glow=new THREE.PointLight(0xffc23a,1.4,22,2);g.add(glow);
  g.visible=false;scene.add(g);
  winch.line=g;winch.hook=hook;winch.glow=glow;winch.cable=cable;
}

// horizontal ground speed, measured from actual movement rather than throttle, so
// a fast drift with the throttle back still counts as unstable
function heliGroundSpeed(dt){
  const p=heli.position;
  const d=Math.hypot(p.x-winch.lastPos.x,p.z-winch.lastPos.z);
  winch.lastPos.set(p.x,p.y,p.z);
  return dt>0?d/dt:0;
}

function updateCrewRescue(dt){
  if(interiorMode)return;
  buildWinch();
  winch.spd=heliGroundSpeed(dt);

  // pick the nearest un-recovered, located crewman inside the hoist ring
  let tgt=null,bd=1e9;
  CREW.forEach(c=>{
    if(c.rescued||!c.found||c.aboard)return;
    const d=Math.hypot(heli.position.x-c.x,heli.position.z-c.z);
    if(d<EXTRACT_R&&d<bd){bd=d;tgt=c;}
  });

  if(!tgt){
    // out of the ring — retract and forget
    if(winch.crew){winch.crew=null;winch.t=0;}
    winch.t=Math.max(0,winch.t-dt*2);
    winch.fail='';
    winch.line.visible=false;
    return;
  }
  if(winch.crew!==tgt){winch.crew=tgt;winch.t=0;}

  // stability gates, checked in the order the pilot should fix them
  const alt=heli.position.y;
  let ok=true;
  if(alt>EXTRACT_HI){winch.fail='DESCEND';ok=false;}
  else if(alt<EXTRACT_LO){winch.fail='CLIMB';ok=false;}
  else if(winch.spd>EXTRACT_SPD){winch.fail='SLOW DOWN';ok=false;}
  else if(bd>EXTRACT_R*0.72){winch.fail='CENTRE OVER MARK';ok=false;}
  else winch.fail='';

  if(ok)winch.t=Math.min(EXTRACT_TIME,winch.t+dt);
  else  winch.t=Math.max(0,winch.t-dt*1.4);          // pays back out faster than it winds in

  // cable: hangs from the airframe down toward the crewman as progress builds
  const frac=winch.t/EXTRACT_TIME;
  winch.line.visible=winch.t>0.05;
  if(winch.line.visible){
    const top=heli.position.y-1.2;
    const drop=Math.max(1.5,(top-1.2)*Math.min(1,frac*1.35));
    winch.cable.scale.y=drop;
    winch.cable.position.set(0,-drop/2,0);
    winch.hook.position.set(0,-drop,0);
    winch.glow.position.set(0,-drop,0);
    winch.glow.intensity=ok?1.6:0.5;
    winch.hook.material.emissiveIntensity=ok?0.8:0.25;
    winch.line.position.set(heli.position.x,top,heli.position.z);
    winch.hook.rotation.z+=dt*(ok?3:0.6);
  }

  if(winch.t>=EXTRACT_TIME){
    const c=tgt;
    c.aboard=true;aboard.push(c);
    if(c.marker){scene.remove(c.marker);c.marker=null;}
    winch.crew=null;winch.t=0;winch.line.visible=false;
    crewBoardT=performance.now();crewBoardWho=c;
    flashMsg(c.call+' ABOARD — '+c.perk,UI.ok);
    comRadio('CREW: '+c.rank+' '+c.name+' IS ON THE HOIST. '+c.perkNote.toUpperCase()+'.');
    applyCrewPerks();
    addScore(1500);
    renderIntelLog();
  }
}

// Perks are numbers, not flavour: ammo caps grow the moment the crew chief is aboard.
function applyCrewPerks(){
  const cap=perkAmmoCap();
  ammoMax=BASE_AMMO_MAX.map(v=>v===Infinity?Infinity:Math.round(v*cap));
  for(let i=0;i<4;i++)if(ammo[i]!==Infinity)ammo[i]=Math.min(ammo[i],ammoMax[i]);
  updAmmoUI();
}

// ---------- DELIVERY: set them down on the deck -----------------------------
// Also no longer a fly-past: you have to actually come down onto the pad, slowly.
function updateCrewDelivery(){
  if(!aboard.length||!window.__navyShip)return;
  const P=window.__navyShip.padPos;
  const d=Math.hypot(heli.position.x-P.x,heli.position.z-P.z);
  const low=heli.position.y<P.y+9;
  const slow=winch.spd<16;
  window.__deckState=(d>30)?null:(!low?'DESCEND TO THE DECK':!slow?'SLOW DOWN':'SET DOWN');
  if(d<15&&low&&slow){
    aboard.forEach(c=>{c.rescued=true;c.aboard=false;});
    const n=aboard.length;aboard=[];
    addScore(2500*n);
    flashMsg(n+' CREW DELIVERED  +'+(2500*n),UI.warn);
    window.__deckState=null;
    if(crewRemaining()===0){
      missionDone=true;
      flashMsg('OPERATION COMPLETE — ALL CREW HOME',UI.ok);
      comRadio('COMMAND: EVERY LAST ONE OF THEM IS ON THE DECK. OUTSTANDING NIGHT, PILOT.');
      addScore(10000);
    }else comRadio('COMMAND: THEY ARE SAFE. '+crewRemaining()+' STILL OUT THERE.');
    renderIntelLog();
    checkStageProgress();
  }
}

// ---------- PERF: merge pooled static geometry to slash draw calls ----------
// The city runs ~5.2k draw calls/frame; ~2.6k of those meshes share just 47
// pooled materials. Fusing each pooled group into a single mesh removes ~2.5k
// draw calls with no visual change (frustum culling barely helps here — from the
// air you see the whole city anyway). Dynamic subtrees (heli, ship, train) are
// excluded so nothing that moves gets frozen; moving cars are already instanced.
(function mergePooledStatics(){
  try{
    const dyn=new Set([heli]);
    if(window.__navyShip&&window.__navyShip.g)dyn.add(window.__navyShip.g);
    if(window.__train&&window.__train.cars)window.__train.cars.forEach(c=>dyn.add(c));
    const isDyn=o=>{let n=o;while(n){if(dyn.has(n))return true;n=n.parent;}return false;};
    scene.updateMatrixWorld(true);
    const byMat=new Map();
    scene.traverse(o=>{
      if(!o.isMesh||o.isInstancedMesh)return;
      if(Array.isArray(o.material)||isDyn(o))return;
      const g=o.geometry,m=o.material;
      if(!g||!g.index||!g.getAttribute('position')||!g.getAttribute('normal')||!g.getAttribute('uv'))return;
      if(m.transparent&&m.blending!==THREE.AdditiveBlending)return; // preserve alpha-blend order
      let e=byMat.get(m.uuid); if(!e){e={mat:m,list:[]};byMat.set(m.uuid,e);} e.list.push(o);
    });
    const mNorm=new THREE.Matrix3(),v=new THREE.Vector3(),n=new THREE.Vector3();
    let mergedMeshes=0,removed=0;
    byMat.forEach(({mat,list})=>{
      if(list.length<2)return;
      const P=[],N=[],U=[],I=[]; let voff=0;
      for(const o of list){
        const g=o.geometry,pos=g.getAttribute('position'),nor=g.getAttribute('normal'),uv=g.getAttribute('uv'),idx=g.index;
        mNorm.getNormalMatrix(o.matrixWorld);
        for(let i=0;i<pos.count;i++){
          v.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld); P.push(v.x,v.y,v.z);
          n.fromBufferAttribute(nor,i).applyNormalMatrix(mNorm).normalize(); N.push(n.x,n.y,n.z);
          U.push(uv.getX(i),uv.getY(i));
        }
        for(let i=0;i<idx.count;i++) I.push(idx.getX(i)+voff);
        voff+=pos.count;
      }
      const geo=new THREE.BufferGeometry();
      geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
      geo.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));
      geo.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));
      geo.setIndex(new THREE.Uint32BufferAttribute(I,1));
      const mesh=new THREE.Mesh(geo,mat);
      mesh.castShadow=list.some(o=>o.castShadow);
      mesh.receiveShadow=list.some(o=>o.receiveShadow);
      mesh.frustumCulled=false; mesh.renderOrder=list[0].renderOrder;
      scene.add(mesh);
      for(const o of list){ if(o.parent)o.parent.remove(o); removed++; }
      mergedMeshes++;
    });
    window.__mergeStats={mergedMeshes,removed};
  }catch(err){ window.__mergeErr=String(err&&err.stack||err); }
})();

let last=performance.now(),screenT=0;
let __frame=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,0.05);last=now;
  if((__frame++&1)===0)renderer.shadowMap.needsUpdate=true; // refresh shadows every 2nd frame (see setup)
  if(!gameOver&&interiorMode){ // ON FOOT inside a venue — the city sim is paused while you're indoors
    updateInterior(dt);

  }
  if(!gameOver){
    let turn=0,climb=0;
    if(keys['ArrowLeft']||keys['KeyA'])turn+=1;
    if(keys['ArrowRight']||keys['KeyD'])turn-=1;
    if(keys['ArrowUp']||keys['KeyW'])climb+=1;
    if(keys['ArrowDown']||keys['KeyS'])climb-=1;
    turn+=-stick.dx;climb+=-stick.dy;
    turn=Math.max(-1,Math.min(1,turn));climb=Math.max(-1,Math.min(1,climb));
    yaw+=turn*1.5*dt;
    const targetV=climb*(climb<0?30:22);
    vSpeed=THREE.MathUtils.lerp(vSpeed,targetV,(climb<0?9:5)*dt);
    if(window.__throttleTarget===undefined)window.__throttleTarget=1;
    if(window.__throttle===undefined)window.__throttle=1;
    {const _tt=window.__throttleTarget!==undefined?window.__throttleTarget:1;
     const _brake=_tt<window.__throttle;                    // decelerating into a hover
     window.__throttle=THREE.MathUtils.lerp(window.__throttle,_tt,(_brake?3.4:1.6)*dt);}
    {const hb=document.getElementById('stopBtn');if(hb)hb.classList.toggle('on',window.__throttleTarget<0.5);} // HVR lights up when hover engaged
    const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    heli.position.add(fwd.clone().multiplyScalar(CRUISE*perkSpeed()*window.__throttle*dt));
    heli.position.y=Math.max(3,Math.min(180,heli.position.y+vSpeed*dt));
    if(window.__forceLowAlt){heli.position.y=6;vSpeed=0;} // TEMP DEBUG - remove before final
    heli.position.x=Math.max(-620,Math.min(620,heli.position.x));
    heli.position.z=Math.max(-620,Math.min(820,heli.position.z)); // +z extended into Tokyo Bay so you can ferry survivors out to the Navy ship
    // altitude-based fade for tiny bright emitters (neon-sign glow, warm sidewalk spill, billboard glow):
    // full strength near the street, damped when zoomed out from height so they stop sub-pixel twinkling
    const __altFade=THREE.MathUtils.clamp(1-(heli.position.y-55)/110,0.22,1);
    if(hp>0&&hp<100)hp=Math.min(100,hp+perkRepair()*dt);   // medic patches the airframe in flight
    pitch=THREE.MathUtils.lerp(pitch,0.1-climb*0.12,3*dt);
    roll=THREE.MathUtils.lerp(roll,turn*0.35,3*dt);
    heli.rotation.set(0,yaw,0);heli.rotateX(pitch);heli.rotateZ(roll);
    rotor.rotation.y+=30*dt;tailRotor.rotation.x+=42*dt;disc.rotation.z+=30*dt;
    strobe.visible=(now%1000)<80;
    buildings.forEach(b=>{
      const p=heli.position,bp=b.m.position;
      if(Math.abs(p.x-bp.x)<b.w/2+2.5&&Math.abs(p.z-bp.z)<b.d/2+2.5&&p.y<b.h+2){
        hp-=8*perkArmour();shake=Math.min(1,shake+.6);
        const push=new THREE.Vector3(p.x-bp.x,0,p.z-bp.z).normalize().multiplyScalar(4);
        heli.position.add(push);heli.position.y=Math.min(180,b.h+4);
        flashMsg('COLLISION!',UI.alert);sfx(0.4,0.35,200);
      }
    });
    // hostage pickup / delivery check
    if(hostage){
      const dHoriz=Math.hypot(heli.position.x-hostage.pos.x,heli.position.z-hostage.pos.z);
      if(dHoriz<14&&heli.position.y<hostage.pos.y+10)rescueHostage();
    }
    // Timed-delivery countdown. This used to overwrite missionLine unconditionally with
    // "MISSION n — RESCUE HOSTAGE", which clobbered the crew-campaign headline on every
    // frame and left the pre-rebrand text on the HUD for the whole run.
    if(hostage&&hostage.state==='pad'){
      missionTimer=Math.max(0,missionTimer-dt);
      deliverCountdown='DELIVER '+Math.ceil(missionTimer)+'s'+(missionTimer<=0?' — NO BONUS':'');
    }else{
      deliverCountdown=null;
    }
    for(let i=0;i<4;i++)cd[i]-=dt;
    if(keys['Space']||fireHeld)fire();
    muzzleT-=dt;muzzleL.intensity=muzzleT>0?4:0;
    muzzleL.position.copy(heli.position).add(new THREE.Vector3(0,0,-4).applyQuaternion(heli.quaternion));
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      if(b.grav)b.v.y-=22*dt;
      if((b.type===1||b.type===2)&&b.tg&&b.tg.hp>0){
        const spd=b.v.length()||100;
        const want=b.tg.m.position.clone().add(new THREE.Vector3(0,2,0)).sub(b.m.position).normalize().multiplyScalar(spd);
        b.v.lerp(want,(b.turn||2)*dt);
        b.m.lookAt(b.m.position.clone().add(b.v));b.m.rotateX(Math.PI/2);
      }
      const prev=b.m.position.clone();
      b.m.position.add(b.v.clone().multiplyScalar(dt));
      b.t-=dt;
      if(b.type===1||b.type===2){
        b.trailT=(b.trailT||0)-dt;
        if(b.trailT<=0){
          b.trailT=0.045;
          const s=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,transparent:true,opacity:.55,depthWrite:false}));
          const sc=0.9+Math.random()*0.6;
          s.scale.set(sc,sc,1);
          s.position.copy(b.m.position).add(new THREE.Vector3((Math.random()-.5)*.4,(Math.random()-.5)*.4,(Math.random()-.5)*.4));
          pushFX({m:s,v:new THREE.Vector3((Math.random()-.5)*1.2,0.8+Math.random()*0.8,(Math.random()-.5)*1.2),t:0.8+Math.random()*0.5,smoke:true});
          scene.add(s);
        }
      }
      // swept hit tests against the travel segment prev->pos, so bullets never tunnel through targets
      let hit=(prev.y>0.2&&b.m.position.y<=0.2)||b.m.position.y<=0.2; // crossed / reached the ground
      if(!hit)for(const z of zombies){
        if(z.hp<=0)continue;
        const zc=z.m.position.clone().setY(z.m.position.y+(z.big?3.2:2.0)); // aim at torso height
        if(distToSeg(zc,prev,b.m.position)<(z.big?4.6:2.8)){hit=true;break;}
      }
      if(!hit)for(const e of enemies){
        if(e.hp<=0)continue;
        const ec=e.m.position.clone().setY(e.m.position.y+(e.kind==='boat'?6:1));
        if(distToSeg(ec,prev,b.m.position)<(e.kind==='boat'?13:4.6)){hit=true;break;}
      }
      if(!hit)for(const bd of buildings){
        if(Math.abs(b.m.position.x-bd.m.position.x)<bd.w/2&&Math.abs(b.m.position.z-bd.m.position.z)<bd.d/2&&b.m.position.y<bd.h){hit=true;break;}
      }
      if(hit||b.t<=0){
        if(b.type===0){
          // damage every zombie/enemy whose hull is within the tracer's travel segment (+splash)
          zombies.forEach(z=>{if(z.hp<=0)return;const zc=z.m.position.clone().setY(z.m.position.y+(z.big?3.2:2.0));if(distToSeg(zc,prev,b.m.position)<b.r+(z.big?2.6:0.8)){z.hp-=b.dmg;blood(zc);}});
          enemies.forEach(e=>{if(e.hp<=0)return;const ec=e.m.position.clone().setY(e.m.position.y+(e.kind==='boat'?6:1));if(distToSeg(ec,prev,b.m.position)<b.r+(e.kind==='boat'?10:2.6)){e.hp-=b.dmg;}});
        }else explode(b.m.position,b.r,b.dmg,b.type===3);
        scene.remove(b.m);bullets.splice(i,1);
      }
    }
    for(let i=zombies.length-1;i>=0;i--){
      const z=zombies[i];
      if(z.hp<=0){
        blood(z.m.position);
        scene.remove(z.m);zombies.splice(i,1);
        kills++;bumpStreak();killPopT=now;
        addScore(z.big?500:100);
        continue;
      }
      if(z.mixer)z.mixer.update(dt);
      const to=heli.position.clone().setY(0).sub(z.m.position.clone().setY(0));
      const d=to.length();to.normalize();
      z.ph+=dt*8;
      if(z.leap>0){
        z.leap-=dt;
        z.m.position.y+=z.vy*dt;z.vy-=30*dt;
        z.m.position.add(to.multiplyScalar(z.spd*3*dt));
        if(z.m.position.y<=0){z.m.position.y=0;z.leap=0;}
        if(z.m.position.distanceTo(heli.position)<(z.big?6.5:3.8)){
          shake=Math.min(1,shake+0.3);z.leap=0;z.m.position.y=0;
        }
      }else{
        z.m.position.add(to.multiplyScalar(z.spd*dt));
        z.m.position.y=Math.abs(Math.sin(z.ph))*.25;
        z.m.rotation.y=Math.atan2(to.x,to.z);
        z.m.rotation.z=Math.sin(z.ph*.7)*.08;
        if(d<15&&heli.position.y<(z.big?28:15)&&Math.random()<0.02){
          z.leap=1.4;z.vy=(z.big?20:16)+heli.position.y*0.8;
        }
      }
    }
    updateEnemies(dt,now);
    updateHostileBullets(dt,now);
    {
      if(!window.__lock)window.__lock={target:null,t:0,locked:false};
      const LK=window.__lock;
      const activeMissile=bullets.find(b=>(b.type===1||b.type===2)&&b.tg&&b.tg.hp>0);
      let candidate=activeMissile?activeMissile.tg:null;
      if(!candidate){
        const lfwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
        let best=null,bestScore=-1;
        const scan=(obj,range,bias)=>{
          if(obj.hp<=0)return;
          const to=obj.m.position.clone().sub(heli.position);
          const dist=to.length();if(dist>range)return;
          to.normalize();const dot=lfwd.dot(to);
          if(dot>0.35){const score=dot-dist*0.001+bias;if(score>bestScore){bestScore=score;best=obj;}}
        };
        zombies.forEach(z=>scan(z,260,0));
        enemies.forEach(e=>scan(e,420,0.25)); // enemy gunships/boss are priority lock targets
        candidate=best;
      }
      if(candidate!==LK.target){LK.target=candidate;LK.t=0;LK.locked=false;if(candidate)sfx(0.05,0.12,0,2200);}
      if(LK.target)LK.t+=dt;else LK.t=0;
      const wasLocked=LK.locked;
      LK.locked=LK.target&&LK.t>=LOCK_TIME;
      if(LK.locked&&!wasLocked)sfx(0.09,0.16,2600,4200); // confirm-lock chirp
    }
    if(zombies.length===0&&now-waveSpawned>8000){wave++;waveSpawned=now;startWave();}
    const vgEl=document.getElementById('vignette');
    if(hp<30&&hp>0){
      const pulse=0.35+0.25*Math.sin(now/220);
      vgEl.style.background=`radial-gradient(ellipse at center, transparent 40%, rgba(180,20,20,${pulse}) 100%)`;
      cautionLight.material.color.setHex(Math.sin(now/150)>0?0xff2222:0x220000);
      if(!window.__lastCaution||now-window.__lastCaution>1100){window.__lastCaution=now;sfx(0.18,0.25,1400,1800);}
    }else{
      vgEl.style.background='radial-gradient(ellipse at center, transparent 50%, rgba(6,4,18,.55) 100%)';
      cautionLight.material.color.setHex(0x220000);
    }
    if(hp<=0){endRun();}
    // streak decay
    if(streakT>0){streakT-=dt;if(streakT<=0){streak=0;mult=1;comboEl.style.opacity=0;}}
    for(let i=explosions.length-1;i>=0;i--){
      const e=explosions[i];
      e.m.position.add(e.v.clone().multiplyScalar(dt));
      if(e.ember){e.v.y-=22*dt;}
      else if(e.fire){e.v.multiplyScalar(1-3*dt);e.v.y+=2*dt;}
      else if(e.smoke){e.v.multiplyScalar(1-1.2*dt);e.v.y+=1*dt;}
      else if(e.core){e.v.multiplyScalar(1-5*dt);}
      else if(e.muzzle){e.v.multiplyScalar(1-6*dt);}
      e.t-=dt;
      const life=Math.max(0,e.t);

      }
      for(let i=0;i<34;i++){ // denser expressway traffic (was 22)
        const kind=Math.random()<0.55?0:(Math.random()<0.7?1:2);
        const v=mkVehicle(kind);
        const lane=Math.random()<.5?-3.5:3.5;
        v.rotation.y=lane<0?0:Math.PI;
        scene.add(v);
        window.__hwyCars.push({m:v,lane,pos:(Math.random()-.5)*CITY*1.9,spd:(kind===2?12:kind===1?16:22)+Math.random()*8,dir:lane<0?1:-1});
      }
    }
    window.__hwyCars.forEach(c=>{
      c.pos+=c.spd*c.dir*dt;
      if(c.pos>CITY)c.pos=-CITY;if(c.pos<-CITY)c.pos=CITY;
      c.m.position.set(c.pos,17.4,HWY_Z+c.lane);
    });
    // pedestrians read as sub-pixel twinkling dots from high altitude — cull the whole instanced
    // batch (2 draw calls) above a threshold, with hysteresis so it doesn't pop back and forth
    if(window.__pedHidden===undefined)window.__pedHidden=false;
    if(heli.position.y>140)window.__pedHidden=true;else if(heli.position.y<115)window.__pedHidden=false;
    pedBodyMesh.visible=pedHeadMesh.visible=!window.__pedHidden;
    // pedestrians: sidewalk walkers + crossing walkers, animated via instance-matrix updates (cheap; 0 extra draw calls)
    if(peds.length&&!window.__pedHidden){
      const pdum=window.__pedDummy||(window.__pedDummy=new THREE.Object3D());
      for(let i=0;i<peds.length;i++){
        const p=peds[i];
        p.pos+=p.spd*p.dir*dt;
        if(p.wrap){if(p.pos>p.max)p.pos=p.min;if(p.pos<p.min)p.pos=p.max;}
        else if(p.pos>p.max||p.pos<p.min){p.dir*=-1;p.pos=Math.max(p.min,Math.min(p.max,p.pos));}
        p.phase+=dt*6;
        const wx=p.axis==='x'?p.pos:p.fixed, wz=p.axis==='x'?p.fixed:p.pos;
        const bob=Math.abs(Math.sin(p.phase))*0.06;
        const yawP=p.axis==='x'?(p.dir>0?Math.PI/2:-Math.PI/2):(p.dir>0?0:Math.PI);
        pdum.position.set(wx,bob,wz);pdum.rotation.set(0,yawP,0);pdum.updateMatrix();
        pedBodyMesh.setMatrixAt(i,pdum.matrix);
        pdum.position.y=PED_HEAD_Y+bob;pdum.updateMatrix();
        pedHeadMesh.setMatrixAt(i,pdum.matrix);
      }
      pedBodyMesh.instanceMatrix.needsUpdate=true;pedHeadMesh.instanceMatrix.needsUpdate=true;
    }
    if(cockpitMode){
      cam.position.copy(heli.position).add(new THREE.Vector3(0,1.0,-0.9).applyQuaternion(heli.quaternion));
      cam.lookAt(heli.position.clone().add(new THREE.Vector3(0,.3,-40).applyQuaternion(heli.quaternion)));
    }else{
      const cpos=heli.position.clone().add(new THREE.Vector3(Math.sin(yaw)*24,10,Math.cos(yaw)*24));
      cam.position.lerp(cpos,5*dt);
      cam.lookAt(heli.position.clone().add(fwd.clone().multiplyScalar(10)));
    }
    cam.position.y+=Math.sin(now/28)*0.03;
    if(shake>0){cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake;}
    sky.position.copy(cam.position);
    window.__ring.position.x=cam.position.x;window.__ring.position.z=cam.position.z;
    moonSprite.position.set(cam.position.x-600,500,cam.position.z-1200);
    moonHalo.position.copy(moonSprite.position);
    if(!cockpitMode && Math.floor(now/200)%5===0){
      heli.visible=false;
      cubeCam.position.copy(heli.position);
      cubeCam.update(renderer,scene);
      heli.visible=true;
    }
    sun.position.copy(heli.position).add(new THREE.Vector3(180,300,-220));
    sun.target=heli;
    rim.position.copy(heli.position).add(new THREE.Vector3(-200,120,260));
    rim.target=heli;
    cockpitGroup.visible=cockpitMode;
    heli.visible=!cockpitMode;
    drawDashMFD();
    updateCrewRescue(dt);updateCrewDelivery();
    // animate the landing pads: chevrons march down the beam, lights chase around the ring, the name
    // board always faces the pilot — so a pad reads as "land here" from any approach
    VENUES.forEach(v=>{
      if(!v.marker||!v.marker.visible)return;
      v.board.lookAt(cam.position);
      const t=now/1000;
      v.chev.forEach((c,i)=>{
        let y=8+((i*9)-(t*11)%36+36)%36;
        c.position.y=y;c.material.opacity=0.25+0.6*(1-y/44);
      });
      v.tdl.forEach((l,i)=>{ l.material.color.setHex(((Math.floor(t*7)+i)%12===0)?0xffffff:0x7ff6ff); });
      v.ring.material.opacity=0.45+0.3*Math.sin(t*3);
    });
    if((__frame&15)===0)renderIntelLog(); // keep bearings/distances live without rebuilding every frame
    const tp=document.getElementById('taskPanel');
    const nv=nearestVenue();
    if(nv&&!nv.visited)tp.textContent='PRESS E — GO INSIDE '+nv.name+' '+nv.jp;
    else if(nv)tp.textContent=nv.name+' — ALREADY SPOKE TO THE OWNER';
    else tp.textContent=objectiveText();
    if(nv&&!nv.visited&&keys['KeyE'])enterVenue(nv);
    drawHUD(now);
    radarTexMFD.needsUpdate=true;horizonTexMFD.needsUpdate=true;tacTexMFD.needsUpdate=true;
    engTexMFD.needsUpdate=true;wpnTexMFD.needsUpdate=true;
    gauges.forEach(gg=>{
      const v=THREE.MathUtils.clamp(gg.getVal(),gg.range[0],gg.range[1]);
      const f=(v-gg.range[0])/(gg.range[1]-gg.range[0]);
      gg.needleSpin.rotation.z=-Math.PI*0.75+f*Math.PI*1.5;
    });
    glarePlane.material.opacity=0.35+Math.abs(roll)*0.6+Math.abs(pitch)*0.3;
  }else{
    // cinematic menu flythrough around the tower (real-game feel)
    const t=now/11000;
    const cx=TOWER.x+Math.cos(t)*250, cz=TOWER.z+Math.sin(t)*250;
    cam.position.lerp(new THREE.Vector3(cx,74+Math.sin(t*2.1)*30,cz),0.02);
    cam.lookAt(TOWER.x,66,TOWER.z);
    sky.position.copy(cam.position);
    window.__ring.position.x=cam.position.x;window.__ring.position.z=cam.position.z;
    moonSprite.position.set(cam.position.x-600,500,cam.position.z-1200);
    moonHalo.position.copy(moonSprite.position);
    clouds.forEach(cl=>cl.lookAt(cam.position));
    groundHaze.forEach(gh=>gh.lookAt(cam.position));
    pulseSigns.forEach(s=>{
      s.ph+=dt*(s.fast?14:3);
      const v=s.fast?(Math.random()<0.06?0.2:1):(0.75+0.25*Math.sin(s.ph));
      s.mat.opacity=0.2*v;
    });
    screenT+=dt;
    if(screenT>0.5){bigScreens.forEach(bs=>bs.draw(now/1600));screenT=0;}
    if(window.__beacon)window.__beacon.visible=(now%1400)<800;
  }
  renderPost();
}
requestAnimationFrame(loop);
onresize=()=>{
  renderer.setSize(W(),H());cam.aspect=W()/H();cam.updateProjectionMatrix();
  fpCam.aspect=W()/H();fpCam.updateProjectionMatrix();
  sizeHUD();
  bw=Math.floor(W()/3);bh=Math.floor(H()/3);
  bw2=Math.max(2,Math.floor(bw/2));bh2=Math.max(2,Math.floor(bh/2));
  sceneRT.setSize(RW(),RH());
  brightRT.setSize(bw,bh);blurRT1.setSize(bw,bh);blurRT2.setSize(bw,bh);
  wideRT1.setSize(bw2,bh2);wideRT2.setSize(bw2,bh2);
  blurMat.uniforms.res.value.set(bw,bh);
};
</script>
</body>
