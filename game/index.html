<style>

  #grain { position:absolute; inset:0; pointer-events:none; opacity:.05; mix-blend-mode:overlay; z-index:4;
    background-image:repeating-conic-gradient(#000 0 .0001%, #fff 0 .0002%); background-size:180px 180px; }
  .hud { position:absolute; color:#9dffb0; text-shadow:0 0 4px rgba(120,255,150,.6); user-select:none; pointer-events:none; z-index:8; font-family:'Courier New',monospace; }
  #msg { top:34%; left:50%; transform:translate(-50%,-50%); font-size:28px; font-weight:bold; text-align:center; display:none; color:#ff4040; text-shadow:0 0 12px #f00; width:90%; letter-spacing:2px; }

  .mfd::before { content:''; position:absolute; inset:4px; border-radius:9px; border:1px solid rgba(120,220,255,.14); pointer-events:none; }
  .mfd:hover { filter:brightness(1.15); box-shadow:inset 0 1px 0 rgba(180,240,255,.3), inset 0 0 16px rgba(0,60,90,.6), 0 4px 12px rgba(0,0,0,.6), 0 0 20px rgba(70,210,255,.32); }
  .mfd.on { color:#8bffbe; border-color:rgba(140,255,190,.9); box-shadow:inset 0 0 16px rgba(0,70,40,.5), 0 0 22px rgba(90,255,150,.45); }
  #stick-zone { position:absolute; left:0; bottom:0; width:45%; height:55%; pointer-events:auto; z-index:7; }
  #stick-base { position:absolute; width:110px; height:110px; border-radius:50%; border:2px solid rgba(157,255,176,.4); background:rgba(6,18,10,.3); display:none; z-index:9; }
  #stick-knob { position:absolute; width:48px; height:48px; border-radius:50%; background:rgba(157,255,176,.45); display:none; z-index:9; }
  #camBtn { right:150px; bottom:204px; }
  #wpnBtn { right:150px; bottom:60px; }
  #stopBtn { right:150px; bottom:132px; }
  #fireBtn { right:24px; bottom:56px; width:106px; height:106px; border-radius:50%; color:#ff8080;
    background:radial-gradient(circle at 50% 36%, rgba(96,18,22,.96), rgba(34,5,9,.97));
    border:2px solid rgba(255,96,96,.85);
    box-shadow:inset 0 0 24px rgba(255,70,70,.32), 0 0 30px rgba(255,40,60,.42), 0 6px 16px rgba(0,0,0,.6); }
  #fireBtn .ic { font-size:26px; }
  #fireBtn .lb { font-size:11px; letter-spacing:3px; }
  #fireBtn::before { content:''; position:absolute; inset:8px; border-radius:50%; border:2px dashed rgba(255,120,120,.42); animation:fireRing 9s linear infinite; pointer-events:none; }
  #fireBtn:active { filter:brightness(1.25); box-shadow:inset 0 0 30px rgba(255,90,90,.55), 0 0 42px rgba(255,50,70,.75); }
  @keyframes fireRing { to { transform:rotate(360deg); } }
  /* ---- NEON TITLE WORDMARK ---- */
  .logo { display:flex; flex-direction:column; align-items:center; gap:4px; line-height:.9; }
  .logo-main { font-family:'Arial Black',Impact,sans-serif; font-weight:900; font-size:66px; letter-spacing:1px; font-style:italic;
    background:linear-gradient(180deg,#ffffff 0%,#8be9ff 42%,#33c7ff 56%,#0a6fb0 100%);

    filter:drop-shadow(0 0 2px #bff3ff) drop-shadow(0 0 16px #23c6ff); }
  .logo-main em { font-style:italic; margin-left:.16em;
    background:linear-gradient(180deg,#ffffff 0%,#ffb0e6 45%,#ff2f8f 60%,#a01560 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 16px #ff2f8f); }
  .logo-jp { font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Noto Sans JP','MS Gothic',sans-serif; font-weight:700; font-size:19px; letter-spacing:8px; color:#ffd84d; text-shadow:0 0 12px #ff9e2e; padding-left:8px; }
  #cockpit { display:none; }
</style>

<body>

<script>
if(!window.storage){window.storage={_m:{},get(k){return Promise.resolve(this._m[k]?{value:this._m[k]}:null);},set(k,v){this._m[k]=v;return Promise.resolve();}};}
</script>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="SkeletonUtils.js"></script>
<script src="Reflector.js"></script>
<script src="models-zombie.js"></script>
<script>
const W=()=>innerWidth,H=()=>innerHeight;
// PERF: logarithmicDepthBuffer dropped (it disabled early-Z and cost a per-fragment depth write
// everywhere); the compressed 0.5–2600 near/far range below already tames z-fighting. pixelRatio
// capped tighter (1.5) — the scene is fragment-bound (emissive + normal maps), so this is the single
// biggest FPS lever on hi-DPI screens. PCF (not PCFSoft) shadows are markedly cheaper to filter.
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,powerPreference:'high-performance'});
renderer.setSize(W(),H());
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
const scene=new THREE.Scene();
// night neon haze — deep indigo, layered with a low warm ground-haze band (see groundHaze below)
scene.fog=new THREE.FogExp2(0x1c1732,0.00165);
// near raised from 0.1 and far cut from 4000 (biggest fixed scene radius is the sky sphere at 2000)
// to compress the depth range and kill high-altitude z-fighting/shimmer; 0.5 still clears the closest
// 3D cockpit dash geometry (~1.2 units from camera) so cockpit view (press C) is unaffected.
const cam=new THREE.PerspectiveCamera(66,W()/H(),0.5,2600);window.cam=cam;

// PERF helper: merge several same-material geometries (each with a local transform) into ONE
// BufferGeometry, so e.g. a car's 4 wheels become a single mesh / draw call. No addons needed.
function mergeGeos(geoms,matrices){
  const P=[],N=[],U=[],nrm=new THREE.Matrix3(),v=new THREE.Vector3(),nv=new THREE.Vector3();
  geoms.forEach((g,i)=>{
    const gg=g.index?g.toNonIndexed():g, p=gg.attributes.position, n=gg.attributes.normal, u=gg.attributes.uv, m=matrices[i];
    nrm.getNormalMatrix(m);
    for(let k=0;k<p.count;k++){
      v.fromBufferAttribute(p,k).applyMatrix4(m);P.push(v.x,v.y,v.z);
      if(n){nv.fromBufferAttribute(n,k).applyMatrix3(nrm).normalize();N.push(nv.x,nv.y,nv.z);}
      if(u)U.push(u.getX(k),u.getY(k));
    }
  });
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  if(N.length)out.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));
  if(U.length)out.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));
  return out;
}
// build a merged 4-wheel (or 4-hub) set from one cylinder geo at the given [x,y,z] offsets, axle along X
function wheelSetGeo(cyl,offsets){
  const M=[],e=new THREE.Euler(0,0,Math.PI/2);
  return mergeGeos(offsets.map(()=>cyl), offsets.map(o=>{const m=new THREE.Matrix4();m.compose(new THREE.Vector3(o[0],o[1],o[2]),new THREE.Quaternion().setFromEuler(e),new THREE.Vector3(1,1,1));M.push(m);return m;}));
}

// ---------- POST-PROCESSING: manual bloom (no addons available, hand-rolled) ----------
// two-tier mip-style bloom (tight + wide) for a soft, filmic, non-shimmery neon glow
let bw=Math.floor(W()/3),bh=Math.floor(H()/3);
let bw2=Math.max(2,Math.floor(bw/2)),bh2=Math.max(2,Math.floor(bh/2));
const rtParams={minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat};
const sceneRT=new THREE.WebGLRenderTarget(W(),H(),rtParams);
const brightRT=new THREE.WebGLRenderTarget(bw,bh,rtParams);
const blurRT1=new THREE.WebGLRenderTarget(bw,bh,rtParams);
const blurRT2=new THREE.WebGLRenderTarget(bw,bh,rtParams);
const wideRT1=new THREE.WebGLRenderTarget(bw2,bh2,rtParams);
const wideRT2=new THREE.WebGLRenderTarget(bw2,bh2,rtParams);
const postScene=new THREE.Scene();
const postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const brightMat=new THREE.ShaderMaterial({
  uniforms:{tDiffuse:{value:null},threshold:{value:0.63},knee:{value:0.5}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float threshold;uniform float knee;varying vec2 vUv;
    void main(){
      vec4 c=texture2D(tDiffuse,vUv);
      float b=max(c.r,max(c.g,c.b));
      // soft-knee threshold: smooth quadratic rolloff instead of a hard cutoff, avoids per-pixel flicker
      float soft=clamp(b-threshold+knee,0.0,2.0*knee);
      soft=soft*soft/(4.0*knee+0.0001);
      float f=max(soft,b-threshold);
      f=clamp(f/max(b,0.0001),0.0,1.0);
      gl_FragColor=vec4(c.rgb*f,1.0);
    }`
});
const blurMat=new THREE.ShaderMaterial({
  uniforms:{tDiffuse:{value:null},dir:{value:new THREE.Vector2(1,0)},res:{value:new THREE.Vector2(bw,bh)}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform vec2 dir;uniform vec2 res;varying vec2 vUv;
    void main(){
      vec2 texel=dir/res;vec4 sum=vec4(0.0);
      sum+=texture2D(tDiffuse,vUv-4.0*texel)*0.05;
      sum+=texture2D(tDiffuse,vUv-3.0*texel)*0.09;
      sum+=texture2D(tDiffuse,vUv-2.0*texel)*0.12;
      sum+=texture2D(tDiffuse,vUv-1.0*texel)*0.15;
      sum+=texture2D(tDiffuse,vUv)*0.18;
      sum+=texture2D(tDiffuse,vUv+1.0*texel)*0.15;
      sum+=texture2D(tDiffuse,vUv+2.0*texel)*0.12;
      sum+=texture2D(tDiffuse,vUv+3.0*texel)*0.09;
      sum+=texture2D(tDiffuse,vUv+4.0*texel)*0.05;
      gl_FragColor=sum;
    }`
});
const compositeMat=new THREE.ShaderMaterial({
  uniforms:{tScene:{value:null},tBloom:{value:null},tBloomWide:{value:null},bloomStrength:{value:0.6},bloomWideStrength:{value:0.4}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}`,
  fragmentShader:`uniform sampler2D tScene;uniform sampler2D tBloom;uniform sampler2D tBloomWide;uniform float bloomStrength;uniform float bloomWideStrength;varying vec2 vUv;
    void main(){
      vec2 cc=vUv-0.5;
      float r2=dot(cc,cc);
      // restrained radial chromatic aberration, strongest toward the frame edges
      vec2 off=cc*(0.0007+0.0016*r2);
      vec3 s;
      s.r=texture2D(tScene,vUv+off).r;
      s.g=texture2D(tScene,vUv).g;
      s.b=texture2D(tScene,vUv-off).b;
      vec3 bloom=texture2D(tBloom,vUv).rgb*bloomStrength+texture2D(tBloomWide,vUv).rgb*bloomWideStrength;
      vec3 c=s+bloom;
      float l=dot(c,vec3(0.299,0.587,0.114));
      // night grade: teal into shadows, magenta/warm into highlights (filmic split-tone)
      vec3 shadowTint=vec3(-0.018,0.018,0.05);
      vec3 highTint=vec3(0.055,-0.012,0.035);
      c+=shadowTint*(1.0-smoothstep(0.0,0.45,l));
      c+=highTint*smoothstep(0.5,1.0,l);
      // filmic contrast + neon saturation punch
      c=(c-0.5)*1.14+0.5;
      c=mix(vec3(l),c,1.24);
      // gentle vignette
      float vig=1.0-smoothstep(0.28,0.92,sqrt(r2));
      c*=mix(0.82,1.0,vig);
      gl_FragColor=vec4(clamp(c,0.0,1.0),1.0);
    }`
});
const postQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),brightMat);
postScene.add(postQuad);
function renderPost(){
  renderer.setRenderTarget(sceneRT);renderer.render(scene,cam);
  postQuad.material=brightMat;brightMat.uniforms.tDiffuse.value=sceneRT.texture;
  renderer.setRenderTarget(brightRT);renderer.render(postScene,postCam);
  postQuad.material=blurMat;
  blurMat.uniforms.res.value.set(bw,bh);
  blurMat.uniforms.tDiffuse.value=brightRT.texture;blurMat.uniforms.dir.value.set(1,0);
  renderer.setRenderTarget(blurRT1);renderer.render(postScene,postCam);
  blurMat.uniforms.tDiffuse.value=blurRT1.texture;blurMat.uniforms.dir.value.set(0,1);
  renderer.setRenderTarget(blurRT2);renderer.render(postScene,postCam);
  blurMat.uniforms.tDiffuse.value=blurRT2.texture;blurMat.uniforms.dir.value.set(1,0);
  renderer.setRenderTarget(blurRT1);renderer.render(postScene,postCam);
  blurMat.uniforms.tDiffuse.value=blurRT1.texture;blurMat.uniforms.dir.value.set(0,1);
  renderer.setRenderTarget(blurRT2);renderer.render(postScene,postCam);
  // wide tier: downsample the already-smoothed tight bloom (dir=0 => identity copy, weights sum to 1.0)
  // then blur it again at half the resolution — a fixed-tap kernel over a smaller image reads as a much wider, softer halo
  blurMat.uniforms.res.value.set(bw2,bh2);
  blurMat.uniforms.tDiffuse.value=blurRT2.texture;blurMat.uniforms.dir.value.set(0,0);
  renderer.setRenderTarget(wideRT1);renderer.render(postScene,postCam);
  blurMat.uniforms.tDiffuse.value=wideRT1.texture;blurMat.uniforms.dir.value.set(1,0);
  renderer.setRenderTarget(wideRT2);renderer.render(postScene,postCam);
  blurMat.uniforms.tDiffuse.value=wideRT2.texture;blurMat.uniforms.dir.value.set(0,1);
  renderer.setRenderTarget(wideRT1);renderer.render(postScene,postCam);
  blurMat.uniforms.tDiffuse.value=wideRT1.texture;blurMat.uniforms.dir.value.set(1,0);
  renderer.setRenderTarget(wideRT2);renderer.render(postScene,postCam);
  blurMat.uniforms.tDiffuse.value=wideRT2.texture;blurMat.uniforms.dir.value.set(0,1);
  renderer.setRenderTarget(wideRT1);renderer.render(postScene,postCam);
  postQuad.material=compositeMat;
  compositeMat.uniforms.tScene.value=sceneRT.texture;
  compositeMat.uniforms.tBloom.value=blurRT2.texture;
  compositeMat.uniforms.tBloomWide.value=wideRT1.texture;
  renderer.setRenderTarget(null);renderer.render(postScene,postCam);
}

// ---------- SKY: Shinjuku night gradient ----------
const skyTex=(()=>{const cv=document.createElement('canvas');cv.width=512;cv.height=1024;
const g=cv.getContext('2d');const gr=g.createLinearGradient(0,0,0,1024);
gr.addColorStop(0,'#030309');gr.addColorStop(.26,'#0c0a28');gr.addColorStop(.48,'#1e1640');
gr.addColorStop(.66,'#3c2258');gr.addColorStop(.80,'#7a3a68');gr.addColorStop(.90,'#c1567a');
gr.addColorStop(.96,'#e3835f');gr.addColorStop(1,'#f0a468');
g.fillStyle=gr;g.fillRect(0,0,512,1024);
// stars — denser near zenith, fading toward horizon glow
for(let i=0;i<700;i++){
  const y=Math.pow(Math.random(),1.8)*600;
  const x=Math.random()*512;
  const s=Math.random();
  g.fillStyle=`rgba(${220+Math.random()*35},${220+Math.random()*35},255,${0.25+s*0.6})`;
  const sz=s<0.92?1:2;
  g.fillRect(x,y,sz,sz);
}
// faint horizontal atmospheric bands
for(let i=0;i<5;i++){
  const y=350+Math.random()*450;
  const bg=g.createLinearGradient(0,y-20,0,y+20);
  bg.addColorStop(0,'rgba(180,120,200,0)');bg.addColorStop(.5,'rgba(180,120,200,.05)');bg.addColorStop(1,'rgba(180,120,200,0)');
  g.fillStyle=bg;g.fillRect(0,y-20,512,40);
}
// city glow at horizon — richer, wider light-pollution dome (warm core, cooler bleed above)
const hg=g.createLinearGradient(0,760,0,1024);
hg.addColorStop(0,'rgba(255,140,120,0)');hg.addColorStop(.55,'rgba(255,150,140,.16)');hg.addColorStop(1,'rgba(255,190,150,.4)');
g.fillStyle=hg;g.fillRect(0,760,512,264);
const hg2=g.createLinearGradient(0,880,0,1024);
hg2.addColorStop(0,'rgba(255,90,150,0)');hg2.addColorStop(1,'rgba(255,120,150,.22)');
g.fillStyle=hg2;g.fillRect(0,880,512,144);
return new THREE.CanvasTexture(cv);})();
const sky=new THREE.Mesh(new THREE.SphereGeometry(2000,16,16),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false}));
scene.add(sky);
// moon — soft photoreal disc with a wide atmospheric corona (cheap stand-in for a moonlight "shaft")
const moonTex=tex((g,w,h)=>{
  const gr=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  gr.addColorStop(0,'rgba(240,244,255,1)');
  gr.addColorStop(0.32,'rgba(220,228,255,.97)');
  gr.addColorStop(0.6,'rgba(195,205,255,.55)');
  gr.addColorStop(0.82,'rgba(180,190,240,.14)');
  gr.addColorStop(1,'rgba(180,190,240,0)');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.fillStyle='rgba(160,170,210,.22)';
  for(let i=0;i<6;i++){g.beginPath();g.arc(w*0.28+Math.random()*w*0.4,h*0.28+Math.random()*h*0.4,4+Math.random()*7,0,7);g.fill();}
},128,128);
const moonHaloTex=tex((g,w,h)=>{
  const gr=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);

function radioSquelch(open){

    const g=AC.createGain();g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(bp);bp.connect(g);g.connect(AC.destination);s.start(t);

    if(open){click.frequency.setValueAtTime(900,t);click.frequency.exponentialRampToValueAtTime(1700,t+0.05);}

    const cg=AC.createGain();cg.gain.setValueAtTime(0.03,t);cg.gain.exponentialRampToValueAtTime(0.001,t+0.06);

    const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.026,t+0.06);

// Speaks a COMMAND: line over Web Speech, wrapped in a full radio FX chain: mic-key -> open squelch ->
// low static bed under the voice -> close squelch -> mic-key, with the rotor bed ducked underneath.
// Gated behind the same user-gesture audio unlock as the rest of the sfx (requires AC to exist);
// throttled so lines never overlap. If speechSynthesis is unavailable/blocked, the FX chain still
// plays (with the on-screen subtitle) so it reads as a transmission even with no voice.
window.VOICE_ON=false; // spoken radio voice muted by default (toggle to re-enable the TTS later)
function speakRadio(text){
  if(!AC)return; // no gesture-unlocked audio yet — stay silent, consistent with the rest of the sfx gating
  if(radioSpeaking)return; // throttle: don't stack/overlap command lines
  try{
    radioSpeaking=true;
    duckRotor(true);
    radioMicKey();
    radioSquelch(true);
    startRadioHiss();
    const clean=String(text).replace(/^COMMAND:\s*/i,'');
    const finish=()=>{
      if(!radioSpeaking)return; // already wrapped up (avoid double-firing the close FX)
      radioSpeaking=false;
      stopRadioHiss();
      radioSquelch(false);
      radioMicKey();
      duckRotor(false);
    };
    // VOICE_ON gates the spoken TTS. Muted by default (the synth voice reads as annoying); the
    // squelch + hiss FX and the on-screen subtitle still play, so transmissions stay in-world.
    const hasSpeech=window.VOICE_ON&&typeof window.speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
    if(!hasSpeech){
      // fail-safe: no TTS available — the squelch+hiss FX plus the on-screen subtitle still sell it
      setTimeout(finish,900+Math.min(1800,clean.length*45));
      return;
    }
    setTimeout(()=>{
      try{
        const u=new SpeechSynthesisUtterance(clean);
        u.rate=0.92;u.pitch=0.7;u.volume=0.85; // lowered rate/pitch = gruff, rougher radio-operator tone
        try{
          const voices=window.speechSynthesis.getVoices();
          const v=(voices||[]).find(x=>/en/i.test(x.lang)&&/male/i.test(x.name))
                ||(voices||[]).find(x=>/en/i.test(x.lang)&&/(david|fred|daniel|alex|google uk english male|man)/i.test(x.name))
                ||(voices||[]).find(x=>/en/i.test(x.lang));
          if(v)u.voice=v;
        }catch(e){}
        u.onend=finish;u.onerror=finish;
        window.speechSynthesis.speak(u);
        // belt-and-suspenders: if the browser never fires onend/onerror, don't stay throttled/ducked forever
        setTimeout(()=>{if(radioSpeaking)finish();},9000);
      }catch(e){finish();}
    },160); // let the mic-key + open squelch clear before the voice starts
  }catch(e){radioSpeaking=false;stopRadioHiss();duckRotor(false);}
}

// across aggregate grain, crack grooves, tar-seam ridges and tire ruts so the pavement has real
// micro-relief instead of being a painted-flat decal. Runs once per unique surface at load.

  const dst=og.createImageData(w,h),d=dst.data;

// asphalt textures per road class
// ---- shared realistic-asphalt detail painter -----------------------------------------------
// Multi-scale grain + oil stains + tar/repair patches + faint hairline cracks, applied on top of
// a flat base fill. Used by every road-surface texture generator below so real pavement reads as
// GRAINY WORN ASPHALT (fine grain, stains, patches, cracks, subtle colour variance) rather than a
// flat tinted rectangle. Each call is independently randomised (no shared/cloned canvas), and each
// generator is now a FACTORY FUNCTION invoked fresh per road, so no two roads — even the same
// class/width — ever bake the identical pattern. That, plus a much larger world-length represented
// per tile (see roadTexFor), is what kills the old unnatural regular repeating stripe/banding.
function paintAsphaltGrain(g,w,h){
  // broad worn zones: uneven light/dark resurfacing blotches, HIGHER contrast so the road reads as
  // patched and weathered rather than an even grey sheet.
  for(let i=0;i<8;i++){
    const sx=Math.random()*w,sy=Math.random()*h,sr=w*(0.18+Math.random()*0.5);
    const dark=Math.random()<0.5;
    const gr=g.createRadialGradient(sx,sy,0,sx,sy,sr);
    gr.addColorStop(0,dark?'rgba(0,0,0,.2)':'rgba(210,205,200,.11)');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.fillRect(sx-sr,sy-sr,sr*2,sr*2);
  }
  // VISIBLE AGGREGATE: this is the "grainy" cue — thousands of tiny stones, some catching light
  // (pale quartz/granite chips), most dark, at two-three scales so it reads as a stone-in-bitumen
  // surface, not smooth. Counts scale with area but capped for load cost.
  const area=w*h,cap=(f,mx)=>Math.min(mx,Math.round(area*f));
  // grain is now SUBTLE and mostly dark (fine tonal texture, not bright sparkle) — the bright-stone
  // speckle read as "static" from altitude, so it's cut way down.
  const nMid=cap(0.03,4800),nDark=cap(0.025,3600),nFine=cap(0.05,7000),nPale=cap(0.005,700);
  for(let i=0;i<nFine;i++){const v=Math.random()*60;g.fillStyle=`rgba(${v},${v},${v},${0.05+Math.random()*0.12})`;g.fillRect(Math.random()*w,Math.random()*h,1,1);}
  for(let i=0;i<nDark;i++){g.fillStyle=`rgba(0,0,0,${0.12+Math.random()*0.3})`;g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*1.6,1+Math.random()*1.6);}
  for(let i=0;i<nMid;i++){const v=52+Math.random()*44;g.fillStyle=`rgba(${v},${v-4},${v-8},${0.08+Math.random()*0.16})`;g.fillRect(Math.random()*w,Math.random()*h,1.4,1.4);}
  for(let i=0;i<nPale;i++){const v=120+Math.random()*70;g.fillStyle=`rgba(${v},${v-4},${v-10},${0.08+Math.random()*0.14})`;const s=1+Math.random()*1.4;g.fillRect(Math.random()*w,Math.random()*h,s,s);}
  // oil stains: darker, glossier organic blobs
  for(let i=0;i<3+Math.floor(Math.random()*3);i++){
    const cx0=Math.random()*w,cy0=Math.random()*h,baseR=w*(0.03+Math.random()*0.06);
    for(let k=0;k<3;k++){
      const ox=cx0+(Math.random()-.5)*baseR*0.9,oy=cy0+(Math.random()-.5)*baseR*0.9,r=baseR*(0.55+Math.random()*0.6);
      const gr=g.createRadialGradient(ox,oy,0,ox,oy,r);

    }
  }
  // tar/repair patches: hand-cut resurfacing rectangles, darker + edged
  for(let i=0;i<(Math.random()<0.8?1+Math.floor(Math.random()*2):0);i++){
    const px=Math.random()*w*0.82,py=Math.random()*h,pw=w*(0.06+Math.random()*0.12),ph=pw*(0.5+Math.random()*0.8);
    g.fillStyle='rgba(20,20,20,.5)';
    for(let k=0;k<5;k++){const jx=px+(Math.random()-.5)*pw*0.3,jy=py+(Math.random()-.5)*ph*0.3;g.fillRect(jx,jy,pw*(0.7+Math.random()*0.3),ph*(0.7+Math.random()*0.3));}
    g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=1.5;g.strokeRect(px,py,pw,ph);
  }
  // TAR-SEALANT CRACK SEAMS: the signature worn-street mark — glossy black bitumen poured over old
  // cracks, snaking across the lane, slightly raised and shiny (thicker than a hairline).
  for(let i=0;i<2+Math.floor(Math.random()*3);i++){
    let x=Math.random()*w,y=Math.random()*h;const horiz=Math.random()<0.4;
    g.strokeStyle=`rgba(6,6,8,${0.5+Math.random()*0.35})`;g.lineWidth=1.6+Math.random()*2.2;g.lineCap='round';

    g.stroke();
    g.strokeStyle='rgba(70,70,74,.14)';g.lineWidth=1;g.stroke(); // faint sheen highlight on the tar
  }
  // fine hairline cracks branching off
  for(let i=0;i<2+Math.floor(Math.random()*2);i++){
    let x=Math.random()*w,y=Math.random()*h*0.2;
    g.strokeStyle=`rgba(0,0,0,${0.16+Math.random()*0.16})`;g.lineWidth=1;g.beginPath();g.moveTo(x,y);
    const segs=6+Math.floor(Math.random()*6);
    for(let s=0;s<segs;s++){x+=(Math.random()-.5)*w*0.1;y+=h/segs*(0.7+Math.random()*0.6);g.lineTo(x,y);if(Math.random()<0.25){g.moveTo(x,y);g.lineTo(x+(Math.random()-.5)*w*0.12,y+(Math.random()-.3)*h*0.05);g.moveTo(x,y);}}
    g.stroke();

// REAL TOKYO SIDEWALK: cast concrete paver SLABS with per-slab tone variation, deep grimy joints,
// cracks that cross slabs, moss/dirt collecting in the seams, dark gum spots, damp water staining,
// and a continuous YELLOW TACTILE-PAVING (tenji) strip near the kerb — the signature Japanese
// street cue. Rendered at higher res + as a proper lit material (roughness map for damp patches)
// so it reads as gritty walked-on pavement, not a flat glowing tan rectangle.
function drawSidewalk(g,w,h){

    // solid fills are skipped so the real grain shows — only joints/bevels/stains sit on top.
    g.drawImage(window.SIDE_IMG,0,0,window.SIDE_IMG.width,window.SIDE_IMG.height,0,0,w,h);
    g.fillStyle='rgba(10,10,13,0.5)';g.fillRect(0,0,w,h);

}

      chars.forEach((c,i)=>{g.fillText(c,20+step*(i+.5),h/2);g.fillText(c,20+step*(i+.5),h/2);});
    }else{

function heightToNormal(heightCanvas,strength){
  const w=heightCanvas.width,h=heightCanvas.height;
  const hctx=heightCanvas.getContext('2d');
  const hdata=hctx.getImageData(0,0,w,h).data;
  const ncv=document.createElement('canvas');ncv.width=w;ncv.height=h;
  const nctx=ncv.getContext('2d');
  const nimg=nctx.createImageData(w,h);
  function hAt(x,y){x=Math.max(0,Math.min(w-1,x));y=Math.max(0,Math.min(h-1,y));return hdata[(y*w+x)*4]/255;}
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const l=hAt(x-1,y),r=hAt(x+1,y),u=hAt(x,y-1),d=hAt(x,y+1);
    let nx=(l-r)*strength,ny=(u-d)*strength,nz=1;
    const len=Math.sqrt(nx*nx+ny*ny+nz*nz);
    nx/=len;ny/=len;nz/=len;
    const idx=(y*w+x)*4;
    nimg.data[idx]=(nx*0.5+0.5)*255;
    nimg.data[idx+1]=(ny*0.5+0.5)*255;
    nimg.data[idx+2]=(nz*0.5+0.5)*255;
    nimg.data[idx+3]=255;
  }
  nctx.putImageData(nimg,0,0);
  const t=new THREE.CanvasTexture(ncv);
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return t;
}

function drawRoofSeams(g,w,h,albedo){
  const strip=h/8;
  for(let s=1;s<8;s++){const y=s*strip;
    if(albedo){g.fillStyle='rgba(0,0,0,.34)';g.fillRect(0,y-1.5,w,3);g.fillStyle='rgba(150,140,160,.10)';g.fillRect(0,y+1.5,w,1.5);}
    else{g.fillStyle='#c8c8c8';g.fillRect(0,y-1.5,w,3);}
  }
}

  for(let i=0;i<9;i++){const cx=Math.random()*w,cy=Math.random()*h,rr=16+Math.random()*44;

    gr.addColorStop(0,'rgba(64,60,78,.20)');gr.addColorStop(.75,'rgba(36,32,46,.10)');gr.addColorStop(1,'rgba(8,6,12,0)');
    g.fillStyle=gr;g.beginPath();g.arc(cx,cy,rr,0,7);g.fill();}
  for(let i=0;i<7;i++){g.strokeStyle=`rgba(${96+Math.random()*40},${52+Math.random()*18},28,.16)`;g.lineWidth=2+Math.random()*3;
    const x=Math.random()*w,y=Math.random()*h;g.beginPath();g.moveTo(x,y);g.lineTo(x+(Math.random()-.5)*24,y+24+Math.random()*46);g.stroke();}

// dark backing frame + glow are uniform (only size/position/rotation vary), so they're collected here

const billboardFrameMat=new THREE.MeshBasicMaterial({color:0x0b0910});

const billboardFrameXf=[],billboardGlowXf=[];
function mountBillboard(grp,bw,bd,bh,cx,cz,forcedSide){
  const roll=Math.random();
  let t,w2,h2;
  if(roll<0.24){t=idolPosterTex();w2=bw*0.62;h2=bw*1.15;}
  else if(roll<0.4){t=vintagePosterTex();w2=bw*0.46;h2=bw*1.2;}
  else if(roll<0.58){t=foodAdTex();w2=bw*0.48;h2=bw*1.2;}
  else if(roll<0.76){t=noirPosterTex();w2=bw*0.46;h2=bw*1.2;}
  else{t=adTex();w2=bw*0.95;h2=bw*0.48;}
  const bb=new THREE.Mesh(new THREE.PlaneGeometry(w2,h2),new THREE.MeshBasicMaterial({map:t}));
  const side=forcedSide!==undefined?forcedSide:Math.floor(Math.random()*4);
  const off=[[0,bd/2+0.3,0],[0,-bd/2-0.3,Math.PI],[bw/2+0.3,0,Math.PI/2],[-bw/2-0.3,0,-Math.PI/2]][side];
  const py=bh*0.52+Math.random()*bh*0.3;
  bb.position.set(side<2?0:off[0],py,side<2?off[1]:0);
  bb.rotation.y=off[2];
  grp.add(bb);
  const wx=cx+bb.position.x,wz=cz+bb.position.z;
  billboardFrameXf.push({x:wx-Math.sin(off[2])*0.07,y:py,z:wz-Math.cos(off[2])*0.07,w:w2*1.16,h:h2*1.12,yaw:off[2]});
  billboardGlowXf.push({x:wx,y:py,z:wz,w:w2*1.1,h:h2*1.1,yaw:off[2]});
  return side;
}
function addBillboard(grp,bw,bd,bh,cx,cz){
  if(Math.random()<0.95){
    const usedSide=mountBillboard(grp,bw,bd,bh,cx,cz);
    if(Math.random()<0.25){
      let s2=Math.floor(Math.random()*4);
      if(s2===usedSide)s2=(s2+1)%4;
      mountBillboard(grp,bw,bd,bh,cx,cz,s2);
    }
  }
}

// residential facade: balconies, sliding doors, laundry-rail hatching
function resTex(base){return tex((g,w,h)=>{
  g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<1500;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*0.09})`;g.fillRect(Math.random()*w,Math.random()*h,3,3);}
  const rows=9,ch=h/rows;
  // ROUND-4: per-floor lit-ratio tiers (some floors read almost fully dark, others nearly all lit)
  // instead of a flat 30% chance on every unit of every floor — more fully-dark vs blazing floors
  const tiers=[0,0.08,0.28,0.5,0.82];
  const floorLit=[];for(let y=0;y<rows;y++)floorLit.push(tiers[Math.floor(Math.random()*tiers.length)]);
  for(let y=0;y<rows;y++){
    g.fillStyle='rgba(255,255,255,.10)';g.fillRect(0,y*ch,w,3);
    g.fillStyle='rgba(0,0,0,.42)';g.fillRect(0,y*ch+3,w,5);
    g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1;
    for(let x=0;x<w;x+=7){g.beginPath();g.moveTo(x,y*ch+ch*0.55);g.lineTo(x,y*ch+ch*0.95);g.stroke();}
    g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,y*ch+ch*0.55,w,2);
    const units=5,cw=w/units;
    for(let x=0;x<units;x++){
      const lit=Math.random()<floorLit[y];
      const px=x*cw+cw*0.14,py=y*ch+ch*0.16,ww=cw*0.72,wh=ch*0.42;
      g.fillStyle='rgba(0,0,0,.5)';g.fillRect(px-2,py-2,ww+4,wh+4);
      const grd=g.createLinearGradient(px,py,px,py+wh);
      // warm/cool/green mix, not every lit unit the same tungsten tone
      if(lit){
        const r=Math.random();
        if(r<0.56){grd.addColorStop(0,'#ffe2b0');grd.addColorStop(1,'#d8995c');}
        else if(r<0.84){grd.addColorStop(0,'#dcecff');grd.addColorStop(1,'#9fb8d8');}
        else{grd.addColorStop(0,'#dcffe0');grd.addColorStop(1,'#96c89e');} // kitchen fluorescent green
      }
      else{grd.addColorStop(0,'#2a2438');grd.addColorStop(1,'#171224');}
      g.fillStyle=grd;g.fillRect(px,py,ww,wh);
      g.fillStyle='rgba(0,0,0,.4)';g.fillRect(px+ww/2-1,py,2,wh);
      if(lit&&Math.random()<0.5){g.fillStyle='rgba(30,20,30,.45)';g.fillRect(px+ww*0.55,py,ww*0.4,wh);}
      if(lit&&Math.random()<0.36){
        // hint of an interior: furniture/person silhouette or a TV glow, so balcony units read
        // lived-in — ROUND-4: chance raised (was 0.28) + TV-glow option added
        const kind=Math.random();
        g.fillStyle='rgba(15,12,18,.55)';
        if(kind<0.42){
          const sx=px+ww*(0.3+Math.random()*0.4),sy=py+wh*0.96,sh=wh*0.62,sw2=Math.max(1.2,sh*0.34);
          g.beginPath();g.arc(sx,sy-sh*0.84,sw2*0.4,0,7);g.fill();
          g.beginPath();g.moveTo(sx-sw2*0.48,sy);g.lineTo(sx-sw2*0.32,sy-sh*0.65);g.lineTo(sx+sw2*0.32,sy-sh*0.65);g.lineTo(sx+sw2*0.48,sy);g.closePath();g.fill();
        }else if(kind<0.78){
          g.fillRect(px+ww*0.12,py+wh*0.6,ww*0.55,Math.max(1,wh*0.3));
        }else{
          g.fillStyle='rgba(140,200,255,.32)';
          g.fillRect(px+ww*0.22,py+wh*0.26,ww*0.5,wh*0.26);
        }
      }
    }
  }
  const gr=g.createLinearGradient(0,h,0,h*0.75);
  gr.addColorStop(0,'rgba(6,4,12,.55)');gr.addColorStop(1,'rgba(6,4,12,0)');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
},512,512,true);}

// districts
const TOWER={x:-450,z:440};
function districtOf(cx,cz){
  if(Math.hypot(cx-TOWER.x,cz-TOWER.z)<85)return 'park';
  if(cx<-280&&cz<-140)return 'cbd';
  if(Math.hypot(cx+32,cz-64)<200)return 'neon';
  if(Math.random()<0.05)return 'park';
  if(cx>150&&cz<-40)return 'res';
  if(cz>300&&cx<-40)return 'res';
  return 'mixed';
}
const treeSpots=[];
function makePark(x0,x1,z0,z1){
  const w=x1-x0,d=z1-z0,cx=(x0+x1)/2,cz=(z0+z1)/2;
  const lawn=new THREE.Mesh(new THREE.PlaneGeometry(w,d),grassMat);
  lawn.rotation.x=-Math.PI/2;lawn.position.set(cx,0.028,cz);lawn.receiveShadow=true;scene.add(lawn);
  const p1=new THREE.Mesh(new THREE.PlaneGeometry(2.6,d),pathMat);
  p1.rotation.x=-Math.PI/2;p1.position.set(cx+(Math.random()-.5)*w*0.3,0.032,cz);scene.add(p1);
  const p2=new THREE.Mesh(new THREE.PlaneGeometry(w,2.6),pathMat);
  p2.rotation.x=-Math.PI/2;p2.position.set(cx,0.032,cz+(Math.random()-.5)*d*0.3);scene.add(p2);
  const n=Math.min(14,Math.floor(w*d/260));
  for(let k=0;k<n;k++)treeSpots.push([x0+2+Math.random()*(w-4),z0+2+Math.random()*(d-4)]);
}
const railBlocked=(za,zb)=>za<RAIL_Z+8&&zb>RAIL_Z-8;
for(let i=0;i<ROADS_X.length-1;i++)for(let j2=0;j2<ROADS_Z.length-1;j2++){
  const ra=ROADS_X[i],rb=ROADS_X[i+1],rc=ROADS_Z[j2],rd=ROADS_Z[j2+1];
  const x0=ra.p+ra.w/2+SW+1.2,x1=rb.p-rb.w/2-SW-1.2;
  const z0=rc.p+rc.w/2+SW+1.2,z1=rd.p-rd.w/2-SW-1.2;
  const bwT=x1-x0,bdT=z1-z0;
  if(bwT<12||bdT<12)continue;
  const cx=(x0+x1)/2,cz=(z0+z1)/2;
  if(cx>RIVER.x0-24&&cx<RIVER.x1+24)continue;
  const d=districtOf(cx,cz);
  if(d==='park'&&!railBlocked(z0,z1)){makePark(x0,x1,z0,z1);continue;}
  if(d==='cbd'&&!railBlocked(z0,z1)){
    const bw=Math.min(bwT-6,26+Math.random()*10),bd2=Math.min(bdT-6,26+Math.random()*10);
    spawnBuilding(cx,cz,bw,bd2,'glass');
    continue;
  }
  const cell=d==='res'?15:24;
  const nx=Math.max(1,Math.min(4,Math.round(bwT/cell)));
  const nz=Math.max(1,Math.min(4,Math.round(bdT/cell)));
  const lw=bwT/nx,ld=bdT/nz;
  for(let a=0;a<nx;a++)for(let b=0;b<nz;b++){
    if(Math.random()<(d==='res'?0.12:0.18))continue;
    const lcx=x0+lw*(a+0.5),lcz=z0+ld*(b+0.5);
    if(railBlocked(lcz-ld/2,lcz+ld/2))continue;
    const bw=lw-2.5-Math.random()*2,bd2=ld-2.5-Math.random()*2;
    if(bw<6||bd2<6)continue;
    let style=d;
    if(d==='mixed')style=Math.random()<0.08?'glass':(Math.random()<0.5?'neon':'mixed');
    spawnBuilding(lcx,lcz,bw,bd2,style==='cbd'?'mixed':style);
  }
}

// ---------- OUTER SKYLINE IMPOSTORS: cheap LOD blocks beyond the playable street grid, so the
// city dissolves into haze/distance instead of stopping at a visible hard edge. Single InstancedMesh
// (1 draw call) of unlit boxes with a baked lit-window texture — no collision, no gameplay effect
// (never added to `buildings`), positioned in an annulus between the real block field (~560) and
// the far skyline silhouette ring (1400), safely inside the ground plane (CITY=1150).
(function buildOuterSkylineImpostors(){
  const innerR=580,outerR=1060,count=340;
  const impostorTexA=tex((g,w,h)=>{
    g.fillStyle='#241d34';g.fillRect(0,0,w,h);
    for(let y=6;y<h;y+=9){for(let x=4;x<w;x+=7){
      if(Math.random()<0.4){
        g.fillStyle=Math.random()<0.6?'rgba(255,205,150,.55)':(Math.random()<0.6?'rgba(160,210,255,.5)':'rgba(255,150,220,.45)');
        g.fillRect(x,y,2,2.4);
      }
    }}
  },48,128,true);
  const impostorTexB=tex((g,w,h)=>{
    g.fillStyle='#1e1a2c';g.fillRect(0,0,w,h);
    for(let y=6;y<h;y+=8){for(let x=4;x<w;x+=6){
      if(Math.random()<0.3){
        g.fillStyle=Math.random()<0.5?'rgba(255,190,130,.5)':'rgba(150,220,255,.45)';
        g.fillRect(x,y,1.6,2);
      }
    }}
  },48,128,true);
  const geo=new THREE.BoxGeometry(1,1,1);
  const matA=new THREE.MeshBasicMaterial({map:impostorTexA});
  const matB=new THREE.MeshBasicMaterial({map:impostorTexB});
  const mA=new THREE.InstancedMesh(geo,matA,Math.ceil(count/2));
  const mB=new THREE.InstancedMesh(geo,matB,Math.floor(count/2));
  mA.frustumCulled=false;mB.frustumCulled=false;
  const dummy=new THREE.Object3D();
  let ia=0,ib=0,tries=0;
  while(ia+ib<count&&tries<count*4){
    tries++;
    const ang=Math.random()*Math.PI*2;
    const rad=innerR+Math.random()*(outerR-innerR);
    const x=Math.cos(ang)*rad,z=Math.sin(ang)*rad;
    if(x>RIVER.x0-30&&x<RIVER.x1+30)continue; // keep the river channel clear
    const h=18+Math.random()*150,w=12+Math.random()*22,d=12+Math.random()*22;
    dummy.position.set(x,h/2,z);dummy.rotation.y=Math.random()*Math.PI;dummy.scale.set(w,h,d);dummy.updateMatrix();
    if(Math.random()<0.5&&ia<mA.count){mA.setMatrixAt(ia++,dummy.matrix);}
    else if(ib<mB.count){mB.setMatrixAt(ib++,dummy.matrix);}
    else if(ia<mA.count){mA.setMatrixAt(ia++,dummy.matrix);}
  }
  mA.count=ia;mB.count=ib;
  mA.instanceMatrix.needsUpdate=true;mB.instanceMatrix.needsUpdate=true;
  scene.add(mA,mB);
  // a little extra light-pollution haze right at the transition band so blocks fade rather than cut off
  for(let i=0;i<14;i++){
    const ang=Math.random()*Math.PI*2,rad=520+Math.random()*420;
    const ht=hazeTexVariants[Math.floor(Math.random()*hazeTexVariants.length)];
    const m=new THREE.Mesh(new THREE.PlaneGeometry(360+Math.random()*380,130+Math.random()*100),
      new THREE.MeshBasicMaterial({map:ht,transparent:true,opacity:.14+Math.random()*.12,depthWrite:false}));
    m.position.set(Math.cos(ang)*rad,14+Math.random()*54,Math.sin(ang)*rad);
    scene.add(m);groundHaze.push(m);
  }
})();

// additive glow sprites, these actually illuminate the textured road/sidewalk — so you get genuine

function switchPanelTex(title,labels,accent){
  return tex((g,w,h)=>{
    g.fillStyle='#15171b';g.fillRect(0,0,w,h);
    const vg=g.createLinearGradient(0,0,0,h);
    vg.addColorStop(0,'rgba(255,255,255,.06)');vg.addColorStop(1,'rgba(0,0,0,.3)');
    g.fillStyle=vg;g.fillRect(0,0,w,h);
    g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=3;g.strokeRect(2,2,w-4,h-4);
    g.fillStyle=accent;g.font='bold 9px monospace';g.textAlign='center';g.globalAlpha=.9;
    g.fillText(title,w/2,14);g.globalAlpha=1;
    const cols=3,rows=2,mx=16,my=26,cw=(w-mx*2)/cols,ch=(h-my-16)/rows;
    let li=0;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const cx=mx+cw*c+cw/2,cy=my+ch*r+ch/2;
      const guarded=(r===0&&c===cols-1);
      g.fillStyle='#0c0d10';g.fillRect(cx-11,cy-9,22,20);
      g.strokeStyle='#3a3f46';g.lineWidth=1;g.strokeRect(cx-11,cy-9,22,20);
      if(guarded){
        g.strokeStyle='#cc3344';g.lineWidth=1.4;
        g.beginPath();g.moveTo(cx-10,cy-2);g.lineTo(cx-8,cy-13);g.lineTo(cx+8,cy-13);g.lineTo(cx+10,cy-2);g.stroke();
      }
      const on=((li*37+7)%5)<3;
      g.strokeStyle=on?accent:'#666';g.lineWidth=2.4;
      g.beginPath();g.moveTo(cx,cy+7);g.lineTo(cx+(on?4:-4),cy-6);g.stroke();
      g.fillStyle=on?accent:'#555';g.beginPath();g.arc(cx+(on?4:-4),cy-6,1.6,0,7);g.fill();
      g.fillStyle='rgba(190,230,220,.85)';g.font='6px monospace';g.textAlign='center';
      g.fillText(labels[li]||'',cx,cy+15);
      li++;
    }
    const ky=h-14;
    [w*0.28,w*0.72].forEach((kx,i)=>{
      g.strokeStyle='#4a4f56';g.lineWidth=1.4;g.beginPath();g.arc(kx,ky,8,0,7);g.stroke();
      g.fillStyle='#22262b';g.beginPath();g.arc(kx,ky,8,0,7);g.fill();g.stroke();
      const ang=-0.6+i*1.1;
      g.strokeStyle=accent;g.lineWidth=1.6;g.beginPath();g.moveTo(kx,ky);g.lineTo(kx+Math.cos(ang)*7,ky+Math.sin(ang)*7);g.stroke();
    });
  },180,150);
}

// ---- canopy / windscreen frame: segmented "greenhouse" mullions + tinted glass ----
function bar3(p1,p2,width,mat){
  const dir=new THREE.Vector3().subVectors(p2,p1);
  const len=dir.length();
  if(len<1e-4)return;
  const mid=new THREE.Vector3().addVectors(p1,p2).multiplyScalar(0.5);
  const m=new THREE.Mesh(new THREE.BoxGeometry(width,width,len),mat);
  m.position.copy(mid);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),dir.clone().normalize());
  cockpitGroup.add(m);
}
function quadGeo(a,b,c,d){
  const geo=new THREE.BufferGeometry();
  const v=new Float32Array([
    a.x,a.y,a.z, b.x,b.y,b.z, c.x,c.y,c.z,
    a.x,a.y,a.z, c.x,c.y,c.z, d.x,d.y,d.z
  ]);
  geo.setAttribute('position',new THREE.BufferAttribute(v,3));
  geo.computeVertexNormals();
  return geo;
}
const canopyGlassMat=new THREE.MeshBasicMaterial({color:0x16233a,transparent:true,opacity:.26,side:THREE.DoubleSide,depthWrite:false});
const NCOL=7,canopyCols=[];
for(let i=0;i<NCOL;i++){
  const t=i/(NCOL-1);
  const x=-1.7+3.4*t;
  const s=Math.cos((t-0.5)*Math.PI);
  canopyCols.push({
    top:new THREE.Vector3(x,0.48+0.09*s,-1.55-0.55*s),
    bot:new THREE.Vector3(x,-0.03+0.05*s,-1.28-0.25*s)
  });
}
canopyCols.forEach((col,i)=>{
  bar3(col.bot,col.top,i===Math.floor(NCOL/2)?0.05:0.03,strutMat);
  if(i>0){
    const prev=canopyCols[i-1];
    bar3(prev.top,col.top,0.03,strutMat);
    bar3(prev.bot,col.bot,0.024,strutMat);
    cockpitGroup.add(new THREE.Mesh(quadGeo(prev.top,col.top,col.bot,prev.bot),canopyGlassMat));
  }
});

  stick.active=true;stick.id=e.pointerId;sOrigin={x:e.clientX,y:e.clientY};
  sbase.style.display=sknob.style.display='block';
  sbase.style.left=(e.clientX-55)+'px';sbase.style.top=(e.clientY-55)+'px';
  sknob.style.left=(e.clientX-24)+'px';sknob.style.top=(e.clientY-24)+'px';
  zone.setPointerCapture(e.pointerId);
});
zone.addEventListener('pointermove',e=>{
  if(!stick.active||e.pointerId!==stick.id)return;
  let dx=e.clientX-sOrigin.x,dy=e.clientY-sOrigin.y;
  const m=Math.hypot(dx,dy),max=55;
  if(m>max){dx*=max/m;dy*=max/m;}
  stick.dx=dx/max;stick.dy=dy/max;
  sknob.style.left=(sOrigin.x+dx-24)+'px';sknob.style.top=(sOrigin.y+dy-24)+'px';
});
function stickEnd(e){if(e.pointerId!==stick.id)return;stick.active=false;stick.dx=stick.dy=0;sbase.style.display=sknob.style.display='none';}

// Build a survivor figure from the shared humanoid model: natural tint, idle pose,
// several bones procedurally driven on top of the Idle clip for continuous "alive" motion —
// weight-shift sway (hips/spine), breathing bob, occasional look-around (neck/head), a real
// arm+forearm wave for "over here!", and a livelier hop+spin celebration on rescue.
function buildSurvivorFigure(){
  if(!(humanoidModelReady&&humanoidTemplate))return null;
  const model=THREE.SkeletonUtils.clone(humanoidTemplate);
  applyHumanoidMaterialVariant(model,survivorMatVariants);
  const scale=HUMANOID_TARGET_HEIGHT/humanoidNaturalHeight;
  model.scale.setScalar(scale);
  model.rotation.y=HUMANOID_BASE_YAW;
  let mixer=null;
  if(survivorIdleClip){
    mixer=new THREE.AnimationMixer(model);
    mixer.clipAction(survivorIdleClip).setLoop(THREE.LoopRepeat,Infinity).play();
    mixer.update(0); // settle into frame-0 idle pose before we snapshot bone rest quats
  }
  const waveBone=model.getObjectByName('mixamorigRightArm');
  const leftArmBone=model.getObjectByName('mixamorigLeftArm');
  const foreArmBone=model.getObjectByName('mixamorigRightForeArm');
  const spineBone=model.getObjectByName('mixamorigSpine1')||model.getObjectByName('mixamorigSpine');
  const hipsBone=model.getObjectByName('mixamorigHips');
  const neckBone=model.getObjectByName('mixamorigNeck');
  const headBone=model.getObjectByName('mixamorigHead');
  // soft warm rim light riding along with the figure — keeps it reading as a bright civilian
  // even while sitting inside the beacon's green ring glow (beacon/ring/beam left untouched).
  const rim=new THREE.PointLight(0xffcf9e,1.4,9,2);
  rim.position.set(0,1.55,0.7);
  model.add(rim);
  return {
    model,mixer,waveBone,leftArmBone,foreArmBone,spineBone,hipsBone,neckBone,headBone,
    waveBaseQuat:waveBone?waveBone.quaternion.clone():null,
    leftArmBaseQuat:leftArmBone?leftArmBone.quaternion.clone():null,
    foreArmBaseQuat:foreArmBone?foreArmBone.quaternion.clone():null,
    spineBaseQuat:spineBone?spineBone.quaternion.clone():null,
    hipsBaseQuat:hipsBone?hipsBone.quaternion.clone():null,
    neckBaseQuat:neckBone?neckBone.quaternion.clone():null,
    headBaseQuat:headBone?headBone.quaternion.clone():null,
    celebrating:false,celebT:0,
    idleSeed:Math.random()*1000, // desyncs sway/breathing between multiple survivors
    lookNextAt:1200+Math.random()*2200, // ms-timestamp (set relative to first update) of next look-around
    lookElapsed:0,lookAngle:0,lookTarget:0
  };
}
// Procedural "alive" idle: weight-shift sway + breathing bob + occasional look-around.
// Called every frame while the survivor is standing at the beacon, not yet rescued.
function updateSurvivorIdle(sv,dt,tGlobal){
  const t=tGlobal+sv.idleSeed;
  // gentle continuous weight-shift: hips sway side-to-side + slight spine counter-lean
  if(sv.hipsBone&&sv.hipsBaseQuat){
    const sway=Math.sin(t*0.55)*0.05;
    sv.hipsBone.quaternion.copy(sv.hipsBaseQuat).multiply(new THREE.Quaternion().setFromAxisAngle(WAVE_AXIS,sway));
  }
  if(sv.spineBone&&sv.spineBaseQuat){
    const lean=Math.sin(t*0.55+0.5)*0.035;
    const twist=Math.sin(t*0.33)*0.025;
    sv.spineBone.quaternion.copy(sv.spineBaseQuat)
      .multiply(new THREE.Quaternion().setFromAxisAngle(WAVE_AXIS,lean))
      .multiply(new THREE.Quaternion().setFromAxisAngle(YAW_AXIS,twist));
  }
  // breathing bob: small vertical rise/fall of the whole figure
  sv.model.position.y=Math.sin(t*1.7)*0.022;
  // occasional look-around: head+neck ease toward a random yaw, hold, then ease back to center
  sv.lookElapsed+=dt*1000;
  if(sv.lookElapsed>=sv.lookNextAt){
    sv.lookElapsed=0;
    sv.lookNextAt=2600+Math.random()*3200;
    sv.lookTarget=(Math.random()<0.5?-1:1)*(0.35+Math.random()*0.4);
  }
  // ease current look angle toward target while inside the look window, else ease back to 0
  const lookActive=sv.lookElapsed<900;
  const target=lookActive?sv.lookTarget:0;
  sv.lookAngle=THREE.MathUtils.lerp(sv.lookAngle,target,Math.min(1,dt*3.2));
  if(sv.neckBone&&sv.neckBaseQuat)sv.neckBone.quaternion.copy(sv.neckBaseQuat).multiply(new THREE.Quaternion().setFromAxisAngle(YAW_AXIS,sv.lookAngle*0.6));
  if(sv.headBone&&sv.headBaseQuat)sv.headBone.quaternion.copy(sv.headBaseQuat).multiply(new THREE.Quaternion().setFromAxisAngle(YAW_AXIS,sv.lookAngle*0.7));
}
// Livelier rescue celebration: both arms up + waving hands, several energetic hops, a little
// cheering spin/wiggle that settles once the hops finish. Returns true when the celebration
// has fully played out (caller then stops driving / removes the survivor).
function updateSurvivorCelebration(sv,dt){
  sv.celebT+=dt;
  const hopDur=0.3,hops=3,totalDur=hopDur*hops;
  const tt=Math.min(sv.celebT,totalDur);
  sv.model.position.y=Math.max(0,Math.sin((tt/hopDur)*Math.PI))*0.65;
  const spinFade=Math.max(0,1-sv.celebT/(totalDur+0.3));
  sv.model.rotation.y=HUMANOID_BASE_YAW+Math.sin(sv.celebT*7)*0.4*spinFade;
  if(sv.waveBone&&sv.waveBaseQuat)sv.waveBone.quaternion.copy(sv.waveBaseQuat).multiply(CELEBRATE_ARM_OFFSET).multiply(new THREE.Quaternion().setFromAxisAngle(WAVE_AXIS,Math.sin(sv.celebT*14)*0.25));
  if(sv.leftArmBone&&sv.leftArmBaseQuat)sv.leftArmBone.quaternion.copy(sv.leftArmBaseQuat).multiply(CELEBRATE_ARM_OFFSET_L).multiply(new THREE.Quaternion().setFromAxisAngle(WAVE_AXIS,-Math.sin(sv.celebT*14+0.4)*0.25));
  if(sv.foreArmBone&&sv.foreArmBaseQuat)sv.foreArmBone.quaternion.copy(sv.foreArmBaseQuat).multiply(new THREE.Quaternion().setFromAxisAngle(WAVE_AXIS,Math.sin(sv.celebT*16)*0.4));
  if(sv.headBone&&sv.headBaseQuat)sv.headBone.quaternion.copy(sv.headBaseQuat).multiply(new THREE.Quaternion().setFromAxisAngle(PITCH_AXIS,Math.sin(sv.celebT*10)*0.15));
  return sv.celebT>totalDur+0.6;
}

function rescueHostage(){
  if(!hostage)return;
  if(hostage.state==='seek'){
    const rescuedMesh=hostage.m,rescuedSurvivor=hostage.survivor;
    if(rescuedSurvivor){
      // purely visual: happy celebration (jump bounce + arms up), then remove shortly after.
      // does not touch score/timer/spawnPad below, which fire at the same point as before.
      rescuedSurvivor.celebrating=true;rescuedSurvivor.celebT=0;
      celebratingSurvivors.push(rescuedSurvivor); // update independently — spawnPad() below reassigns global `hostage`
      setTimeout(()=>{scene.remove(rescuedMesh);},1500);
    }else{
      scene.remove(rescuedMesh);
    }
    addScore(500);
    flashMsg('HOSTAGE ABOARD — GET TO THE HELIPAD!','#3ef');
    sfx(0.4,0.25,800,1000);
    missionTimer=55;
    spawnPad();
  }else if(hostage.state==='pad'){
    const bonus=Math.round(missionTimer)*15;
    addScore(1000+bonus);

    sfx(0.5,0.3,900,1200);
    scene.remove(hostage.m);

    setTimeout(()=>{if(!gameOver)spawnHostage();},2600);

let zombieMatVariants=null;    // Map<origMaterial, undead-tinted clone>

// Build both tint variants ONCE from the template's original materials (shared across all
// clones — cheap & consistent; clones from SkeletonUtils keep references to these originals).
function buildHumanoidMaterialVariants(root){
  zombieMatVariants=new Map();
  survivorMatVariants=new Map();
  const seen=new Set();
  root.traverse(o=>{
    if(!o.isMesh||!o.material)return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(mat=>{
      if(seen.has(mat))return;
      seen.add(mat);
      const isVisor=/visor/i.test(mat.name||'');
      // zombie: desaturated sickly grey-green, roughened; visor gets a faint red undead glow
      const zMat=mat.clone();
      if(zMat.color)zMat.color.setRGB(0.36,0.56,0.30); // brighter sickly green so it reads in the dark from the air
      if('roughness' in zMat)zMat.roughness=0.9;
      if('metalness' in zMat)zMat.metalness=0.05;
      if(!zMat.emissive)zMat.emissive=new THREE.Color(0,0,0);
      // visor = red undead eyes; body = faint green self-glow so the zombie reads in the dark scene
      zMat.emissive.setRGB(isVisor?0.9:0.12, isVisor?0.04:0.26, isVisor?0.04:0.10);
      zMat.emissiveIntensity=isVisor?1.6:1.0;
      zMat.needsUpdate=true;
      zombieMatVariants.set(mat,zMat);
      // survivor: brightened, warm natural tint — must read as a civilian person, clearly
      // NOT the dark/sickly-green zombie look, even inside the beacon's green ring glow.
      const sMat=mat.clone();
      if(sMat.color)sMat.color.multiply(new THREE.Color(1.32,1.22,1.08));
      if('roughness' in sMat && sMat.roughness!==undefined)sMat.roughness=Math.max(0.35,sMat.roughness*0.8);
      if(!sMat.emissive)sMat.emissive=new THREE.Color(0,0,0);
      sMat.emissive.setRGB(isVisor?0.05:0.16,isVisor?0.05:0.11,isVisor?0.06:0.06); // faint warm self-glow, not the zombie's undead visor red
      sMat.emissiveIntensity=0.55;
      sMat.needsUpdate=true;
      survivorMatVariants.set(mat,sMat);
    });
  });
}
function applyHumanoidMaterialVariant(root,variantMap){
  root.traverse(o=>{
    if(!o.isMesh||!o.material)return;
    if(Array.isArray(o.material))o.material=o.material.map(m=>variantMap.get(m)||m);
    else o.material=variantMap.get(o.material)||o.material;
    o.castShadow=true;
    o.receiveShadow=false;
  });
}

function initHumanoidModel(){
  try{
    if(!window.__ZOMBIE_GLB||!THREE.GLTFLoader||!THREE.SkeletonUtils)return;
    const b64=window.__ZOMBIE_GLB;
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    new THREE.GLTFLoader().parse(bytes.buffer,'',gltf=>{
      humanoidTemplate=gltf.scene;
      humanoidAnimClips=gltf.animations||[];
      zombieWalkClip=humanoidAnimClips.find(c=>/^walk$/i.test(c.name))||humanoidAnimClips.find(c=>/walk/i.test(c.name))||null;
      survivorIdleClip=humanoidAnimClips.find(c=>/idle/i.test(c.name))||null;
      buildHumanoidMaterialVariants(humanoidTemplate);
      const box=new THREE.Box3().setFromObject(humanoidTemplate);
      humanoidNaturalHeight=Math.max(0.001,box.max.y-box.min.y);
      humanoidModelReady=true;
    },err=>{console.warn('humanoid GLB parse failed',err);});
  }catch(e){console.warn('humanoid model init failed',e);}
}
initHumanoidModel();

  });

  zombies.forEach(z=>{

  });
  // objective
  if(hostage){

    tacC.strokeStyle=col;tacC.fillStyle=col;tacC.lineWidth=1.5;
    tacC.beginPath();tacC.arc(cl,cd,pulse,0,7);tacC.stroke();
    tacC.beginPath();tacC.arc(cl,cd,1.6,0,7);tacC.fill();
  }
  tacC.restore();
  // heli icon (always up)
  tacC.save();tacC.translate(TAC/2,TAC/2);
  tacC.fillStyle='#eaffea';tacC.beginPath();tacC.moveTo(0,-7);tacC.lineTo(5,6);tacC.lineTo(0,3);tacC.lineTo(-5,6);tacC.closePath();tacC.fill();
  tacC.restore();
  // range rings + N marker
  tacC.strokeStyle=HUD_DIM;tacC.lineWidth=1;
  tacC.beginPath();tacC.arc(TAC/2,TAC/2,TAC*0.5-4,0,7);tacC.stroke();
  tacC.beginPath();tacC.arc(TAC/2,TAC/2,TAC*0.28,0,7);tacC.stroke();
  tacC.save();tacC.translate(TAC/2,TAC/2);tacC.rotate(yaw);
  tacC.fillStyle=HUD_G;tacC.font='bold 9px monospace';tacC.textAlign='center';tacC.fillText('N',0,-TAC*0.5+11);
  tacC.restore();
  tacC.strokeStyle=HUD_DIM;tacC.strokeRect(1,1,TAC-2,TAC-2);
}

function barGauge(ctx,x,y,w,h,frac,color,label){
  ctx.strokeStyle='#3a3f46';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);
  ctx.fillStyle='#0a0c0e';ctx.fillRect(x,y,w,h);
  const fh=h*THREE.MathUtils.clamp(frac,0,1);
  ctx.fillStyle=color;ctx.fillRect(x,y+h-fh,w,fh);
  ctx.fillStyle='#8fffde';ctx.font='7px monospace';ctx.textAlign='center';
  ctx.fillText(label,x+w/2,y+h+9);
}

// --- vertical measuring tape (airspeed / altitude) ---
function tape(cx,cy,h,val,step,unit,side,warnLow){
  const x=hudX;
  x.save();x.beginPath();x.rect(cx-30,cy-h/2,60,h);x.clip();
  x.strokeStyle=HUD_DIM;x.fillStyle=HUD_G;x.font='10px monospace';
  x.textAlign=side==='L'?'right':'left';
  const pxPer=h/(step*5); // show ~5 steps across the tape
  const base=Math.round(val/step)*step;
  for(let k=-4;k<=4;k++){
    const tv=base+k*step;if(tv<0)continue;
    const y=cy+(val-tv)*pxPer;
    const major=tv%(step*5)===0;
    x.strokeStyle=major?HUD_DIM:HUD_FAINT;x.lineWidth=1;
    x.beginPath();
    if(side==='L'){x.moveTo(cx+30,y);x.lineTo(cx+30-(major?14:8),y);}
    else{x.moveTo(cx-30,y);x.lineTo(cx-30+(major?14:8),y);}
    x.stroke();
    if(major){x.fillStyle=HUD_DIM;x.fillText(tv,side==='L'?cx+12:cx-12,y+3.5);}
  }
  x.restore();
  // current-value box + caret
  x.strokeStyle=HUD_G;x.lineWidth=1.4;
  const bw=46,bh=17,by=cy-bh/2;
  const bx=side==='L'?cx-30:cx-16;
  x.fillStyle='rgba(3,14,7,.82)';x.fillRect(bx,by,bw,bh);
  x.strokeRect(bx,by,bw,bh);
  const caret=side==='L'?bx+bw:bx;
  x.beginPath();x.moveTo(caret,cy);x.lineTo(caret+(side==='L'?7:-7),cy-5);x.lineTo(caret+(side==='L'?7:-7),cy+5);x.closePath();
  x.fillStyle='rgba(3,14,7,.82)';x.fill();x.stroke();
  x.fillStyle=(warnLow&&val<warnLow)?HUD_AMBER:'#eaffea';x.font='bold 13px monospace';x.textAlign='center';
  x.fillText(String(Math.round(val)).padStart(3,'0'),bx+bw/2,cy+4.5);
  x.fillStyle=HUD_DIM;x.font='8px monospace';x.textAlign='center';x.fillText(unit,cx,cy-h/2-5);
}

// --- heading tape (top) ---
function headingTape(cx,y,w,hdg){
  const x=hudX;
  x.save();x.beginPath();x.rect(cx-w/2,y-2,w,28);x.clip();
  const pxPer=w/90; // ±45° visible
  x.font='10px monospace';x.textAlign='center';
  for(let d=-60;d<=60;d+=5){
    const hv=((Math.round(hdg/5)*5+d)%360+360)%360;
    const sx=cx+(d-(hdg-Math.round(hdg/5)*5))*pxPer;
    const major=hv%15===0;
    x.strokeStyle=major?HUD_DIM:HUD_FAINT;x.lineWidth=1;
    x.beginPath();x.moveTo(sx,y+16);x.lineTo(sx,y+16-(major?9:5));x.stroke();
    if(major){
      const lbl=hv===0?'N':hv===90?'E':hv===180?'S':hv===270?'W':String(hv/10|0).padStart(2,'0');
      x.fillStyle=HUD_DIM;x.fillText(lbl,sx,y+8);
    }
  }
  x.restore();
  // center caret + heading readout
  x.fillStyle=HUD_G;x.beginPath();x.moveTo(cx,y+17);x.lineTo(cx-5,y+24);x.lineTo(cx+5,y+24);x.closePath();x.fill();
  x.strokeStyle=HUD_G;x.lineWidth=1.3;x.fillStyle='rgba(3,14,7,.82)';
  x.fillRect(cx-20,y-16,40,15);x.strokeRect(cx-20,y-16,40,15);
  x.fillStyle='#eaffea';x.font='bold 12px monospace';x.textAlign='center';
  x.fillText(String(Math.round(hdg)).padStart(3,'0'),cx,y-4);
}

let hudFlash=0;
function drawHUD(now){
  const dpr=DPR();hudX.setTransform(dpr,0,0,dpr,0,0);
  const w=W(),h=H();hudX.clearRect(0,0,w,h);
  const cx=w/2,cy=h*0.45;
  const spdK=Math.round(CRUISE*(window.__throttle||1)*3.6);
  const alt=heli.position.y;
  const hdg=((-yaw*180/Math.PI)%360+360)%360;
  const compact=w<620;

  // ---- boresight reticle ----
  hudX.strokeStyle=HUD_G;hudX.lineWidth=1.4;
  hudX.beginPath();hudX.arc(cx,cy,15,0,7);hudX.stroke();
  hudX.beginPath();
  hudX.moveTo(cx-26,cy);hudX.lineTo(cx-15,cy);
  hudX.moveTo(cx+15,cy);hudX.lineTo(cx+26,cy);
  hudX.moveTo(cx,cy-26);hudX.lineTo(cx,cy-15);
  hudX.moveTo(cx,cy+15);hudX.lineTo(cx,cy+22);
  hudX.stroke();
  hudX.fillStyle=HUD_G;hudX.fillRect(cx-1,cy-1,2,2);
  // flight-path / velocity dot from turn+climb
  hudX.strokeStyle=HUD_DIM;hudX.lineWidth=1;
  const fpx=cx+(roll*90),fpy=cy-(pitch*120)+40;
  hudX.beginPath();hudX.arc(fpx,fpy,4,0,7);hudX.stroke();
  hudX.beginPath();hudX.moveTo(fpx-8,fpy);hudX.lineTo(fpx-4,fpy);hudX.moveTo(fpx+4,fpy);hudX.lineTo(fpx+8,fpy);hudX.moveTo(fpx,fpy-4);hudX.lineTo(fpx,fpy-8);hudX.stroke();

  // ---- tapes framing the reticle ----
  const tapeH=Math.min(190,h*0.34);
  tape(cx-118,cy,tapeH,spdK,20,'KPH','L',null);
  tape(cx+118,cy,tapeH,alt,20,'ALT M','R',20);

  // ---- heading tape (top center) ----
  headingTape(cx,30,Math.min(440,w*0.5),hdg);

  // ---- top-left: identity, score, health, combat status ----
  const lx=14;let ly=20;
  hudX.textAlign='left';hudX.fillStyle=HUD_G;hudX.font='bold 13px monospace';
  hudX.fillText((compact?'AH-7 · ':'APACHE-7 · ')+pilotName+(compact?'  W'+wave:''),lx,ly);ly+=17;
  hudX.font='11px monospace';hudX.fillStyle=HUD_DIM;
  hudX.fillText('SCORE',lx,ly);hudX.fillText('KILLS',lx+108,ly);
  hudX.fillStyle='#eaffea';hudX.font='bold 14px monospace';
  hudX.fillText(String(score),lx+46,ly);hudX.fillText(String(kills),lx+154,ly);ly+=16;
  if(mult>1){hudX.fillStyle=HUD_AMBER;hudX.font='bold 11px monospace';hudX.fillText('x'+mult.toFixed(1)+' COMBO ·'+streak,lx,ly);}
  ly+=6;
  // integrity (health) bar
  const bw=compact?150:182,bh=11;
  hudX.strokeStyle=HUD_DIM;hudX.lineWidth=1;hudX.strokeRect(lx,ly,bw,bh);
  const frac=Math.max(0,hp)/100;
  const hcol=hp>60?'#3fe07a':hp>30?'#ffc23a':'#ff4d4d';
  hudX.fillStyle=hcol;hudX.fillRect(lx+1,ly+1,(bw-2)*frac,bh-2);
  for(let g=1;g<5;g++){hudX.strokeStyle=HUD_FAINT;hudX.beginPath();hudX.moveTo(lx+bw*g/5,ly);hudX.lineTo(lx+bw*g/5,ly+bh);hudX.stroke();}
  hudX.fillStyle=HUD_DIM;hudX.font='9px monospace';hudX.fillText('HULL',lx,ly+bh+10);
  hudX.fillStyle=hcol;hudX.textAlign='right';hudX.fillText(Math.max(0,Math.round(hp))+'%',lx+bw,ly+bh+10);
  hudX.textAlign='left';

  // wave + mission line, centered under heading tape (roomy layouts only)
  if(!compact){
    hudX.textAlign='center';
    hudX.fillStyle=HUD_G;hudX.font='bold 15px monospace';
    hudX.fillText('WAVE '+wave,cx,64);
    hudX.fillStyle=HUD_CYAN;hudX.font='11px monospace';
    hudX.fillText(missionLine,cx,80);
  }

  // ---- top-right: weapon rack ----
  const rx=w-14;let ry=20;const rackW=compact?128:150,fs=compact?11:12;
  hudX.textAlign='right';
  const names=compact?['MINIGN','HYDRA','HLFIRE','NAPALM']:['MINIGUN','HYDRA 70','HELLFIRE','NAPALM'];
  for(let k=0;k<4;k++){
    const sel=k===wpn;
    const am=ammo[k]===Infinity?'∞':ammo[k];
    hudX.font=(sel?'bold ':'')+fs+'px monospace';
    hudX.fillStyle=sel?HUD_AMBER:(ammo[k]<=0?'rgba(255,80,80,.5)':HUD_DIM);
    if(sel){hudX.strokeStyle=HUD_AMBER;hudX.lineWidth=1;hudX.strokeRect(rx-rackW,ry-11,rackW,16);}
    hudX.fillText('['+(k+1)+'] '+names[k],rx-26,ry);
    hudX.fillText(am,rx-4,ry);
    ry+=compact?17:19;
  }
  // throttle bar under weapon rack
  const thr=window.__throttle!==undefined?window.__throttle:1;
  const tgx=rx-rackW,tgy=ry+4,tgw=rackW,tgh=10;
  hudX.strokeStyle=HUD_DIM;hudX.lineWidth=1;hudX.strokeRect(tgx,tgy,tgw,tgh);
  hudX.fillStyle=thr<0.15?'#ff6a6a':'#5fff8f';hudX.fillRect(tgx+1,tgy+1,(tgw-2)*Math.max(0,Math.min(1,thr)),tgh-2);
  hudX.fillStyle=HUD_DIM;hudX.font='9px monospace';hudX.textAlign='left';hudX.fillText('THR',tgx,tgy+tgh+9);
  hudX.textAlign='right';hudX.fillText(thr<0.15?'HOVER':(Math.round(thr*100)+'%'),tgx+tgw,tgy+tgh+9);

  // ---- target lock box: acquire -> lock flow ----
  const LK=window.__lock;
  const guidedWpn=wpn===1||wpn===2;
  if(LK&&LK.target&&LK.target.hp>0){
    const tp=LK.target.m.position.clone();tp.y+=LK.target.big?4:2;
    const sp=project(tp);
    const rng=Math.round(heli.position.distanceTo(LK.target.m.position));
    if(sp.on){
      const locked=LK.locked;const col=locked?HUD_RED:HUD_AMBER;
      const sz=locked?24:30-Math.min(6,LK.t*15);
      hudX.strokeStyle=col;hudX.lineWidth=1.6;
      if(locked){
        // corner brackets = confirmed lock
        const c=8;
        [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([ux,uy])=>{
          hudX.beginPath();
          hudX.moveTo(sp.x+ux*sz, sp.y+uy*sz-uy*c);hudX.lineTo(sp.x+ux*sz, sp.y+uy*sz);hudX.lineTo(sp.x+ux*sz-ux*c, sp.y+uy*sz);
          hudX.stroke();
        });
        hudX.fillStyle=col;hudX.font='bold 10px monospace';hudX.textAlign='center';
        if((now/120|0)%2)hudX.fillText(guidedWpn?'● LOCKED — FIRE':'● LOCKED',sp.x,sp.y+sz+13);
        hudX.fillStyle=HUD_DIM;hudX.font='9px monospace';
        hudX.fillText('RNG '+rng+'m',sp.x,sp.y-sz-6);
      }else{
        // rotating box = acquiring, fills in as LK.t approaches LOCK_TIME
        hudX.save();hudX.translate(sp.x,sp.y);hudX.rotate(now/500);
        hudX.strokeRect(-sz/2,-sz/2,sz,sz);hudX.restore();
        hudX.fillStyle=col;hudX.font='9px monospace';hudX.textAlign='center';
        const pct=Math.min(99,Math.round(LK.t/LOCK_TIME*100));
        hudX.fillText('ACQUIRING '+pct+'%',sp.x,sp.y+sz+2);
      }
    }
  }else if(guidedWpn&&(now/260|0)%2){
    hudX.fillStyle=HUD_DIM;hudX.font='9px monospace';hudX.textAlign='center';
    hudX.fillText('NO TARGET',cx,cy+40);
  }
  // compact tracking-status readout under the weapon rack (visible even off-screen)
  let ry2=tgy+tgh+24;
  if(guidedWpn){
    hudX.textAlign='right';hudX.font='bold 10px monospace';
    const st=LK&&LK.locked?'LOCKED':(LK&&LK.target?'ACQUIRING':'NO TARGET');
    hudX.fillStyle=st==='LOCKED'?HUD_RED:st==='ACQUIRING'?HUD_AMBER:HUD_DIM;
    hudX.fillText('TRACK: '+st,rx,ry2);
    ry2+=16;
  }

  // ---- prominent KILLS readout, with a pop/flash on each new kill ----
  {
    const pop=Math.max(0,1-(now-killPopT)/700); // 0..1, decays over 0.7s after a kill
    const scale=1+pop*0.4;
    const boxW=94,boxH=40,by=ry2+boxH*0.5;
    hudX.save();
    hudX.translate(rx-boxW*0.5,by);
    hudX.scale(scale,scale);
    hudX.textAlign='center';
    hudX.fillStyle=pop>0?`rgba(255,${Math.round(210-140*pop)},${Math.round(60+90*pop)},1)`:HUD_DIM;
    hudX.font='10px monospace';
    hudX.fillText('KILLS',0,-10);
    hudX.fillStyle=pop>0?'#fff6d8':HUD_RED;
    hudX.font='bold 26px monospace';
    hudX.fillText(String(kills),0,14);
    hudX.restore();
    if(pop>0.05){
      hudX.strokeStyle=`rgba(255,180,90,${pop})`;hudX.lineWidth=1.4;
      hudX.strokeRect(rx-boxW,ry2,boxW,boxH);
    }
    ry2+=boxH+6;
  }

  // ---- projected objective marker in the world ----
  if(hostage){
    const hp2=hostage.pos.clone();hp2.y+=hostage.rooftop?2:6;
    const sp=project(hp2);
    const dHoriz=Math.hypot(heli.position.x-hostage.pos.x,heli.position.z-hostage.pos.z);
    const col=hostage.state==='pad'?HUD_CYAN:'#3fffa0';
    if(sp.on){
      hudX.strokeStyle=col;hudX.fillStyle=col;hudX.lineWidth=1.4;
      hudX.beginPath();hudX.moveTo(sp.x,sp.y-9);hudX.lineTo(sp.x+8,sp.y);hudX.lineTo(sp.x,sp.y+9);hudX.lineTo(sp.x-8,sp.y);hudX.closePath();hudX.stroke();
      hudX.font='10px monospace';hudX.textAlign='center';
      hudX.fillText((hostage.state==='pad'?'LZ ':'SURVIVOR ')+Math.round(dHoriz)+'m',sp.x,sp.y-14);
    }else{
      // off-screen chevron toward objective
      const ang=Math.atan2(sp.y-cy,sp.x-cx)+(_pv.z>1?Math.PI:0);
      const ex=cx+Math.cos(ang)*Math.min(w,h)*0.32,ey=cy+Math.sin(ang)*Math.min(w,h)*0.32;
      hudX.save();hudX.translate(ex,ey);hudX.rotate(ang);
      hudX.fillStyle=col;hudX.beginPath();hudX.moveTo(10,0);hudX.lineTo(-6,-7);hudX.lineTo(-6,7);hudX.closePath();hudX.fill();hudX.restore();
      hudX.fillStyle=col;hudX.font='10px monospace';hudX.textAlign='center';
      hudX.fillText(Math.round(dHoriz)+'m',ex,ey-12);
    }
  }

  // ---- threat warning ----
  const threat=zombies.some(z=>z.m.position.distanceTo(heli.position)<30);

      const carGeos=[];

      const glassGeo=new THREE.BoxGeometry(1.15,0.4,1.45);

      const MC=window.__movingCars, geoCount=carGeos.map(()=>0), _mcc=new THREE.Color();

      const glassIM=new THREE.InstancedMesh(glassGeo,new THREE.MeshStandardMaterial({color:0x0a1420,metalness:0.3,roughness:0.1,envMapIntensity:1.3,transparent:true,opacity:.72}),80);
      const whIM=new THREE.InstancedMesh(mcWheelSet,mcWheelM,80), hbIM=new THREE.InstancedMesh(mcHubSet,hubM,80);
      const hlIM=new THREE.InstancedMesh(new THREE.BoxGeometry(1.4,.14,.08),new THREE.MeshBasicMaterial({color:0xfff4d0}),80);
      const tlIM=new THREE.InstancedMesh(new THREE.BoxGeometry(1.5,.12,.08),new THREE.MeshBasicMaterial({color:0xff2818}),80);
      [glassIM,whIM,hbIM,hlIM,tlIM].forEach(m=>{m.frustumCulled=false;scene.add(m);});
      window.__mcInst={bodyMeshes,glassIM,whIM,hbIM,hlIM,tlIM,Rbody:new THREE.Matrix4().makeRotationY(Math.PI/2),
        G:new THREE.Matrix4(),L:new THREE.Matrix4(),M:new THREE.Matrix4(),q:new THREE.Quaternion(),e:new THREE.Euler(),p:new THREE.Vector3(),s:new THREE.Vector3(1,1,1)};
    }
    { const MC=window.__movingCars, I=window.__mcInst;
      MC.forEach((c,i)=>{
        c.pos+=c.spd*c.dir*dt;
        if(c.pos>520)c.pos=-520;if(c.pos<-520)c.pos=520;
        I.p.set(c.onX?c.pos:c.lane,0,c.onX?c.lane:c.pos);
        I.e.set(0,c.yaw,0);I.q.setFromEuler(I.e);I.G.compose(I.p,I.q,I.s);
        const bm=I.bodyMeshes[c.gi];if(bm){I.M.multiplyMatrices(I.G,I.Rbody);bm.setMatrixAt(c.slot,I.M);}
        I.L.makeTranslation(0,1.12,0.15);I.M.multiplyMatrices(I.G,I.L);I.glassIM.setMatrixAt(i,I.M);
        I.whIM.setMatrixAt(i,I.G);I.hbIM.setMatrixAt(i,I.G);
        I.L.makeTranslation(0,.55,-2.3);I.M.multiplyMatrices(I.G,I.L);I.hlIM.setMatrixAt(i,I.M);
        I.L.makeTranslation(0,.6,2.4);I.M.multiplyMatrices(I.G,I.L);I.tlIM.setMatrixAt(i,I.M);
      });
      I.bodyMeshes.forEach(m=>{if(m)m.instanceMatrix.needsUpdate=true;});
      I.glassIM.instanceMatrix.needsUpdate=true;I.whIM.instanceMatrix.needsUpdate=true;I.hbIM.instanceMatrix.needsUpdate=true;
      I.hlIM.instanceMatrix.needsUpdate=true;I.tlIM.instanceMatrix.needsUpdate=true;
    }
    updateRevealLights(); // snap the reveal-light pool to the nearest lamps/car headlights this frame
    if(window.__waterTex)window.__waterTex.offset.y+=dt*0.015;
    if(window.__oceanTex)window.__oceanTex.offset.y+=dt*0.006;
    if(window.__navyShip){const S=window.__navyShip;S.t+=dt;S.g.position.y=Math.sin(S.t*0.6)*0.35;S.g.rotation.z=Math.sin(S.t*0.5)*0.012;if(window.__shipRadar)window.__shipRadar.rotation.y+=dt*0.9;if(window.__shipBeacon){const b=0.55+0.45*Math.abs(Math.sin(S.t*2.2));window.__shipBeacon.material.opacity=b;window.__shipBeacon.scale.setScalar(0.8+b*0.4);}}
    if(!window.__hwyCars){
      window.__hwyCars=[];
      function mkVehicle(kind){
        const g=new THREE.Group();
        const col=[0xb03030,0x3050a0,0xd8d8d8,0x222428,0xc8a030,0x3a5a3a][Math.floor(Math.random()*6)];

          const cab=new THREE.Mesh(new THREE.BoxGeometry(2.1,1.4,1.4),new THREE.MeshLambertMaterial({color:0x161c22}));cab.position.set(0,1.1,-2.6);g.add(cab);

          for(let w=0;w<4;w++){const win=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.8,0.08),new THREE.MeshBasicMaterial({color:0xffe8b0}));win.position.set(-3+w*2,1.7,4.55);g.add(win);}
        }
        const hl=new THREE.Mesh(new THREE.BoxGeometry(kind===2?2.2:1.8,.15,.1),new THREE.MeshBasicMaterial({color:0xfff0c0}));
        hl.position.set(0,0.6,kind===2?-4.4:(kind===1?-2.6:-2.2));g.add(hl);
        const tl3=new THREE.Mesh(new THREE.BoxGeometry(kind===2?2.2:1.8,.15,.1),new THREE.MeshBasicMaterial({color:0xff3020}));
        tl3.position.set(0,0.6,kind===2?4.4:(kind===1?2.6:2.2));g.add(tl3);
        const vWheelG=new THREE.CylinderGeometry(kind===2?0.5:0.4,kind===2?0.5:0.4,0.3,10);

          [-wx,wx].forEach(x=>{

      }
      for(let i=0;i<22;i++){ // denser expressway traffic (was 15)
        const kind=Math.random()<0.55?0:(Math.random()<0.7?1:2);
        const v=mkVehicle(kind);
        const lane=Math.random()<.5?-3.5:3.5;

        scene.add(v);
        window.__hwyCars.push({m:v,lane,pos:(Math.random()-.5)*CITY*1.9,spd:(kind===2?12:kind===1?16:22)+Math.random()*8,dir:lane<0?1:-1});
      }
    }
    window.__hwyCars.forEach(c=>{
      c.pos+=c.spd*c.dir*dt;
      if(c.pos>CITY)c.pos=-CITY;if(c.pos<-CITY)c.pos=CITY;
      c.m.position.set(c.pos,17.4,HWY_Z+c.lane);
    });
    // pedestrians read as sub-pixel twinkling dots from high altitude — cull the whole instanced
    // batch (2 draw calls) above a threshold, with hysteresis so it doesn't pop back and forth
    if(window.__pedHidden===undefined)window.__pedHidden=false;
    if(heli.position.y>140)window.__pedHidden=true;else if(heli.position.y<115)window.__pedHidden=false;
    pedBodyMesh.visible=pedHeadMesh.visible=!window.__pedHidden;
    // pedestrians: sidewalk walkers + crossing walkers, animated via instance-matrix updates (cheap; 0 extra draw calls)
    if(peds.length&&!window.__pedHidden){
      const pdum=window.__pedDummy||(window.__pedDummy=new THREE.Object3D());
      for(let i=0;i<peds.length;i++){

    window.__ring.position.x=cam.position.x;window.__ring.position.z=cam.position.z;
    moonSprite.position.set(cam.position.x-600,500,cam.position.z-1200);

    if(window.__beacon)window.__beacon.visible=(now%1400)<800;
  }
  renderPost();
}
requestAnimationFrame(loop);
