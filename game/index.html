  .hud { position:absolute; color:#9dffb0; text-shadow:0 0 4px rgba(120,255,150,.6); user-select:none; pointer-events:none; z-index:8; font-family:'Courier New',monospace; }
  #msg { top:34%; left:50%; transform:translate(-50%,-50%); font-size:28px; font-weight:bold; text-align:center; display:none; color:#ff4040; text-shadow:0 0 12px #f00; width:90%; letter-spacing:2px; }
  #radioSub { bottom:130px; left:50%; transform:translateX(-50%); max-width:520px; text-align:center; font-size:12px; color:#ffd27a; text-shadow:0 0 6px #000; opacity:0; transition:opacity .4s; letter-spacing:.5px; }
  #taskPanel { bottom:104px; left:50%; transform:translateX(-50%); max-width:520px; text-align:center; font-size:12px; letter-spacing:1px; color:#9dffb0; background:rgba(3,12,6,.45); border:1px solid rgba(157,255,176,.35); padding:4px 14px; }

  #tacTitle { font-size:10px; letter-spacing:2px; color:#9dffb0; background:rgba(3,12,6,.7); border:1px solid rgba(157,255,176,.4); border-bottom:none; padding:2px 6px; width:max-content; }
  #tacmap { background:#02120a; border:1px solid rgba(157,255,176,.4); box-shadow:inset 0 0 14px rgba(0,0,0,.9), 0 0 10px rgba(60,255,120,.12); }
  .tbtn { position:absolute; pointer-events:auto; user-select:none; -webkit-user-select:none; z-index:9;
    color:#9dffb0; background:rgba(6,18,10,.55); border:1px solid rgba(157,255,176,.55);
    border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold;
    font-family:'Courier New',monospace; letter-spacing:1px; text-shadow:0 0 4px rgba(120,255,150,.6); }
  #stick-zone { position:absolute; left:0; bottom:0; width:45%; height:55%; pointer-events:auto; z-index:7; }
  #stick-base { position:absolute; width:110px; height:110px; border-radius:50%; border:2px solid rgba(157,255,176,.4); background:rgba(6,18,10,.3); display:none; z-index:9; }
  #stick-knob { position:absolute; width:48px; height:48px; border-radius:50%; background:rgba(157,255,176,.45); display:none; z-index:9; }
  #fireBtn { right:22px; bottom:60px; width:92px; height:92px; font-size:15px; background:rgba(70,10,14,.6); border-color:rgba(255,90,90,.7); color:#ff9090; }
  #camBtn { right:34px; bottom:170px; width:56px; height:56px; font-size:11px; }

<body>

<script>
if(!window.storage){window.storage={_m:{},get(k){return Promise.resolve(this._m[k]?{value:this._m[k]}:null);},set(k,v){this._m[k]=v;return Promise.resolve();}};}
</script>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="SkeletonUtils.js"></script>
<script src="models-zombie.js"></script>
<script>
const W=()=>innerWidth,H=()=>innerHeight;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,logarithmicDepthBuffer:true});
renderer.setSize(W(),H());
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();
// night neon haze — deep indigo, layered with a low warm ground-haze band (see groundHaze below)
scene.fog=new THREE.FogExp2(0x1c1732,0.00165);
// near raised from 0.1 and far cut from 4000 (biggest fixed scene radius is the sky sphere at 2000)
// to compress the depth range and kill high-altitude z-fighting/shimmer; 0.5 still clears the closest
// 3D cockpit dash geometry (~1.2 units from camera) so cockpit view (press C) is unaffected.
const cam=new THREE.PerspectiveCamera(66,W()/H(),0.5,2600);window.cam=cam;

// ---------- POST-PROCESSING: manual bloom (no addons available, hand-rolled) ----------
// two-tier mip-style bloom (tight + wide) for a soft, filmic, non-shimmery neon glow
let bw=Math.floor(W()/3),bh=Math.floor(H()/3);
let bw2=Math.max(2,Math.floor(bw/2)),bh2=Math.max(2,Math.floor(bh/2));
const rtParams={minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat};
const sceneRT=new THREE.WebGLRenderTarget(W(),H(),rtParams);
const brightRT=new THREE.WebGLRenderTarget(bw,bh,rtParams);
const blurRT1=new THREE.WebGLRenderTarget(bw,bh,rtParams);
const blurRT2=new THREE.WebGLRenderTarget(bw,bh,rtParams);
const wideRT1=new THREE.WebGLRenderTarget(bw2,bh2,rtParams);
const wideRT2=new THREE.WebGLRenderTarget(bw2,bh2,rtParams);
const postScene=new THREE.Scene();
const postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const brightMat=new THREE.ShaderMaterial({
  uniforms:{tDiffuse:{value:null},threshold:{value:0.72},knee:{value:0.5}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float threshold;uniform float knee;varying vec2 vUv;
    void main(){
      vec4 c=texture2D(tDiffuse,vUv);
      float b=max(c.r,max(c.g,c.b));
      // soft-knee threshold: smooth quadratic rolloff instead of a hard cutoff, avoids per-pixel flicker
      float soft=clamp(b-threshold+knee,0.0,2.0*knee);
      soft=soft*soft/(4.0*knee+0.0001);
      float f=max(soft,b-threshold);
      f=clamp(f/max(b,0.0001),0.0,1.0);
      gl_FragColor=vec4(c.rgb*f,1.0);
    }`
});
const blurMat=new THREE.ShaderMaterial({
  uniforms:{tDiffuse:{value:null},dir:{value:new THREE.Vector2(1,0)},res:{value:new THREE.Vector2(bw,bh)}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform vec2 dir;uniform vec2 res;varying vec2 vUv;
    void main(){
      vec2 texel=dir/res;vec4 sum=vec4(0.0);
      sum+=texture2D(tDiffuse,vUv-4.0*texel)*0.05;
      sum+=texture2D(tDiffuse,vUv-3.0*texel)*0.09;
      sum+=texture2D(tDiffuse,vUv-2.0*texel)*0.12;
      sum+=texture2D(tDiffuse,vUv-1.0*texel)*0.15;
      sum+=texture2D(tDiffuse,vUv)*0.18;
      sum+=texture2D(tDiffuse,vUv+1.0*texel)*0.15;
      sum+=texture2D(tDiffuse,vUv+2.0*texel)*0.12;
      sum+=texture2D(tDiffuse,vUv+3.0*texel)*0.09;
      sum+=texture2D(tDiffuse,vUv+4.0*texel)*0.05;
      gl_FragColor=sum;
    }`
});
const compositeMat=new THREE.ShaderMaterial({
  uniforms:{tScene:{value:null},tBloom:{value:null},tBloomWide:{value:null},bloomStrength:{value:0.42},bloomWideStrength:{value:0.30}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}`,
  fragmentShader:`uniform sampler2D tScene;uniform sampler2D tBloom;uniform sampler2D tBloomWide;uniform float bloomStrength;uniform float bloomWideStrength;varying vec2 vUv;
    void main(){
      vec2 cc=vUv-0.5;
      float r2=dot(cc,cc);
      // restrained radial chromatic aberration, strongest toward the frame edges
      vec2 off=cc*(0.0007+0.0016*r2);
      vec3 s;
      s.r=texture2D(tScene,vUv+off).r;
      s.g=texture2D(tScene,vUv).g;
      s.b=texture2D(tScene,vUv-off).b;
      vec3 bloom=texture2D(tBloom,vUv).rgb*bloomStrength+texture2D(tBloomWide,vUv).rgb*bloomWideStrength;
      vec3 c=s+bloom;
      float l=dot(c,vec3(0.299,0.587,0.114));
      // night grade: teal into shadows, magenta/warm into highlights (filmic split-tone)
      vec3 shadowTint=vec3(-0.018,0.018,0.05);
      vec3 highTint=vec3(0.055,-0.012,0.035);
      c+=shadowTint*(1.0-smoothstep(0.0,0.45,l));
      c+=highTint*smoothstep(0.5,1.0,l);
      // filmic contrast + neon saturation punch
      c=(c-0.5)*1.14+0.5;
      c=mix(vec3(l),c,1.24);
      // gentle vignette
      float vig=1.0-smoothstep(0.28,0.92,sqrt(r2));
      c*=mix(0.82,1.0,vig);
      gl_FragColor=vec4(clamp(c,0.0,1.0),1.0);
    }`
});
const postQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),brightMat);
postScene.add(postQuad);
function renderPost(){
  renderer.setRenderTarget(sceneRT);renderer.render(scene,cam);
  postQuad.material=brightMat;brightMat.uniforms.tDiffuse.value=sceneRT.texture;
  renderer.setRenderTarget(brightRT);renderer.render(postScene,postCam);
  postQuad.material=blurMat;
  blurMat.uniforms.res.value.set(bw,bh);
  blurMat.uniforms.tDiffuse.value=brightRT.texture;blurMat.uniforms.dir.value.set(1,0);
  renderer.setRenderTarget(blurRT1);renderer.render(postScene,postCam);
  blurMat.uniforms.tDiffuse.value=blurRT1.texture;blurMat.uniforms.dir.value.set(0,1);
  renderer.setRenderTarget(blurRT2);renderer.render(postScene,postCam);
  blurMat.uniforms.tDiffuse.value=blurRT2.texture;blurMat.uniforms.dir.value.set(1,0);
  renderer.setRenderTarget(blurRT1);renderer.render(postScene,postCam);
  blurMat.uniforms.tDiffuse.value=blurRT1.texture;blurMat.uniforms.dir.value.set(0,1);
  renderer.setRenderTarget(blurRT2);renderer.render(postScene,postCam);
  // wide tier: downsample the already-smoothed tight bloom (dir=0 => identity copy, weights sum to 1.0)
  // then blur it again at half the resolution — a fixed-tap kernel over a smaller image reads as a much wider, softer halo
  blurMat.uniforms.res.value.set(bw2,bh2);
  blurMat.uniforms.tDiffuse.value=blurRT2.texture;blurMat.uniforms.dir.value.set(0,0);
  renderer.setRenderTarget(wideRT1);renderer.render(postScene,postCam);
  blurMat.uniforms.tDiffuse.value=wideRT1.texture;blurMat.uniforms.dir.value.set(1,0);
  renderer.setRenderTarget(wideRT2);renderer.render(postScene,postCam);
  blurMat.uniforms.tDiffuse.value=wideRT2.texture;blurMat.uniforms.dir.value.set(0,1);
  renderer.setRenderTarget(wideRT1);renderer.render(postScene,postCam);
  blurMat.uniforms.tDiffuse.value=wideRT1.texture;blurMat.uniforms.dir.value.set(1,0);
  renderer.setRenderTarget(wideRT2);renderer.render(postScene,postCam);
  blurMat.uniforms.tDiffuse.value=wideRT2.texture;blurMat.uniforms.dir.value.set(0,1);
  renderer.setRenderTarget(wideRT1);renderer.render(postScene,postCam);
  postQuad.material=compositeMat;
  compositeMat.uniforms.tScene.value=sceneRT.texture;
  compositeMat.uniforms.tBloom.value=blurRT2.texture;
  compositeMat.uniforms.tBloomWide.value=wideRT1.texture;
  renderer.setRenderTarget(null);renderer.render(postScene,postCam);
}

// ---------- SKY: Shinjuku night gradient ----------
const skyTex=(()=>{const cv=document.createElement('canvas');cv.width=512;cv.height=1024;
const g=cv.getContext('2d');const gr=g.createLinearGradient(0,0,0,1024);
gr.addColorStop(0,'#030309');gr.addColorStop(.26,'#0c0a28');gr.addColorStop(.48,'#1e1640');
gr.addColorStop(.66,'#3c2258');gr.addColorStop(.80,'#7a3a68');gr.addColorStop(.90,'#c1567a');
gr.addColorStop(.96,'#e3835f');gr.addColorStop(1,'#f0a468');
g.fillStyle=gr;g.fillRect(0,0,512,1024);
// stars — denser near zenith, fading toward horizon glow
for(let i=0;i<700;i++){
  const y=Math.pow(Math.random(),1.8)*600;
  const x=Math.random()*512;
  const s=Math.random();
  g.fillStyle=`rgba(${220+Math.random()*35},${220+Math.random()*35},255,${0.25+s*0.6})`;
  const sz=s<0.92?1:2;
  g.fillRect(x,y,sz,sz);
}
// faint horizontal atmospheric bands
for(let i=0;i<5;i++){
  const y=350+Math.random()*450;
  const bg=g.createLinearGradient(0,y-20,0,y+20);
  bg.addColorStop(0,'rgba(180,120,200,0)');bg.addColorStop(.5,'rgba(180,120,200,.05)');bg.addColorStop(1,'rgba(180,120,200,0)');
  g.fillStyle=bg;g.fillRect(0,y-20,512,40);
}
// city glow at horizon — richer, wider light-pollution dome (warm core, cooler bleed above)
const hg=g.createLinearGradient(0,760,0,1024);
hg.addColorStop(0,'rgba(255,140,120,0)');hg.addColorStop(.55,'rgba(255,150,140,.16)');hg.addColorStop(1,'rgba(255,190,150,.4)');
g.fillStyle=hg;g.fillRect(0,760,512,264);
const hg2=g.createLinearGradient(0,880,0,1024);
hg2.addColorStop(0,'rgba(255,90,150,0)');hg2.addColorStop(1,'rgba(255,120,150,.22)');
g.fillStyle=hg2;g.fillRect(0,880,512,144);
return new THREE.CanvasTexture(cv);})();
const sky=new THREE.Mesh(new THREE.SphereGeometry(2000,16,16),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false}));
scene.add(sky);
// moon — soft photoreal disc with a wide atmospheric corona (cheap stand-in for a moonlight "shaft")
const moonTex=tex((g,w,h)=>{
  const gr=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  gr.addColorStop(0,'rgba(240,244,255,1)');
  gr.addColorStop(0.32,'rgba(220,228,255,.97)');
  gr.addColorStop(0.6,'rgba(195,205,255,.55)');
  gr.addColorStop(0.82,'rgba(180,190,240,.14)');
  gr.addColorStop(1,'rgba(180,190,240,0)');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.fillStyle='rgba(160,170,210,.22)';
  for(let i=0;i<6;i++){g.beginPath();g.arc(w*0.28+Math.random()*w*0.4,h*0.28+Math.random()*h*0.4,4+Math.random()*7,0,7);g.fill();}
},128,128);
const moonHaloTex=tex((g,w,h)=>{
  const gr=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  gr.addColorStop(0,'rgba(210,220,255,.22)');
  gr.addColorStop(.4,'rgba(190,200,250,.10)');
  gr.addColorStop(1,'rgba(190,200,250,0)');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
},128,128);
const moonHalo=new THREE.Sprite(new THREE.SpriteMaterial({map:moonHaloTex,transparent:true,depthWrite:false,fog:false,blending:THREE.AdditiveBlending}));
moonHalo.scale.set(620,620,1);
moonHalo.position.set(-600,500,-1200);
scene.add(moonHalo);
const moonSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:moonTex,transparent:true,depthWrite:false,fog:false}));
moonSprite.scale.set(175,175,1);
moonSprite.position.set(-600,500,-1200);
scene.add(moonSprite);

// distant skyline silhouette, warm/cool lit windows
{const cv=document.createElement('canvas');cv.width=2048;cv.height=320;
const g=cv.getContext('2d');
let x=0;
while(x<2048){
  const bw=18+Math.random()*55,bh=60+Math.random()*220;
  g.fillStyle='rgba(20,14,36,.96)';
  g.fillRect(x,320-bh,bw,bh);
  for(let i=0;i<bw*bh/130;i++){
    g.fillStyle=Math.random()<.55?'rgba(255,190,140,.85)':(Math.random()<.7?'rgba(150,220,255,.8)':'rgba(255,120,220,.75)');
    g.fillRect(x+2+Math.random()*(bw-4),320-bh+4+Math.random()*(bh-8),1.6,2.2);
  }
  if(Math.random()<.3){g.fillStyle='rgba(255,50,90,.9)';g.fillRect(x+bw/2,320-bh-5,2,2);}
  x+=bw+Math.random()*12;
}
const t=new THREE.CanvasTexture(cv);
const ring=new THREE.Mesh(new THREE.CylinderGeometry(1400,1400,430,48,1,true),
  new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.BackSide,fog:false}));
ring.position.y=180;scene.add(ring);
window.__ring=ring;}

// low magenta/cyan glow clouds (light pollution)
const clouds=[];
function makeCloudTex(){
  const cv=document.createElement('canvas');cv.width=256;cv.height=160;
  const g=cv.getContext('2d');
  const col=Math.random()<.5?'235,70,195':'70,190,255';
  const cx=128+Math.random()*20-10,cy=90;
  for(let i=0;i<9;i++){
    const bx=cx+(Math.random()-.5)*160,by=cy+(Math.random()-.5)*50;
    const br=30+Math.random()*40;
    const gr=g.createRadialGradient(bx,by,2,bx,by,br);
    gr.addColorStop(0,`rgba(${col},.4)`);gr.addColorStop(.55,`rgba(${col},.2)`);gr.addColorStop(1,`rgba(${col},0)`);
    g.fillStyle=gr;g.fillRect(bx-br,by-br,br*2,br*2);
  }
  return new THREE.CanvasTexture(cv);
}
const cloudTexVariants=[makeCloudTex(),makeCloudTex(),makeCloudTex(),makeCloudTex()];
for(let i=0;i<20;i++){
  const ct=cloudTexVariants[Math.floor(Math.random()*cloudTexVariants.length)];
  const m=new THREE.Mesh(new THREE.PlaneGeometry(300+Math.random()*340,110+Math.random()*90),
    new THREE.MeshBasicMaterial({map:ct,transparent:true,opacity:.3+Math.random()*.22,depthWrite:false,fog:false}));
  m.position.set((Math.random()-.5)*2400,190+Math.random()*240,(Math.random()-.5)*2400);
  scene.add(m);clouds.push(m);
}
// low ground-hugging haze band — layered aerial perspective so distant blocks recede into a warm/cool
// light-pollution mist near roof height, giving the skyline real scale and depth (subject to scene fog too)
const groundHaze=[];
function makeGroundHazeTex(){
  const cv=document.createElement('canvas');cv.width=256;cv.height=140;
  const g=cv.getContext('2d');
  const col=Math.random()<.6?'255,140,150':'180,150,235';
  for(let i=0;i<7;i++){
    const bx=128+(Math.random()-.5)*180,by=70+(Math.random()-.5)*44,br=42+Math.random()*54;
    const gr=g.createRadialGradient(bx,by,2,bx,by,br);
    gr.addColorStop(0,`rgba(${col},.4)`);gr.addColorStop(.55,`rgba(${col},.2)`);gr.addColorStop(1,`rgba(${col},0)`);
    g.fillStyle=gr;g.fillRect(bx-br,by-br,br*2,br*2);
  }
  return new THREE.CanvasTexture(cv);
}
const hazeTexVariants=[makeGroundHazeTex(),makeGroundHazeTex(),makeGroundHazeTex()];
for(let i=0;i<28;i++){
  const ht=hazeTexVariants[Math.floor(Math.random()*hazeTexVariants.length)];
  const m=new THREE.Mesh(new THREE.PlaneGeometry(440+Math.random()*400,150+Math.random()*110),
    new THREE.MeshBasicMaterial({map:ht,transparent:true,opacity:.16+Math.random()*.14,depthWrite:false}));
  m.position.set((Math.random()-.5)*2600,16+Math.random()*58,(Math.random()-.5)*2600);
  scene.add(m);groundHaze.push(m);
}

// ---------- LIGHTS ----------
scene.add(new THREE.HemisphereLight(0x4a3a8e,0x201a30,0.64));

// ---------- IBL: procedural night-city environment map (PMREM, once at init) ----------
// A DARK, neon-tinted equirect so PBR materials get believable ambient + reflections
// without brightening the scene — the sky sphere/background stays untouched.
(function(){
  const w=512,h=256;
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const g=cv.getContext('2d');
  // base: dark desaturated purple-indigo sky -> dark ground, matches scene mood
  const gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'#020207');
  gr.addColorStop(0.30,'#0a0818');
  gr.addColorStop(0.50,'#130f24');
  gr.addColorStop(0.63,'#1c1330');
  gr.addColorStop(0.72,'#241428');   // warm-ish horizon band starts
  gr.addColorStop(0.80,'#160e18');   // ground / rooftop silhouette line
  gr.addColorStop(1.0,'#08060a');    // nadir — dark wet street
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  // warm horizon light-pollution band (low-pollution glow, kept dim)
  const hy=h*0.755;
  const hg=g.createLinearGradient(0,hy-18,0,hy+18);
  hg.addColorStop(0,'rgba(255,140,110,0)');
  hg.addColorStop(0.5,'rgba(255,130,110,.16)');
  hg.addColorStop(1,'rgba(255,130,110,0)');
  g.fillStyle=hg;g.fillRect(0,hy-18,w,36);
  // scattered dim neon glow bands around the horizon (billboards/signage bleed)
  const neon=['255,60,190','70,200,255','255,200,90','190,80,255','255,90,90'];
  for(let i=0;i<40;i++){
    const x=Math.random()*w,y=hy-24+Math.random()*46;
    const r=3+Math.random()*7;
    const col=neon[Math.floor(Math.random()*neon.length)];
    const rg=g.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,`rgba(${col},.38)`);rg.addColorStop(1,`rgba(${col},0)`);
    g.fillStyle=rg;g.fillRect(x-r,y-r,r*2,r*2);
  }
  // a few brighter neon smears — the bits that actually punch through as reflections
  for(let i=0;i<8;i++){
    const x=Math.random()*w,y=hy-14+Math.random()*28;
    const col=neon[Math.floor(Math.random()*neon.length)];
    const rg=g.createRadialGradient(x,y,0,x,y,10);
    rg.addColorStop(0,`rgba(${col},.7)`);rg.addColorStop(0.35,`rgba(${col},.3)`);rg.addColorStop(1,`rgba(${col},0)`);
    g.fillStyle=rg;g.fillRect(x-10,y-10,20,20);
  }
  // faint stars near zenith
  for(let i=0;i<160;i++){
    const y=Math.pow(Math.random(),2.2)*h*0.4;
    const x=Math.random()*w;
    g.fillStyle=`rgba(210,215,255,${0.1+Math.random()*0.22})`;
    g.fillRect(x,y,1,1);
  }
  const envTex=new THREE.CanvasTexture(cv);
  envTex.mapping=THREE.EquirectangularReflectionMapping;
  envTex.encoding=THREE.sRGBEncoding;
  const pmremGen=new THREE.PMREMGenerator(renderer);
  pmremGen.compileEquirectangularShader();
  const envRT=pmremGen.fromEquirectangular(envTex);
  scene.environment=envRT.texture; // ambient IBL + reflections; scene.background left alone
  envTex.dispose();
  pmremGen.dispose();
})();

let AC=null;
function startAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const len=2*AC.sampleRate,buf=AC.createBuffer(1,len,AC.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=130;
    const rotorGain=AC.createGain();rotorGain.gain.value=0.10;
    const lfo=AC.createOscillator();lfo.frequency.value=12.5;
    const lfoG=AC.createGain();lfoG.gain.value=0.07;
    lfo.connect(lfoG);lfoG.connect(rotorGain.gain);
    src.connect(lp);lp.connect(rotorGain);rotorGain.connect(AC.destination);
    src.start();lfo.start();
    function radioBurst(){
      if(!AC)return;
      const dur=0.35+Math.random()*0.45;
      const rlen=Math.floor(dur*AC.sampleRate),rbuf=AC.createBuffer(1,rlen,AC.sampleRate);
      const rd=rbuf.getChannelData(0);
      for(let i=0;i<rlen;i++)rd[i]=(Math.random()*2-1);
      const rs=AC.createBufferSource();rs.buffer=rbuf;
      const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1300+Math.random()*900;bp.Q.value=2.4;
      const rg=AC.createGain();
      rg.gain.setValueAtTime(0,AC.currentTime);
      rg.gain.linearRampToValueAtTime(0.07,AC.currentTime+0.015);
      rg.gain.setValueAtTime(0.07,AC.currentTime+dur-0.04);
      rg.gain.linearRampToValueAtTime(0,AC.currentTime+dur);
      rs.connect(bp);bp.connect(rg);rg.connect(AC.destination);
      rs.start();
      const click=AC.createOscillator();click.type='square';click.frequency.value=1800;
      const cg=AC.createGain();cg.gain.setValueAtTime(0.03,AC.currentTime+dur);cg.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur+0.04);
      click.connect(cg);cg.connect(AC.destination);click.start(AC.currentTime+dur);click.stop(AC.currentTime+dur+0.05);
      const lines=['COMMAND: HOSTILES CONVERGING, STAY SHARP','COMMAND: SURVIVOR BEACON ACTIVE, PROCEED','COMMAND: MAINTAIN ALTITUDE, WEATHER CLEAR','COMMAND: GOOD HUNTING OUT THERE, PILOT','COMMAND: EXTRACTION ZONE STANDING BY'];
      const sub=document.getElementById('radioSub');
      if(sub){
        sub.textContent=lines[Math.floor(Math.random()*lines.length)];
        sub.style.opacity=1;
        clearTimeout(window.__subTimeout);
        window.__subTimeout=setTimeout(()=>{sub.style.opacity=0;},3200);
      }
    }
    function scheduleRadio(){
      if(!AC)return;
      radioBurst();
      setTimeout(scheduleRadio,8000+Math.random()*10000);
    }
    setTimeout(scheduleRadio,3000);
  }catch(e){}
}

function facadeTex(base){return tex((g,w,h)=>{

  for(let y=0;y<rows;y++){

// Hierarchical grid: wide avenues, side streets, back alleys, irregular blocks,
// a river with bridges on the east side, rail + expressway corridors.
const CITY=1150;            // visual ground half-extent

const RAIL_Z=192;           // elevated rail corridor (constant z)
const HWY_Z=-288;           // expressway rides above this avenue
function buildRoadAxis(majorsAt,avoid){
  const roads=majorsAt.map(m=>({p:m,w:26,major:true}));
  let p=-560+Math.random()*20;
  while(p<560){
    const nearMajor=majorsAt.some(m=>Math.abs(p-m)<40);
    const nearAvoid=avoid.some(a=>Math.abs(p-a)<26);
    if(!nearMajor&&!nearAvoid)roads.push({p,w:Math.random()<0.22?7:14,major:false});
    p+=52+Math.random()*68;
  }
  return roads.sort((a,b)=>a.p-b.p);
}
const ROADS_X=buildRoadAxis([-352,-32,288],[]).filter(r=>r.p<RIVER.x0-26||r.p>RIVER.x1+26); // run along z
const ROADS_Z=buildRoadAxis([HWY_Z,64,384],[RAIL_Z]);                                       // run along x
const laneRoads={x:ROADS_X.filter(r=>r.w>10),z:ROADS_Z.filter(r=>r.w>10)};
function pickLane(onX){
  const arr=onX?laneRoads.z:laneRoads.x;
  const r=arr[Math.floor(Math.random()*arr.length)];
  const dir=Math.random()<.5?1:-1;
  const off=r.major?(Math.random()<.5?3.4:7.4):3.2;
  return {lane:r.p-dir*off,dir,road:r};
}

// build road strips (geometry length axis = local +y pre-rotation; rotation.z spins in-plane for x-running roads)
function roadTexFor(r){
  const base=r.major?majorRoadTex:(r.w>10?roadStripTex:alleyTex);
  const t=base.clone();t.needsUpdate=true;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(1,Math.round(CITY*2/(r.major?26:14)));
  return t;
}
// wet-look roughness map matched to a road strip's UV tiling — long vertical (along-road) streaks
function roadWetRoughFor(r){
  const t=wetRoughTex.clone();t.needsUpdate=true;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(r.major?2:1,Math.round(CITY*2/(r.major?26:14)));
  return t;
}
function addRoad(axis,r){
  const mat=new THREE.MeshStandardMaterial({map:roadTexFor(r),roughness:0.42,roughnessMap:roadWetRoughFor(r),metalness:0.05,envMapIntensity:1.25,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4});
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(r.w,CITY*2),mat);
  mesh.rotation.set(-Math.PI/2,0,axis==='z'?Math.PI/2:0);
  if(axis==='x')mesh.position.set(r.p,0.034,0);
  else mesh.position.set(0,0.04,r.p);
  mesh.receiveShadow=true;scene.add(mesh);
  if(r.w<=10)return; // alleys: no sidewalks/curbs
  [-1,1].forEach(sd=>{
    const off=r.w/2+SW/2;
    const sw2=new THREE.Mesh(new THREE.PlaneGeometry(SW,CITY*2),sidewalkMat);
    sw2.rotation.set(-Math.PI/2,0,axis==='z'?Math.PI/2:0);
    if(axis==='x')sw2.position.set(r.p+sd*off,0.03,0);
    else sw2.position.set(0,0.03,r.p+sd*off);

}

function neonTex(txt,col){

    });

function addNeonSigns(grp,bw,bd,bh,cx,cz){
  const count=2+Math.floor(Math.random()*2);
  for(let i=0;i<count;i++){
    const nm=neonMats[Math.floor(Math.random()*neonMats.length)];
    const sh=Math.min(bh*0.55,10+Math.random()*16),sw=sh/4;
    const sign=new THREE.Mesh(new THREE.BoxGeometry(0.5,sh,sw),[nm.m,nm.m,nm.m,nm.m,nm.m,nm.m]);
    const side=Math.random()<.5?1:-1;
    const face=Math.random()<.5;
    if(face)sign.position.set(side*(bw/2+0.3),3+sh/2+Math.random()*(bh-sh-6),bd*0.3*(Math.random()-.5)*2);
    else{sign.rotation.y=Math.PI/2;sign.position.set(bw*0.3*(Math.random()-.5)*2,3+sh/2+Math.random()*(bh-sh-6),side*(bd/2+0.3));}
    grp.add(sign);
    const glow=new THREE.Mesh(new THREE.PlaneGeometry(sw*1.3,sh*1.08),
      new THREE.MeshBasicMaterial({color:nm.c,transparent:true,opacity:.06,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
    glow.position.copy(sign.position);glow.rotation.copy(sign.rotation);
    grp.add(glow);
    pulseSigns.push({m:sign,g:glow,ph:Math.random()*7,fast:Math.random()<.35});

    // physical weathered cage: 4 corner tubes + 2 front cage bars + a junction box + (sometimes) a sagging wire
    if(cx!==undefined){
      const yaw=sign.rotation.y,cosY=Math.cos(yaw),sinY=Math.sin(yaw);
      const toWorld=(lx,ly,lz)=>({x:lx*cosY+lz*sinY+sign.position.x+cx,y:ly+sign.position.y,z:-lx*sinY+lz*cosY+sign.position.z+cz});
      const halfT=0.32,halfW=sw*0.58,tubeLen=sh*0.94;
      [[halfT,halfW],[halfT,-halfW],[-halfT,halfW],[-halfT,-halfW]].forEach(([lx,lz])=>{
        const w2=toWorld(lx,0,lz);
        neonCageTubeXf.push({x:w2.x,y:w2.y,z:w2.z,len:tubeLen});
      });
      [halfT,-halfT].forEach(lx=>{
        [sh/2*0.9,-sh/2*0.9].forEach(ly=>{
          const w2=toWorld(lx,ly,0);
          neonCageBarXf.push({x:w2.x,y:w2.y,z:w2.z,len:halfW*2+0.12,yaw:yaw+Math.PI/2});
        });
      });
      const jb=toWorld(halfT+0.14,sh/2*0.9+0.22,0);
      neonJunctionXf.push({x:jb.x,y:jb.y,z:jb.z,yaw});
      if(Math.random()<0.4){
        const a=toWorld(halfT+0.14,sh/2*0.9,0);
        const dx=(Math.random()-.5)*3,dz=(Math.random()-.5)*3,dy=-(1.5+Math.random()*2.2);
        let prev=new THREE.Vector3(a.x,a.y,a.z);
        const segs=4;
        for(let s=1;s<=segs;s++){
          const f=s/segs;
          const pt=new THREE.Vector3(a.x+dx*f,a.y+dy*f-Math.sin(f*Math.PI)*0.5,a.z+dz*f);
          neonWirePts.push(prev.clone(),pt.clone());
          prev=pt;
        }
      }
    }
  }
}

function heightToNormal(heightCanvas,strength){
  const w=heightCanvas.width,h=heightCanvas.height;
  const hctx=heightCanvas.getContext('2d');
  const hdata=hctx.getImageData(0,0,w,h).data;
  const ncv=document.createElement('canvas');ncv.width=w;ncv.height=h;
  const nctx=ncv.getContext('2d');
  const nimg=nctx.createImageData(w,h);
  function hAt(x,y){x=Math.max(0,Math.min(w-1,x));y=Math.max(0,Math.min(h-1,y));return hdata[(y*w+x)*4]/255;}
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const l=hAt(x-1,y),r=hAt(x+1,y),u=hAt(x,y-1),d=hAt(x,y+1);
    let nx=(l-r)*strength,ny=(u-d)*strength,nz=1;
    const len=Math.sqrt(nx*nx+ny*ny+nz*nz);
    nx/=len;ny/=len;nz/=len;
    const idx=(y*w+x)*4;
    nimg.data[idx]=(nx*0.5+0.5)*255;
    nimg.data[idx+1]=(ny*0.5+0.5)*255;
    nimg.data[idx+2]=(nz*0.5+0.5)*255;
    nimg.data[idx+3]=255;
  }
  nctx.putImageData(nimg,0,0);
  const t=new THREE.CanvasTexture(ncv);
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return t;
}

// districts
const TOWER={x:-450,z:440};
function districtOf(cx,cz){
  if(Math.hypot(cx-TOWER.x,cz-TOWER.z)<85)return 'park';
  if(cx<-280&&cz<-140)return 'cbd';
  if(Math.hypot(cx+32,cz-64)<200)return 'neon';
  if(Math.random()<0.05)return 'park';
  if(cx>150&&cz<-40)return 'res';
  if(cz>300&&cx<-40)return 'res';
  return 'mixed';
}
const treeSpots=[];
function makePark(x0,x1,z0,z1){
  const w=x1-x0,d=z1-z0,cx=(x0+x1)/2,cz=(z0+z1)/2;
  const lawn=new THREE.Mesh(new THREE.PlaneGeometry(w,d),grassMat);
  lawn.rotation.x=-Math.PI/2;lawn.position.set(cx,0.028,cz);lawn.receiveShadow=true;scene.add(lawn);
  const p1=new THREE.Mesh(new THREE.PlaneGeometry(2.6,d),pathMat);
  p1.rotation.x=-Math.PI/2;p1.position.set(cx+(Math.random()-.5)*w*0.3,0.032,cz);scene.add(p1);
  const p2=new THREE.Mesh(new THREE.PlaneGeometry(w,2.6),pathMat);
  p2.rotation.x=-Math.PI/2;p2.position.set(cx,0.032,cz+(Math.random()-.5)*d*0.3);scene.add(p2);
  const n=Math.min(14,Math.floor(w*d/260));
  for(let k=0;k<n;k++)treeSpots.push([x0+2+Math.random()*(w-4),z0+2+Math.random()*(d-4)]);
}
const railBlocked=(za,zb)=>za<RAIL_Z+8&&zb>RAIL_Z-8;
for(let i=0;i<ROADS_X.length-1;i++)for(let j2=0;j2<ROADS_Z.length-1;j2++){
  const ra=ROADS_X[i],rb=ROADS_X[i+1],rc=ROADS_Z[j2],rd=ROADS_Z[j2+1];
  const x0=ra.p+ra.w/2+SW+1.2,x1=rb.p-rb.w/2-SW-1.2;
  const z0=rc.p+rc.w/2+SW+1.2,z1=rd.p-rd.w/2-SW-1.2;
  const bwT=x1-x0,bdT=z1-z0;
  if(bwT<12||bdT<12)continue;
  const cx=(x0+x1)/2,cz=(z0+z1)/2;
  if(cx>RIVER.x0-24&&cx<RIVER.x1+24)continue;
  const d=districtOf(cx,cz);
  if(d==='park'&&!railBlocked(z0,z1)){makePark(x0,x1,z0,z1);continue;}
  if(d==='cbd'&&!railBlocked(z0,z1)){
    const bw=Math.min(bwT-6,26+Math.random()*10),bd2=Math.min(bdT-6,26+Math.random()*10);
    spawnBuilding(cx,cz,bw,bd2,'glass');
    continue;
  }
  const cell=d==='res'?15:24;
  const nx=Math.max(1,Math.min(4,Math.round(bwT/cell)));
  const nz=Math.max(1,Math.min(4,Math.round(bdT/cell)));
  const lw=bwT/nx,ld=bdT/nz;
  for(let a=0;a<nx;a++)for(let b=0;b<nz;b++){
    if(Math.random()<(d==='res'?0.12:0.18))continue;
    const lcx=x0+lw*(a+0.5),lcz=z0+ld*(b+0.5);
    if(railBlocked(lcz-ld/2,lcz+ld/2))continue;
    const bw=lw-2.5-Math.random()*2,bd2=ld-2.5-Math.random()*2;
    if(bw<6||bd2<6)continue;
    let style=d;
    if(d==='mixed')style=Math.random()<0.08?'glass':(Math.random()<0.5?'neon':'mixed');
    spawnBuilding(lcx,lcz,bw,bd2,style==='cbd'?'mixed':style);
  }
}

// ---------- OUTER SKYLINE IMPOSTORS: cheap LOD blocks beyond the playable street grid, so the
// city dissolves into haze/distance instead of stopping at a visible hard edge. Single InstancedMesh
// (1 draw call) of unlit boxes with a baked lit-window texture — no collision, no gameplay effect
// (never added to `buildings`), positioned in an annulus between the real block field (~560) and
// the far skyline silhouette ring (1400), safely inside the ground plane (CITY=1150).
(function buildOuterSkylineImpostors(){
  const innerR=580,outerR=1060,count=340;
  const impostorTexA=tex((g,w,h)=>{
    g.fillStyle='#241d34';g.fillRect(0,0,w,h);
    for(let y=6;y<h;y+=9){for(let x=4;x<w;x+=7){
      if(Math.random()<0.4){
        g.fillStyle=Math.random()<0.6?'rgba(255,205,150,.55)':(Math.random()<0.6?'rgba(160,210,255,.5)':'rgba(255,150,220,.45)');
        g.fillRect(x,y,2,2.4);
      }
    }}
  },48,128,true);
  const impostorTexB=tex((g,w,h)=>{
    g.fillStyle='#1e1a2c';g.fillRect(0,0,w,h);
    for(let y=6;y<h;y+=8){for(let x=4;x<w;x+=6){
      if(Math.random()<0.3){
        g.fillStyle=Math.random()<0.5?'rgba(255,190,130,.5)':'rgba(150,220,255,.45)';
        g.fillRect(x,y,1.6,2);
      }
    }}
  },48,128,true);
  const geo=new THREE.BoxGeometry(1,1,1);
  const matA=new THREE.MeshBasicMaterial({map:impostorTexA});
  const matB=new THREE.MeshBasicMaterial({map:impostorTexB});
  const mA=new THREE.InstancedMesh(geo,matA,Math.ceil(count/2));
  const mB=new THREE.InstancedMesh(geo,matB,Math.floor(count/2));
  mA.frustumCulled=false;mB.frustumCulled=false;
  const dummy=new THREE.Object3D();
  let ia=0,ib=0,tries=0;
  while(ia+ib<count&&tries<count*4){
    tries++;
    const ang=Math.random()*Math.PI*2;
    const rad=innerR+Math.random()*(outerR-innerR);
    const x=Math.cos(ang)*rad,z=Math.sin(ang)*rad;
    if(x>RIVER.x0-30&&x<RIVER.x1+30)continue; // keep the river channel clear
    const h=18+Math.random()*150,w=12+Math.random()*22,d=12+Math.random()*22;
    dummy.position.set(x,h/2,z);dummy.rotation.y=Math.random()*Math.PI;dummy.scale.set(w,h,d);dummy.updateMatrix();
    if(Math.random()<0.5&&ia<mA.count){mA.setMatrixAt(ia++,dummy.matrix);}
    else if(ib<mB.count){mB.setMatrixAt(ib++,dummy.matrix);}
    else if(ia<mA.count){mA.setMatrixAt(ia++,dummy.matrix);}
  }
  mA.count=ia;mB.count=ib;
  mA.instanceMatrix.needsUpdate=true;mB.instanceMatrix.needsUpdate=true;
  scene.add(mA,mB);
  // a little extra light-pollution haze right at the transition band so blocks fade rather than cut off
  for(let i=0;i<14;i++){
    const ang=Math.random()*Math.PI*2,rad=520+Math.random()*420;

    m.position.set(Math.cos(ang)*rad,14+Math.random()*54,Math.sin(ang)*rad);
    scene.add(m);groundHaze.push(m);
  }
})();

function wireRun(axis,fixedCoord){
  const poles=[];
  for(let a=-560;a<=560;a+=46){
    const px=axis==='x'?a:fixedCoord, pz=axis==='x'?fixedCoord:a;
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,11,6),poleMat);

  for(let i2=0;i2<poles.length-1;i2++){
    for(const wOff of[-0.9,0,0.9]){
      const pts=[];
      for(let t2=0;t2<=8;t2++){

    }
  }
}

// Build both tint variants ONCE from the template's original materials (shared across all
// clones — cheap & consistent; clones from SkeletonUtils keep references to these originals).
function buildHumanoidMaterialVariants(root){
  zombieMatVariants=new Map();
  survivorMatVariants=new Map();
  const seen=new Set();
  root.traverse(o=>{
    if(!o.isMesh||!o.material)return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(mat=>{
      if(seen.has(mat))return;
      seen.add(mat);
      const isVisor=/visor/i.test(mat.name||'');
      // zombie: desaturated sickly grey-green, roughened; visor gets a faint red undead glow
      const zMat=mat.clone();
      if(zMat.color)zMat.color.setRGB(0.30,0.44,0.24); // visible sickly green (was multiplying dark camo → near-black)
      if('roughness' in zMat)zMat.roughness=0.9;
      if('metalness' in zMat)zMat.metalness=0.05;
      if(!zMat.emissive)zMat.emissive=new THREE.Color(0,0,0);
      // visor = red undead eyes; body = faint green self-glow so the zombie reads in the dark scene
      zMat.emissive.setRGB(isVisor?0.6:0.06, isVisor?0.03:0.13, isVisor?0.03:0.05);
      zMat.emissiveIntensity=isVisor?1.0:0.55;
      zMat.needsUpdate=true;
      zombieMatVariants.set(mat,zMat);
      // survivor: keep the original texture/colors, just a hair warmer — reads as a normal person
      const sMat=mat.clone();
      if(sMat.color)sMat.color.multiply(new THREE.Color(1.0,0.98,0.95));
      sMat.needsUpdate=true;
      survivorMatVariants.set(mat,sMat);
    });
  });
}
function applyHumanoidMaterialVariant(root,variantMap){
  root.traverse(o=>{
    if(!o.isMesh||!o.material)return;
    if(Array.isArray(o.material))o.material=o.material.map(m=>variantMap.get(m)||m);
    else o.material=variantMap.get(o.material)||o.material;
    o.castShadow=true;
    o.receiveShadow=false;
  });
}

function initHumanoidModel(){
  try{
    if(!window.__ZOMBIE_GLB||!THREE.GLTFLoader||!THREE.SkeletonUtils)return;
    const b64=window.__ZOMBIE_GLB;
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    new THREE.GLTFLoader().parse(bytes.buffer,'',gltf=>{
      humanoidTemplate=gltf.scene;
      humanoidAnimClips=gltf.animations||[];
      zombieWalkClip=humanoidAnimClips.find(c=>/^walk$/i.test(c.name))||humanoidAnimClips.find(c=>/walk/i.test(c.name))||null;
      survivorIdleClip=humanoidAnimClips.find(c=>/idle/i.test(c.name))||null;
      buildHumanoidMaterialVariants(humanoidTemplate);
      const box=new THREE.Box3().setFromObject(humanoidTemplate);
      humanoidNaturalHeight=Math.max(0.001,box.max.y-box.min.y);
      humanoidModelReady=true;
    },err=>{console.warn('humanoid GLB parse failed',err);});
  }catch(e){console.warn('humanoid model init failed',e);}
}

    scene.add(s);
  }
  // flying debris chunks (gravity + ground bounce)
  spawnDebris(pos,napalm?12:7,napalm?20:15);
  // napalm: bigger, longer-burning residual ground fire (secondary fire)
  if(napalm){
    for(let i=0;i<4;i++){
      const s=new THREE.Sprite(new THREE.SpriteMaterial({map:fireTex,color:0xffffff,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));

  for(let g=0;g<=TAC;g+=14){tacC.beginPath();tacC.moveTo(g,0);tacC.lineTo(g,TAC);tacC.stroke();tacC.beginPath();tacC.moveTo(0,g);tacC.lineTo(TAC,g);tacC.stroke();}
  // north-up map: rotate world by yaw so heli icon always points up

    tacC.lineWidth=r.major?2:1;tacC.beginPath();tacC.moveTo(-TAC,dz);tacC.lineTo(TAC,dz);tacC.stroke();
  });
  laneRoads.x.concat(ROADS_X.filter(r=>r.major)).forEach(r=>{
    const dx=(r.p-heli.position.x)*scale;if(Math.abs(dx)>TAC)return;
    tacC.lineWidth=r.major?2:1;tacC.beginPath();tacC.moveTo(dx,-TAC);tacC.lineTo(dx,TAC);tacC.stroke();
  });
  // river band

  });
  // objective
  if(hostage){
    const dx=(hostage.pos.x-heli.position.x)*scale,dz=(hostage.pos.z-heli.position.z)*scale;

  }
  tacC.restore();
  // heli icon (always up)
  tacC.save();tacC.translate(TAC/2,TAC/2);

  tacC.restore();
  // range rings + N marker
  tacC.strokeStyle=HUD_DIM;tacC.lineWidth=1;

// --- vertical measuring tape (airspeed / altitude) ---
function tape(cx,cy,h,val,step,unit,side,warnLow){
  const x=hudX;
  x.save();x.beginPath();x.rect(cx-30,cy-h/2,60,h);x.clip();
  x.strokeStyle=HUD_DIM;x.fillStyle=HUD_G;x.font='10px monospace';
  x.textAlign=side==='L'?'right':'left';
  const pxPer=h/(step*5); // show ~5 steps across the tape
  const base=Math.round(val/step)*step;
  for(let k=-4;k<=4;k++){
    const tv=base+k*step;if(tv<0)continue;
    const y=cy+(val-tv)*pxPer;
    const major=tv%(step*5)===0;
    x.strokeStyle=major?HUD_DIM:HUD_FAINT;x.lineWidth=1;
    x.beginPath();
    if(side==='L'){x.moveTo(cx+30,y);x.lineTo(cx+30-(major?14:8),y);}
    else{x.moveTo(cx-30,y);x.lineTo(cx-30+(major?14:8),y);}
    x.stroke();
    if(major){x.fillStyle=HUD_DIM;x.fillText(tv,side==='L'?cx+12:cx-12,y+3.5);}
  }
  x.restore();
  // current-value box + caret
  x.strokeStyle=HUD_G;x.lineWidth=1.4;
  const bw=46,bh=17,by=cy-bh/2;
  const bx=side==='L'?cx-30:cx-16;
  x.fillStyle='rgba(3,14,7,.82)';x.fillRect(bx,by,bw,bh);
  x.strokeRect(bx,by,bw,bh);
  const caret=side==='L'?bx+bw:bx;
  x.beginPath();x.moveTo(caret,cy);x.lineTo(caret+(side==='L'?7:-7),cy-5);x.lineTo(caret+(side==='L'?7:-7),cy+5);x.closePath();
  x.fillStyle='rgba(3,14,7,.82)';x.fill();x.stroke();
  x.fillStyle=(warnLow&&val<warnLow)?HUD_AMBER:'#eaffea';x.font='bold 13px monospace';x.textAlign='center';
  x.fillText(String(Math.round(val)).padStart(3,'0'),bx+bw/2,cy+4.5);
  x.fillStyle=HUD_DIM;x.font='8px monospace';x.textAlign='center';x.fillText(unit,cx,cy-h/2-5);
}

// --- heading tape (top) ---
function headingTape(cx,y,w,hdg){
  const x=hudX;
  x.save();x.beginPath();x.rect(cx-w/2,y-2,w,28);x.clip();
  const pxPer=w/90; // ±45° visible
  x.font='10px monospace';x.textAlign='center';
  for(let d=-60;d<=60;d+=5){
    const hv=((Math.round(hdg/5)*5+d)%360+360)%360;
    const sx=cx+(d-(hdg-Math.round(hdg/5)*5))*pxPer;
    const major=hv%15===0;
    x.strokeStyle=major?HUD_DIM:HUD_FAINT;x.lineWidth=1;
    x.beginPath();x.moveTo(sx,y+16);x.lineTo(sx,y+16-(major?9:5));x.stroke();
    if(major){
      const lbl=hv===0?'N':hv===90?'E':hv===180?'S':hv===270?'W':String(hv/10|0).padStart(2,'0');
      x.fillStyle=HUD_DIM;x.fillText(lbl,sx,y+8);
    }
  }
  x.restore();
  // center caret + heading readout
  x.fillStyle=HUD_G;x.beginPath();x.moveTo(cx,y+17);x.lineTo(cx-5,y+24);x.lineTo(cx+5,y+24);x.closePath();x.fill();
  x.strokeStyle=HUD_G;x.lineWidth=1.3;x.fillStyle='rgba(3,14,7,.82)';
  x.fillRect(cx-20,y-16,40,15);x.strokeRect(cx-20,y-16,40,15);
  x.fillStyle='#eaffea';x.font='bold 12px monospace';x.textAlign='center';
  x.fillText(String(Math.round(hdg)).padStart(3,'0'),cx,y-4);
}

  hudX.fillStyle=thr<0.15?'#ff6a6a':'#5fff8f';hudX.fillRect(tgx+1,tgy+1,(tgw-2)*Math.max(0,Math.min(1,thr)),tgh-2);

  hudX.textAlign='right';hudX.fillText(thr<0.15?'HOVER':(Math.round(thr*100)+'%'),tgx+tgw,tgy+tgh+9);

  // ---- target lock box ----
  const LK=window.__lock;
  if(LK&&LK.target&&LK.target.hp>0){
    const tp=LK.target.m.position.clone();tp.y+=LK.target.big?4:2;
    const sp=project(tp);
    if(sp.on){
      const locked=LK.t>0.4;const col=locked?HUD_RED:HUD_AMBER;
      const sz=locked?24:30-Math.min(6,LK.t*15);
      hudX.strokeStyle=col;hudX.lineWidth=1.6;
      if(locked){
        // corner brackets
        const c=8;
        [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([ux,uy])=>{
          hudX.beginPath();
          hudX.moveTo(sp.x+ux*sz, sp.y+uy*sz-uy*c);hudX.lineTo(sp.x+ux*sz, sp.y+uy*sz);hudX.lineTo(sp.x+ux*sz-ux*c, sp.y+uy*sz);
          hudX.stroke();
        });
        hudX.fillStyle=col;hudX.font='bold 10px monospace';hudX.textAlign='center';
        if((now/120|0)%2)hudX.fillText('● LOCKED — FIRE',sp.x,sp.y+sz+13);
      }else{
        hudX.save();hudX.translate(sp.x,sp.y);hudX.rotate(now/500);
        hudX.strokeRect(-sz/2,-sz/2,sz,sz);hudX.restore();
        hudX.fillStyle=col;hudX.font='9px monospace';hudX.textAlign='center';
        hudX.fillText('ACQUIRING',sp.x,sp.y+sz+2);
      }
    }
  }

  // ---- projected objective marker in the world ----
  if(hostage){
    const hp2=hostage.pos.clone();hp2.y+=hostage.rooftop?2:6;
    const sp=project(hp2);
    const dHoriz=Math.hypot(heli.position.x-hostage.pos.x,heli.position.z-hostage.pos.z);
    const col=hostage.state==='pad'?HUD_CYAN:'#3fffa0';
    if(sp.on){
      hudX.strokeStyle=col;hudX.fillStyle=col;hudX.lineWidth=1.4;
      hudX.beginPath();hudX.moveTo(sp.x,sp.y-9);hudX.lineTo(sp.x+8,sp.y);hudX.lineTo(sp.x,sp.y+9);hudX.lineTo(sp.x-8,sp.y);hudX.closePath();hudX.stroke();
      hudX.font='10px monospace';hudX.textAlign='center';
      hudX.fillText((hostage.state==='pad'?'LZ ':'SURVIVOR ')+Math.round(dHoriz)+'m',sp.x,sp.y-14);
    }else{
      // off-screen chevron toward objective
      const ang=Math.atan2(sp.y-cy,sp.x-cx)+(_pv.z>1?Math.PI:0);
      const ex=cx+Math.cos(ang)*Math.min(w,h)*0.32,ey=cy+Math.sin(ang)*Math.min(w,h)*0.32;
      hudX.save();hudX.translate(ex,ey);hudX.rotate(ang);
      hudX.fillStyle=col;hudX.beginPath();hudX.moveTo(10,0);hudX.lineTo(-6,-7);hudX.lineTo(-6,7);hudX.closePath();hudX.fill();hudX.restore();
      hudX.fillStyle=col;hudX.font='10px monospace';hudX.textAlign='center';
      hudX.fillText(Math.round(dHoriz)+'m',ex,ey-12);
    }
  }

  // ---- threat warning ----
  const threat=zombies.some(z=>z.m.position.distanceTo(heli.position)<30);
  if(threat&&(now/220|0)%2){
    hudX.fillStyle=HUD_RED;hudX.font='bold 13px monospace';hudX.textAlign='center';
    hudX.fillText('⚠ HOSTILES CLOSE',cx,h*0.62);
  }
  if(hp<30&&hp>0&&(now/200|0)%2){
    hudX.fillStyle=HUD_RED;hudX.font='bold 12px monospace';hudX.textAlign='center';
    hudX.fillText('◆ HULL CRITICAL ◆',cx,h*0.66);
  }
  // TSD label under tac map already in DOM; draw its radar frame glow via CSS
  drawTacMap(now);
}

document.getElementById('startBtn').addEventListener('pointerdown',e=>{e.preventDefault();startRun();});
loadMeta();
let last=performance.now(),screenT=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,0.05);last=now;
  if(!gameOver){
    let turn=0,climb=0;
    if(keys['ArrowLeft']||keys['KeyA'])turn+=1;
    if(keys['ArrowRight']||keys['KeyD'])turn-=1;
    if(keys['ArrowUp']||keys['KeyW'])climb+=1;
    if(keys['ArrowDown']||keys['KeyS'])climb-=1;
    turn+=-stick.dx;climb+=-stick.dy;
    turn=Math.max(-1,Math.min(1,turn));climb=Math.max(-1,Math.min(1,climb));
    yaw+=turn*1.5*dt;
    const targetV=climb*(climb<0?30:22);
    vSpeed=THREE.MathUtils.lerp(vSpeed,targetV,(climb<0?9:5)*dt);
    if(window.__throttleTarget===undefined)window.__throttleTarget=1;
    if(window.__throttle===undefined)window.__throttle=1;
    window.__throttle=THREE.MathUtils.lerp(window.__throttle,window.__throttleTarget,1.6*dt);
    const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    heli.position.add(fwd.clone().multiplyScalar(CRUISE*window.__throttle*dt));
    heli.position.y=Math.max(3,Math.min(180,heli.position.y+vSpeed*dt));
    if(window.__forceLowAlt){heli.position.y=6;vSpeed=0;} // TEMP DEBUG - remove before final
    heli.position.x=Math.max(-620,Math.min(620,heli.position.x));
    heli.position.z=Math.max(-620,Math.min(620,heli.position.z));
    // altitude-based fade for tiny bright emitters (neon-sign glow, warm sidewalk spill, billboard glow):
    // full strength near the street, damped when zoomed out from height so they stop sub-pixel twinkling
    const __altFade=THREE.MathUtils.clamp(1-(heli.position.y-55)/110,0.22,1);
    pitch=THREE.MathUtils.lerp(pitch,0.1-climb*0.12,3*dt);
    roll=THREE.MathUtils.lerp(roll,turn*0.35,3*dt);
    heli.rotation.set(0,yaw,0);heli.rotateX(pitch);heli.rotateZ(roll);
    rotor.rotation.y+=30*dt;tailRotor.rotation.x+=42*dt;disc.rotation.z+=30*dt;
    strobe.visible=(now%1000)<80;
    buildings.forEach(b=>{
      const p=heli.position,bp=b.m.position;
      if(Math.abs(p.x-bp.x)<b.w/2+2.5&&Math.abs(p.z-bp.z)<b.d/2+2.5&&p.y<b.h+2){
        hp-=8;shake=Math.min(1,shake+.6);
        const push=new THREE.Vector3(p.x-bp.x,0,p.z-bp.z).normalize().multiplyScalar(4);
        heli.position.add(push);heli.position.y=Math.min(180,b.h+4);
        flashMsg('COLLISION!','#f66');sfx(0.4,0.35,200);
      }
    });
    // hostage pickup / delivery check
    if(hostage){
      const dHoriz=Math.hypot(heli.position.x-hostage.pos.x,heli.position.z-hostage.pos.z);
      if(dHoriz<14&&heli.position.y<hostage.pos.y+10)rescueHostage();
    }
    if(hostage&&hostage.state==='pad'){
      missionTimer=Math.max(0,missionTimer-dt);
      missionLine='MISSION '+missionLevel+' — DELIVER '+Math.ceil(missionTimer)+'s'+(missionTimer<=0?' (NO BONUS)':'');
    }else{
      missionLine='MISSION '+missionLevel+' — RESCUE HOSTAGE';
    }
    for(let i=0;i<4;i++)cd[i]-=dt;
    if(keys['Space']||fireHeld)fire();
    muzzleT-=dt;muzzleL.intensity=muzzleT>0?4:0;
    muzzleL.position.copy(heli.position).add(new THREE.Vector3(0,0,-4).applyQuaternion(heli.quaternion));
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      if(b.grav)b.v.y-=22*dt;
      if(b.type===2&&b.tg&&b.tg.hp>0){
        const want=b.tg.m.position.clone().add(new THREE.Vector3(0,2,0)).sub(b.m.position).normalize().multiplyScalar(100);
        b.v.lerp(want,2.8*dt);
        b.m.lookAt(b.m.position.clone().add(b.v));b.m.rotateX(Math.PI/2);
      }
      b.m.position.add(b.v.clone().multiplyScalar(dt));
      b.t-=dt;
      if(b.type===1||b.type===2){
        b.trailT=(b.trailT||0)-dt;
        if(b.trailT<=0){
          b.trailT=0.045;
          const s=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,transparent:true,opacity:.55,depthWrite:false}));
          const sc=0.9+Math.random()*0.6;
          s.scale.set(sc,sc,1);
          s.position.copy(b.m.position).add(new THREE.Vector3((Math.random()-.5)*.4,(Math.random()-.5)*.4,(Math.random()-.5)*.4));
          pushFX({m:s,v:new THREE.Vector3((Math.random()-.5)*1.2,0.8+Math.random()*0.8,(Math.random()-.5)*1.2),t:0.8+Math.random()*0.5,smoke:true});
          scene.add(s);
        }
      }
      let hit=b.m.position.y<=0.2;
      if(!hit)for(const z of zombies){
        if(z.hp>0&&b.m.position.distanceTo(z.m.position.clone().setY(b.m.position.y))<(z.big?3.8:1.8)&&b.m.position.y<(z.big?8:4)){hit=true;break;}
      }
      if(!hit)for(const bd of buildings){
        if(Math.abs(b.m.position.x-bd.m.position.x)<bd.w/2&&Math.abs(b.m.position.z-bd.m.position.z)<bd.d/2&&b.m.position.y<bd.h){hit=true;break;}
      }
      if(hit||b.t<=0){
        if(b.type===0){
          zombies.forEach(z=>{if(z.m.position.distanceTo(b.m.position)<b.r+(z.big?2.5:0)){z.hp-=b.dmg;blood(z.m.position);}});
        }else explode(b.m.position,b.r,b.dmg,b.type===3);
        scene.remove(b.m);bullets.splice(i,1);
      }
    }
    for(let i=zombies.length-1;i>=0;i--){
      const z=zombies[i];
      if(z.hp<=0){
        blood(z.m.position);
        scene.remove(z.m);zombies.splice(i,1);
        kills++;bumpStreak();
        addScore(z.big?500:100);
        continue;
      }
      if(z.mixer)z.mixer.update(dt);
      const to=heli.position.clone().setY(0).sub(z.m.position.clone().setY(0));
      const d=to.length();to.normalize();
      z.ph+=dt*8;
      if(z.leap>0){
        z.leap-=dt;
        z.m.position.y+=z.vy*dt;z.vy-=30*dt;
        z.m.position.add(to.multiplyScalar(z.spd*3*dt));
        if(z.m.position.y<=0){z.m.position.y=0;z.leap=0;}
        if(z.m.position.distanceTo(heli.position)<(z.big?6.5:3.8)){

        }
      }else{
        z.m.position.add(to.multiplyScalar(z.spd*dt));
        z.m.position.y=Math.abs(Math.sin(z.ph))*.25;
        z.m.rotation.y=Math.atan2(to.x,to.z);
        z.m.rotation.z=Math.sin(z.ph*.7)*.08;
        if(d<15&&heli.position.y<(z.big?28:15)&&Math.random()<0.02){

    {
      if(!window.__lock)window.__lock={target:null,t:0};

      let candidate=activeMissile?activeMissile.tg:null;
      if(!candidate){
        const lfwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
        let best=null,bestScore=-1;
        zombies.forEach(z=>{
          if(z.hp<=0)return;
          const to=z.m.position.clone().sub(heli.position);
          const dist=to.length();
          if(dist>260)return;
          to.normalize();
          const dot=lfwd.dot(to);
          if(dot>0.35){const score=dot-dist*0.001;if(score>bestScore){bestScore=score;best=z;}}
        });
        candidate=best;
      }
      if(candidate!==LK.target){LK.target=candidate;LK.t=0;if(candidate)sfx(0.05,0.12,0,2200);}
      if(LK.target)LK.t+=dt;else LK.t=0;
    }
    if(zombies.length===0&&now-waveSpawned>8000){wave++;waveSpawned=now;startWave();}
    const vgEl=document.getElementById('vignette');
    if(hp<30&&hp>0){
      const pulse=0.35+0.25*Math.sin(now/220);
      vgEl.style.background=`radial-gradient(ellipse at center, transparent 40%, rgba(180,20,20,${pulse}) 100%)`;
      cautionLight.material.color.setHex(Math.sin(now/150)>0?0xff2222:0x220000);
      if(!window.__lastCaution||now-window.__lastCaution>1100){window.__lastCaution=now;sfx(0.18,0.25,1400,1800);}
    }else{
      vgEl.style.background='radial-gradient(ellipse at center, transparent 50%, rgba(6,4,18,.55) 100%)';
      cautionLight.material.color.setHex(0x220000);
    }
    if(hp<=0){endRun();}
    // streak decay
    if(streakT>0){streakT-=dt;if(streakT<=0){streak=0;mult=1;comboEl.style.opacity=0;}}
    for(let i=explosions.length-1;i>=0;i--){
      const e=explosions[i];
      e.m.position.add(e.v.clone().multiplyScalar(dt));
      if(e.ember){e.v.y-=22*dt;}
      else if(e.fire){e.v.multiplyScalar(1-3*dt);e.v.y+=2*dt;}
      else if(e.smoke){e.v.multiplyScalar(1-1.2*dt);e.v.y+=1*dt;}
      else if(e.core){e.v.multiplyScalar(1-5*dt);}
      else if(e.muzzle){e.v.multiplyScalar(1-6*dt);}
      e.t-=dt;
      const life=Math.max(0,e.t);
      if(e.fire){
        const frac=e.lifeMax?Math.max(0,Math.min(1,life/e.lifeMax)):life;
        e.m.material.opacity=Math.min(1,life*(e.residual?1.2:3));
        e.m.material.color.lerpColors(_fireColRed,_fireColHot,frac);
      }
      else if(e.smoke)e.m.material.opacity=Math.min(.85,life*0.55);
      else if(e.core)e.m.material.opacity=Math.min(1,life*7);
      else if(e.muzzle)e.m.material.opacity=Math.min(1,life*9);
      else e.m.material.opacity=Math.min(1,life*2);
      const growRate=e.fire?(e.residual?0.6:2.6):e.smoke?1.15:e.core?4.5:e.muzzle?-1:0.3;
      e.m.scale.multiplyScalar(1+growRate*dt);
      if(e.t<=0){scene.remove(e.m);explosions.splice(i,1);}
    }
    for(let i=debris.length-1;i>=0;i--){
      const d=debris[i];
      d.v.y-=28*dt;
      d.m.position.add(d.v.clone().multiplyScalar(dt));
      d.m.rotation.x+=d.av.x*dt;d.m.rotation.y+=d.av.y*dt;d.m.rotation.z+=d.av.z*dt;
      if(d.m.position.y<0.2){
        if(d.bounced<2){d.m.position.y=0.2;d.v.y*=-0.35;d.v.x*=0.6;d.v.z*=0.6;d.bounced++;}
        else{d.m.position.y=0.2;d.v.set(0,0,0);}
      }
      d.t-=dt;
      if(d.t<=0){scene.remove(d.m);debris.splice(i,1);}
    }
    shake=Math.max(0,shake-2.5*dt);
    pulseSigns.forEach(s=>{
      s.ph+=dt*(s.fast?14:3);

      s.g.material.opacity=0.05*v*__altFade;

    warmGlowMat.opacity=__altFade;

    screenT+=dt;
    if(screenT>0.5){bigScreens.forEach(bs=>bs.draw(now/1600));screenT=0;}
    if(window.__beacon)window.__beacon.visible=(now%1400)<800;
    // rescued survivors celebrate independently of `hostage` (spawnPad reassigns it to the LZ pad)
    for(let ci=celebratingSurvivors.length-1;ci>=0;ci--){
      const sv=celebratingSurvivors[ci];
      if(sv.mixer)sv.mixer.update(dt);
      sv.celebT+=dt;
      const hopDur=0.35,hops=3,totalDur=hopDur*hops;
      sv.model.position.y=Math.max(0,Math.sin((Math.min(sv.celebT,totalDur)/hopDur)*Math.PI))*0.55;
      if(sv.waveBone&&sv.waveBaseQuat)sv.waveBone.quaternion.copy(sv.waveBaseQuat).multiply(CELEBRATE_ARM_OFFSET);
      if(sv.leftArmBone&&sv.leftArmBaseQuat)sv.leftArmBone.quaternion.copy(sv.leftArmBaseQuat).multiply(CELEBRATE_ARM_OFFSET_L);
      if(sv.celebT>totalDur+0.6)celebratingSurvivors.splice(ci,1);
    }
    if(hostage){
      const sv=hostage.survivor;
      if(sv){
        if(sv.mixer)sv.mixer.update(dt);
        if(sv.celebrating){
          sv.celebT+=dt;
          const hopDur=0.35,hops=3,totalDur=hopDur*hops;
          const tt=Math.min(sv.celebT,totalDur);
          sv.model.position.y=Math.max(0,Math.sin((tt/hopDur)*Math.PI))*0.55;
          if(sv.waveBone&&sv.waveBaseQuat)sv.waveBone.quaternion.copy(sv.waveBaseQuat).multiply(CELEBRATE_ARM_OFFSET);
          if(sv.leftArmBone&&sv.leftArmBaseQuat)sv.leftArmBone.quaternion.copy(sv.leftArmBaseQuat).multiply(CELEBRATE_ARM_OFFSET_L);
        }else if(hostage.state==='seek'&&sv.waveBone&&sv.waveBaseQuat){
          const wag=Math.sin(now/240)*0.3;
          sv.waveBone.quaternion.copy(sv.waveBaseQuat).multiply(WAVE_ARM_BASE_OFFSET).multiply(new THREE.Quaternion().setFromAxisAngle(WAVE_AXIS,wag));
        }
      }else{
        hostage.arm.rotation.z=-0.6+Math.sin(now/200)*0.35;
        hostage.arm2.rotation.z=0.3+Math.sin(now/220+1)*0.2;
      }
      const rs=1+Math.sin(now/300)*0.08;
      hostage.ring.scale.set(rs,rs,1);
      hostage.marker.position.y=4+Math.sin(now/300)*0.3;
      hostage.beam.material.opacity=0.1+0.08*Math.sin(now/260);
    }
    clouds.forEach(cl=>{cl.position.x+=2*dt;if(cl.position.x>1400)cl.position.x=-1400;cl.lookAt(cam.position);});
    groundHaze.forEach(gh=>{gh.position.x+=1.1*dt;if(gh.position.x>1400)gh.position.x=-1400;gh.lookAt(cam.position);});
    // rain fall + wrap
    const rp=rainGeo.attributes.position.array;
    for(let i=0;i<rainCount;i++){
      rp[i*6+1]-=95*dt;rp[i*6+4]-=95*dt;
      if(rp[i*6+1]<0){
        const x=heli.position.x+(Math.random()-.5)*500,z=heli.position.z+(Math.random()-.5)*500;
        rp[i*6]=x;rp[i*6+1]=220;rp[i*6+2]=z;
        rp[i*6+3]=x+0.4;rp[i*6+4]=217.4;rp[i*6+5]=z;
      }
    }
    rainGeo.attributes.position.needsUpdate=true;
    if(window.__train){
      const T=window.__train;
      const t=(now/1000*T.speed)%2400-1200;
      T.cars.forEach((c,i)=>{c.position.x=t-i*T.spacing;});
    }
    if(!window.__movingCars){
      window.__movingCars=[];
      const mcCols=[0xb03030,0x3050a0,0xd8d8d8,0x222428,0xc8a030,0x2a6a4a];
      // three traced sports-car profiles
      function profile911(){
        const s=new THREE.Shape();
        s.moveTo(-2.35,0.28);
        s.quadraticCurveTo(-2.4,0.5,-2.15,0.56);
        s.quadraticCurveTo(-1.95,0.6,-1.75,0.72);
        s.quadraticCurveTo(-1.5,0.82,-1.15,0.84);
        s.lineTo(-0.85,0.86);
        s.quadraticCurveTo(-0.55,0.88,-0.25,1.18);
        s.quadraticCurveTo(0.15,1.34,0.55,1.33);
        s.quadraticCurveTo(1.15,1.3,1.7,0.92);
        s.quadraticCurveTo(2.15,0.66,2.4,0.64);
        s.quadraticCurveTo(2.55,0.62,2.5,0.42);
        s.lineTo(2.45,0.24);s.lineTo(1.45,0.24);
        s.quadraticCurveTo(1.45,0.74,1.0,0.74);
        s.quadraticCurveTo(0.55,0.74,0.55,0.24);
        s.lineTo(-0.85,0.24);
        s.quadraticCurveTo(-0.85,0.74,-1.3,0.74);
        s.quadraticCurveTo(-1.75,0.74,-1.75,0.24);
        s.lineTo(-2.3,0.24);s.lineTo(-2.35,0.28);
        return s;
      }
      // angular fastback coupe-SUV (image 1)
      function profileAngular(){
        const s=new THREE.Shape();
        s.moveTo(-2.5,0.34);
        s.lineTo(-2.45,0.62);                          // sharp low nose
        s.lineTo(-2.1,0.78);
        s.lineTo(-1.7,0.86);                           // hood rise
        s.lineTo(-1.0,0.92);
        s.lineTo(-0.55,1.28);                          // A-pillar (angular)
        s.lineTo(0.35,1.42);                           // flat roof
        s.lineTo(1.05,1.4);
        s.lineTo(1.95,1.0);                            // fastback (straight)
        s.lineTo(2.45,0.86);
        s.lineTo(2.55,0.66);                           // rear spoiler lip
        s.lineTo(2.5,0.34);
        s.lineTo(1.5,0.34);
        s.quadraticCurveTo(1.5,0.82,1.05,0.82);        // rear arch
        s.quadraticCurveTo(0.6,0.82,0.6,0.34);
        s.lineTo(-0.95,0.34);
        s.quadraticCurveTo(-0.95,0.82,-1.4,0.82);      // front arch
        s.quadraticCurveTo(-1.85,0.82,-1.85,0.34);
        s.lineTo(-2.45,0.34);s.lineTo(-2.5,0.34);
        return s;
      }
      // Supra with rear wing (image 2)
      function profileSupra(){
        const s=new THREE.Shape();
        s.moveTo(-2.45,0.3);
        s.quadraticCurveTo(-2.5,0.52,-2.2,0.58);
        s.quadraticCurveTo(-1.9,0.66,-1.55,0.74);
        s.lineTo(-1.0,0.8);
        s.quadraticCurveTo(-0.5,0.82,-0.15,1.16);      // windshield
        s.quadraticCurveTo(0.3,1.32,0.75,1.28);        // rounded roof
        s.quadraticCurveTo(1.35,1.22,1.75,0.86);       // fastback
        s.lineTo(2.05,0.78);
        s.lineTo(2.05,1.12);                           // wing upright
        s.lineTo(2.5,1.16);                            // rear wing
        s.lineTo(2.5,1.0);
        s.lineTo(2.2,0.98);
        s.lineTo(2.2,0.72);
        s.quadraticCurveTo(2.45,0.68,2.42,0.44);       // tail
        s.lineTo(2.38,0.26);s.lineTo(1.4,0.26);
        s.quadraticCurveTo(1.4,0.76,0.95,0.76);
        s.quadraticCurveTo(0.5,0.76,0.5,0.26);
        s.lineTo(-0.9,0.26);
        s.quadraticCurveTo(-0.9,0.76,-1.35,0.76);
        s.quadraticCurveTo(-1.8,0.76,-1.8,0.26);
        s.lineTo(-2.4,0.26);s.lineTo(-2.45,0.3);
        return s;
      }
      const carGeos=[];
      [profile911,profileAngular,profileSupra].forEach(fn=>{
        try{
          const geo=new THREE.ExtrudeGeometry(fn(),{depth:1.7,bevelEnabled:true,bevelThickness:0.08,bevelSize:0.08,bevelSegments:2});
          geo.translate(0,0,-0.85);carGeos.push(geo);
        }catch(err){console.warn('car profile failed',err);}
      });
      if(carGeos.length===0){
        const fb=new THREE.BoxGeometry(4.6,0.9,1.7);carGeos.push(fb);
      }
      const glassGeo=new THREE.BoxGeometry(1.15,0.4,1.45);
      const mcWheelG=new THREE.CylinderGeometry(0.46,0.46,0.34,14);
      const mcWheelM=new THREE.MeshLambertMaterial({color:0x0c0c0c});
      const hubM=new THREE.MeshLambertMaterial({color:0x999aa2});
      for(let i=0;i<52;i++){
        const car=new THREE.Group();
        const c=mcCols[i%mcCols.length];
        const gi=Math.floor(Math.random()*carGeos.length);
        const bodyMesh=new THREE.Mesh(carGeos[gi],new THREE.MeshPhysicalMaterial({color:c,metalness:0.6,roughness:0.28,envMapIntensity:1.0,clearcoat:0.5,clearcoatRoughness:0.15}));
        bodyMesh.rotation.y=Math.PI/2;car.add(bodyMesh);
        const glass=new THREE.Mesh(glassGeo,new THREE.MeshStandardMaterial({color:0x0a1420,metalness:0.3,roughness:0.1,envMapIntensity:1.3,transparent:true,opacity:.72}));
        glass.position.set(0,1.12,0.15);car.add(glass);
        [[-1.3,-0.85],[-1.3,0.85],[1.0,-0.85],[1.0,0.85]].forEach(([z,x])=>{
          const wh=new THREE.Mesh(mcWheelG,mcWheelM);wh.rotation.x=Math.PI/2;wh.position.set(x,0.46,z);car.add(wh);
          const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.36,12),hubM);hub.rotation.x=Math.PI/2;hub.position.set(x,0.46,z);car.add(hub);
        });
        const hl=new THREE.Mesh(new THREE.BoxGeometry(1.4,.14,.08),new THREE.MeshBasicMaterial({color:0xfff4d0}));
        hl.position.set(0,.55,-2.3);car.add(hl);
        const hlGlow=new THREE.Mesh(new THREE.SphereGeometry(0.35,6,6),new THREE.MeshBasicMaterial({color:0xffeeaa,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false}));
        hlGlow.position.set(0,.55,-2.5);car.add(hlGlow);
        const tl2=new THREE.Mesh(new THREE.BoxGeometry(1.5,.12,.08),new THREE.MeshBasicMaterial({color:0xff2818}));
        tl2.position.set(0,.6,2.4);car.add(tl2);
        const tlGlow=new THREE.Mesh(new THREE.SphereGeometry(0.3,6,6),new THREE.MeshBasicMaterial({color:0xff3020,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false}));
        tlGlow.position.set(0,.6,2.6);car.add(tlGlow);
        const onX=Math.random()<0.5;
        const pl=pickLane(onX);
        car.rotation.y=onX?(pl.dir>0?Math.PI/2:-Math.PI/2):(pl.dir>0?0:Math.PI);
        scene.add(car);
        window.__movingCars.push({m:car,onX,lane:pl.lane,dir:pl.dir,pos:(Math.random()-.5)*900,spd:16+Math.random()*12});
      }
    }
    window.__movingCars.forEach(c=>{
      c.pos+=c.spd*c.dir*dt;
      if(c.pos>520)c.pos=-520;if(c.pos<-520)c.pos=520;
      if(c.onX)c.m.position.set(c.pos,0,c.lane);
      else c.m.position.set(c.lane,0,c.pos);
    });
    if(window.__waterTex)window.__waterTex.offset.y+=dt*0.015;
    if(!window.__hwyCars){
      window.__hwyCars=[];
      function mkVehicle(kind){
        const g=new THREE.Group();
        const col=[0xb03030,0x3050a0,0xd8d8d8,0x222428,0xc8a030,0x3a5a3a][Math.floor(Math.random()*6)];
        if(kind===0){
          const bod=new THREE.Mesh(new THREE.BoxGeometry(2,0.85,4.4),new THREE.MeshLambertMaterial({color:col}));bod.position.y=0.7;g.add(bod);
          const cab=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.6,2.2),new THREE.MeshLambertMaterial({color:0x161c22}));cab.position.y=1.35;g.add(cab);
        }else if(kind===1){
          const bod=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.8,5.4),new THREE.MeshLambertMaterial({color:col}));bod.position.y=1.2;g.add(bod);
          const cab=new THREE.Mesh(new THREE.BoxGeometry(2.1,1.4,1.4),new THREE.MeshLambertMaterial({color:0x161c22}));cab.position.set(0,1.1,-2.6);g.add(cab);
        }else{
          const bod=new THREE.Mesh(new THREE.BoxGeometry(2.4,2.4,9),new THREE.MeshLambertMaterial({color:col}));bod.position.y=1.4;g.add(bod);
          for(let w=0;w<4;w++){const win=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.8,0.08),new THREE.MeshBasicMaterial({color:0xffe8b0}));win.position.set(-3+w*2,1.7,4.55);g.add(win);}
        }
        const hl=new THREE.Mesh(new THREE.BoxGeometry(kind===2?2.2:1.8,.15,.1),new THREE.MeshBasicMaterial({color:0xfff0c0}));
        hl.position.set(0,0.6,kind===2?-4.4:(kind===1?-2.6:-2.2));g.add(hl);
        const tl3=new THREE.Mesh(new THREE.BoxGeometry(kind===2?2.2:1.8,.15,.1),new THREE.MeshBasicMaterial({color:0xff3020}));
        tl3.position.set(0,0.6,kind===2?4.4:(kind===1?2.6:2.2));g.add(tl3);
        const vWheelG=new THREE.CylinderGeometry(kind===2?0.5:0.4,kind===2?0.5:0.4,0.3,10);
        const vWheelM=new THREE.MeshLambertMaterial({color:0x0c0c0c});
        const wz=kind===2?[-3.6,3.6]:(kind===1?[-1.8,1.8]:[-1.4,1.4]);
        const wx=kind===2?1.15:(kind===1?1.05:0.95);
        wz.forEach(z=>{
          [-wx,wx].forEach(x=>{
            const wh=new THREE.Mesh(vWheelG,vWheelM);wh.rotation.z=Math.PI/2;wh.position.set(x,kind===2?0.5:0.4,z);g.add(wh);
          });
        });
        return g;
      }
      for(let i=0;i<15;i++){
        const kind=Math.random()<0.55?0:(Math.random()<0.7?1:2);
        const v=mkVehicle(kind);
        const lane=Math.random()<.5?-3.5:3.5;
        v.rotation.y=lane<0?0:Math.PI;
        scene.add(v);
        window.__hwyCars.push({m:v,lane,pos:(Math.random()-.5)*CITY*1.9,spd:(kind===2?12:kind===1?16:22)+Math.random()*8,dir:lane<0?1:-1});
      }
    }
    window.__hwyCars.forEach(c=>{
      c.pos+=c.spd*c.dir*dt;
      if(c.pos>CITY)c.pos=-CITY;if(c.pos<-CITY)c.pos=CITY;
      c.m.position.set(c.pos,17.4,HWY_Z+c.lane);
    });
    // pedestrians read as sub-pixel twinkling dots from high altitude — cull the whole instanced
    // batch (2 draw calls) above a threshold, with hysteresis so it doesn't pop back and forth
    if(window.__pedHidden===undefined)window.__pedHidden=false;
    if(heli.position.y>140)window.__pedHidden=true;else if(heli.position.y<115)window.__pedHidden=false;
    pedBodyMesh.visible=pedHeadMesh.visible=!window.__pedHidden;
    // pedestrians: sidewalk walkers + crossing walkers, animated via instance-matrix updates (cheap; 0 extra draw calls)
    if(peds.length&&!window.__pedHidden){
      const pdum=window.__pedDummy||(window.__pedDummy=new THREE.Object3D());
      for(let i=0;i<peds.length;i++){
        const p=peds[i];
        p.pos+=p.spd*p.dir*dt;
        if(p.wrap){if(p.pos>p.max)p.pos=p.min;if(p.pos<p.min)p.pos=p.max;}
        else if(p.pos>p.max||p.pos<p.min){p.dir*=-1;p.pos=Math.max(p.min,Math.min(p.max,p.pos));}
        p.phase+=dt*6;
        const wx=p.axis==='x'?p.pos:p.fixed, wz=p.axis==='x'?p.fixed:p.pos;
        const bob=Math.abs(Math.sin(p.phase))*0.06;
        const yawP=p.axis==='x'?(p.dir>0?Math.PI/2:-Math.PI/2):(p.dir>0?0:Math.PI);
        pdum.position.set(wx,0.5+bob,wz);pdum.rotation.set(0,yawP,0);pdum.updateMatrix();
        pedBodyMesh.setMatrixAt(i,pdum.matrix);
        pdum.position.y=1.08+bob;pdum.updateMatrix();
        pedHeadMesh.setMatrixAt(i,pdum.matrix);
      }
      pedBodyMesh.instanceMatrix.needsUpdate=true;pedHeadMesh.instanceMatrix.needsUpdate=true;
    }
    if(cockpitMode){
      cam.position.copy(heli.position).add(new THREE.Vector3(0,1.0,-0.9).applyQuaternion(heli.quaternion));
      cam.lookAt(heli.position.clone().add(new THREE.Vector3(0,.3,-40).applyQuaternion(heli.quaternion)));
    }else{
      const cpos=heli.position.clone().add(new THREE.Vector3(Math.sin(yaw)*24,10,Math.cos(yaw)*24));
      cam.position.lerp(cpos,5*dt);
      cam.lookAt(heli.position.clone().add(fwd.clone().multiplyScalar(10)));
    }
    cam.position.y+=Math.sin(now/28)*0.03;
    if(shake>0){cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake;}
    sky.position.copy(cam.position);
    window.__ring.position.x=cam.position.x;window.__ring.position.z=cam.position.z;
    moonSprite.position.set(cam.position.x-600,500,cam.position.z-1200);
    moonHalo.position.copy(moonSprite.position);
    if(!cockpitMode && Math.floor(now/200)%5===0){
      heli.visible=false;
      cubeCam.position.copy(heli.position);
      cubeCam.update(renderer,scene);
      heli.visible=true;
    }
    sun.position.copy(heli.position).add(new THREE.Vector3(180,300,-220));
    sun.target=heli;
    rim.position.copy(heli.position).add(new THREE.Vector3(-200,120,260));
    rim.target=heli;
    cockpitGroup.visible=cockpitMode;
    heli.visible=!cockpitMode;
    drawDashMFD();
    const tp=document.getElementById('taskPanel');
    if(hostage&&hostage.state==='pad')tp.textContent='HOSTAGE ABOARD — PROCEED TO LZ BEACON, TIME CRITICAL';
    else if(hostage&&hostage.state==='seek')tp.textContent='SURVIVOR BEACON DETECTED — FLY LOW AND EXTRACT';
    else tp.textContent='SCANNING SECTOR FOR SURVIVORS...';
    drawHUD(now);
    radarTexMFD.needsUpdate=true;horizonTexMFD.needsUpdate=true;tacTexMFD.needsUpdate=true;
    gauges.forEach(gg=>{
      const v=THREE.MathUtils.clamp(gg.getVal(),gg.range[0],gg.range[1]);
      const f=(v-gg.range[0])/(gg.range[1]-gg.range[0]);
      gg.needleSpin.rotation.z=-Math.PI*0.75+f*Math.PI*1.5;
    });
    glarePlane.material.opacity=0.35+Math.abs(roll)*0.6+Math.abs(pitch)*0.3;
  }else{
    // cinematic menu flythrough around the tower (real-game feel)
    const t=now/11000;
    const cx=TOWER.x+Math.cos(t)*250, cz=TOWER.z+Math.sin(t)*250;
    cam.position.lerp(new THREE.Vector3(cx,74+Math.sin(t*2.1)*30,cz),0.02);
    cam.lookAt(TOWER.x,66,TOWER.z);
    sky.position.copy(cam.position);
    window.__ring.position.x=cam.position.x;window.__ring.position.z=cam.position.z;
    moonSprite.position.set(cam.position.x-600,500,cam.position.z-1200);
    moonHalo.position.copy(moonSprite.position);
    clouds.forEach(cl=>cl.lookAt(cam.position));
    groundHaze.forEach(gh=>gh.lookAt(cam.position));
    pulseSigns.forEach(s=>{
      s.ph+=dt*(s.fast?14:3);
      const v=s.fast?(Math.random()<0.06?0.2:1):(0.75+0.25*Math.sin(s.ph));
      s.g.material.opacity=0.2*v;
    });
    screenT+=dt;
    if(screenT>0.5){bigScreens.forEach(bs=>bs.draw(now/1600));screenT=0;}
    if(window.__beacon)window.__beacon.visible=(now%1400)<800;
  }
  renderPost();
}
requestAnimationFrame(loop);
onresize=()=>{
  renderer.setSize(W(),H());cam.aspect=W()/H();cam.updateProjectionMatrix();
  sizeHUD();
  bw=Math.floor(W()/3);bh=Math.floor(H()/3);
  bw2=Math.max(2,Math.floor(bw/2));bh2=Math.max(2,Math.floor(bh/2));
  sceneRT.setSize(W(),H());
  brightRT.setSize(bw,bh);blurRT1.setSize(bw,bh);blurRT2.setSize(bw,bh);
  wideRT1.setSize(bw2,bh2);wideRT2.setSize(bw2,bh2);
  blurMat.uniforms.res.value.set(bw,bh);
};
</script>
